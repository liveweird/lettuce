<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome (mobile address bar, PWA title bar): the canvas colour per OS scheme.
         public/color-scheme.js points both at the chosen scheme when the user overrides it.
         The hexes are LIGHT_TOKENS.canvas / DARK_TOKENS.canvas (src/themeVariables.ts); src/browserChrome.test.ts pins them. -->
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1f1f" media="(prefers-color-scheme: dark)" />
    <script src="/color-scheme.js"></script>
    <title>Lettuce</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
