services:
  postgres:
    # Keep this digest aligned with Kubernetes and PostgresTestSupport.
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    container_name: lettuce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lettuce
      POSTGRES_USER: lettuce
      POSTGRES_PASSWORD: lettuce
    # Loopback-bound: this is a local demo, so nothing needs to reach the DB from another host.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres 18+ images keep data in a versioned subdir of /var/lib/postgresql;
      # mounting the pre-18 /var/lib/postgresql/data path makes the container unhealthy.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lettuce -d lettuce"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    # Local mail catcher for the demo: the app delivers password-reset emails here.
    # Read them at http://localhost:8025.
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    container_name: lettuce-mailpit
    restart: unless-stopped
    # Loopback-bound (see postgres) — the mail UI is for the local operator only.
    ports:
      - "127.0.0.1:8025:8025"

  teams-stub:
    # Local stand-in for Microsoft Teams (v4.5.0) — the "Mailpit for Teams": a WireMock
    # server answering the three Microsoft endpoints the Teams notification channel calls
    # (Entra token, Graph user lookup, Bot Connector conversation + activity) from the
    # mappings in dev/teams-stub/. Every direct message the app sends lands in its request
    # journal: http://localhost:8089/__admin/requests. A member id containing
    # "teams-not-installed" answers the real 403 ForbiddenOperationException.
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    container_name: lettuce-teams-stub
    restart: unless-stopped
    command: ["--global-response-templating", "--disable-banner", "--max-request-journal-entries=5000"]
    volumes:
      - ./dev/teams-stub:/home/wiremock:ro
    # Loopback-bound (see postgres) — the journal is for the local operator only.
    ports:
      - "127.0.0.1:8089:8080"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lettuce-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/lettuce
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/lettuce
      POSTGRES_USER: lettuce
      POSTGRES_PASSWORD: lettuce
      # This compose file is the LOCAL DEMO (clone & run over plain http://localhost:8080).
      # Development mode keeps HSTS/HTTPS-redirect off and tolerates the demo credentials
      # below. Any real deployment runs the image as shipped (KTOR_DEVELOPMENT=false), which
      # fail-closes on this JWT key and on the seeded 'changeme' passwords.
      KTOR_DEVELOPMENT: "true"
      # Bundled-demo signing key so tokens can't be forged with the placeholder "secret".
      # It is committed to the repo and therefore BURNED: production mode refuses to start
      # with it. Set your own (e.g. `openssl rand -hex 32`) for any real deployment.
      JWT_SECRET: "${JWT_SECRET:-dev-only-9f3c1a7b2e8d4655b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d}"
      # Bundled-demo key for the at-rest encryption of feedback content — committed, thus
      # BURNED (production mode refuses it). Set your own: `openssl rand -hex 32`. Changing
      # it after data exists requires the rotation procedure (DATA_ENCRYPTION_KEY_PREVIOUS).
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-63c71985aa36dfe66c2cb0fa341e8c9cd365734ad562b64c22a2c96674d515d6}"
      # Deliver password-reset emails to the bundled Mailpit (UI at :8025) so the
      # self-service reset flow is fully functional in the demo.
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: lettuce@localhost
      MAIL_APP_URL: http://localhost:8080
      # The read-only integration GraphQL API (v3.0.0) — on in the local demo so it can be
      # tried (and e2e-exercised) out of the box; the shipped image default is OFF.
      INTEGRATION_ENABLED: "true"
      # Teams notification channel (v4.5.0) against the local teams-stub above. Non-Microsoft
      # base URLs and this obviously fake secret are accepted in development mode ONLY —
      # production pins the three URLs to Microsoft's public cloud (infra/teams/Teams.kt).
      TEAMS_TRANSPORT: botframework
      TEAMS_TENANT_ID: 00000000-0000-0000-0000-000000000000
      TEAMS_APP_ID: 11111111-1111-1111-1111-111111111111
      TEAMS_APP_SECRET: dev-only-fake-teams-secret
      TEAMS_LOGIN_BASE_URL: http://teams-stub:8080/login
      TEAMS_GRAPH_BASE_URL: http://teams-stub:8080/graph
      TEAMS_SERVICE_URL: http://teams-stub:8080/connector/
    # Loopback-bound: browse the demo at http://localhost:8080 on this machine only.
    ports:
      - "127.0.0.1:8080:8080"
    # Ceiling for the tuned JVM (SerialGC + -Xmx256m + C1, baked into bin/server): ~270 MiB RSS
    # under light load, so 512 MiB leaves comfortable headroom and bounds the container.
    mem_limit: 512m

volumes:
  postgres-data:
