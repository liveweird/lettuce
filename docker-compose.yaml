services:
  postgres:
    image: postgres:17-alpine
    container_name: lettuce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lettuce
      POSTGRES_USER: lettuce
      POSTGRES_PASSWORD: lettuce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lettuce -d lettuce"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lettuce-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/lettuce
      POSTGRES_R2DBC_URL: r2dbc:postgresql://postgres:5432/lettuce
      POSTGRES_USER: lettuce
      POSTGRES_PASSWORD: lettuce
    ports:
      - "8080:8080"

volumes:
  postgres-data:
