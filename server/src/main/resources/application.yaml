ktor:
  # Development default for :server:run and tests; the Docker image ships
  # KTOR_DEVELOPMENT=false (production mode: JWT/seed fail-closed checks active,
  # HSTS + HTTPS redirect on).
  development: "$KTOR_DEVELOPMENT:true"
  deployment:
    port: 8080
  application:
    modules:
      # — base plugins
      - ch.nokillswit.plugins.HttpKt.configureHttp
      - ch.nokillswit.plugins.SecurityHeadersKt.configureSecurityHeaders
      - ch.nokillswit.plugins.MonitoringKt.configureMonitoring
      - ch.nokillswit.plugins.SerializationKt.configureSerialization
      - ch.nokillswit.plugins.SecurityKt.configureSecurity
      - ch.nokillswit.plugins.ErrorHandlingKt.configureErrorHandling
      - ch.nokillswit.plugins.OpenTelemetryKt.configureOpenTelemetry
      - ch.nokillswit.plugins.AutoHeadResponseKt.configureAutoHeadResponse
      - ch.nokillswit.plugins.ResourcesKt.configureResources
      # — infrastructure
      - ch.nokillswit.infra.mail.MailKt.configureMail
      - ch.nokillswit.infra.crypto.CryptoKt.configureCrypto
      - ch.nokillswit.infra.db.FlywayKt.configureFlyway
      - ch.nokillswit.infra.db.DatabaseKt.configureDatabase
      - ch.nokillswit.infra.db.BootstrapKt.configureBootstrap
      # — features
      - ch.nokillswit.users.UserRoutesKt.configureUserRoutes
      - ch.nokillswit.teams.TeamRoutesKt.configureTeamRoutes
      - ch.nokillswit.feedbacks.FeedbackRoutesKt.configureFeedbackRoutes
      - ch.nokillswit.oneonones.OneOnOneRoutesKt.configureOneOnOneRoutes
      - ch.nokillswit.goals.GoalRoutesKt.configureGoalRoutes
      - ch.nokillswit.teamkpis.TeamKpiRoutesKt.configureTeamKpiRoutes
      - ch.nokillswit.reviews.ReviewPeriodRoutesKt.configureReviewPeriodRoutes
      - ch.nokillswit.reviews.PerformanceReviewRoutesKt.configurePerformanceReviewRoutes
      - ch.nokillswit.dashboard.DashboardRoutesKt.configureDashboardRoutes
      - ch.nokillswit.templates.TemplateRoutesKt.configureTemplateRoutes
      - ch.nokillswit.dictionaries.DictionaryRoutesKt.configureDictionaryRoutes
      - ch.nokillswit.notifications.NotificationRoutesKt.configureNotificationRoutes
      - ch.nokillswit.alerts.AlertRoutesKt.configureAlertRoutes
      - ch.nokillswit.auth.AuthRoutesKt.configureAuthRoutes
      # — catch-all router
      - ch.nokillswit.plugins.RoutingKt.configureRouting

security:
  # Per-account login lockout (complements the per-IP rate limit): after `threshold`
  # consecutive failures for one email, further attempts are 429 for `durationSeconds`.
  # A successful login resets the counter. In-memory, per-instance.
  lockout:
    threshold: "$LOGIN_LOCKOUT_THRESHOLD:5"
    durationSeconds: "$LOGIN_LOCKOUT_DURATION_SECONDS:900"
  # Self-service password reset (POST /api/v1/password-reset): one request per
  # submitted email per interval, uniformly whether or not the account exists.
  # In-memory, per-instance, like the lockout above.
  passwordReset:
    minIntervalSeconds: "$PASSWORD_RESET_MIN_INTERVAL_SECONDS:60"
  csrf:
    # TEMPLATE PLACEHOLDER — CSRF protection is off by default because this API
    # authenticates via bearer JWT in the Authorization header, which browsers
    # do not auto-attach to cross-origin requests. Enable only if you move to
    # cookie-based session auth.
    enabled: "$SECURITY_CSRF_ENABLED:false"
  encryption:
    # AES-256-GCM key (64 hex chars, `openssl rand -hex 32`) for application-level
    # encryption of feedback content at rest (feedbacks.content/requester_message).
    # The default is a committed dev-only key (see infra/crypto/Crypto.kt — it is on
    # the burned list, so production startup refuses it). LOSING THIS KEY MEANS
    # LOSING ALL FEEDBACK CONTENT — back it up separately from the DB backups.
    key: "$DATA_ENCRYPTION_KEY:650180357f3898db23d295f5bd7ce2ee52bfd280aefb562e75a3a64e8b3b80f3"
    # Decrypt-only fallback for key rotation: set the OLD key here and the new one
    # above, boot once (the startup backfill re-encrypts every row under the new
    # key), then remove it.
    previousKey: "$DATA_ENCRYPTION_KEY_PREVIOUS:"

jwt:
  secret: "$JWT_SECRET:secret"
  issuer: "$JWT_ISSUER:http://0.0.0.0:8080/"
  audience: "$JWT_AUDIENCE:lettuce-api"
  realm: "$JWT_REALM:lettuce-api"
  # Short-lived access token used as the API bearer; the SPA silently refreshes it.
  accessExpiresInSeconds: "$JWT_ACCESS_EXPIRES_IN_SECONDS:900"
  # Longer-lived refresh token exchanged at POST /api/v1/refresh. Pure-sliding: each
  # refresh mints a fresh pair, so an idle session ends only after this window elapses.
  refreshExpiresInSeconds: "$JWT_REFRESH_EXPIRES_IN_SECONDS:3600"

bootstrap:
  # When set and the V6 seed admin still has the well-known "changeme" password,
  # it is rotated to this value at startup (idempotent — a later admin-chosen
  # password is never overwritten). Outside development mode, startup FAILS if
  # any active account still carries the seed password.
  adminInitialPassword: "$ADMIN_INITIAL_PASSWORD:"

http:
  # Set true when the app runs behind a reverse proxy / ingress that terminates TLS.
  # Installs XForwardedHeaders so the client IP (rate limiting) and scheme (HTTPS
  # redirect) come from X-Forwarded-* headers. The proxy MUST set X-Forwarded-For
  # and X-Forwarded-Proto and strip client-supplied values.
  behindProxy: "$HTTP_BEHIND_PROXY:false"
  # Comma-separated cross-origin hosts allowed to call the API (e.g.
  # "app.example.com,other.example.com:8443"). Empty (the default) = CORS is not
  # installed at all: production is single-origin (Ktor serves the SPA) and local
  # dev goes through the Vite proxy, so no cross-origin caller exists.
  corsHosts: "$CORS_ALLOWED_HOSTS:"
  # Swagger UI + the OpenAPI spec at /openapi. Blank (default) = follow the mode:
  # served in development, hidden in production. Set "true" to expose them in a
  # trusted production environment, "false" to hide them even in development.
  exposeOpenApi: "$HTTP_EXPOSE_OPENAPI:"

web:
  # When set, the server serves the built React SPA from this directory (static
  # assets + SPA fallback to index.html). Empty in local dev, where Vite serves
  # the SPA on :5173; set to /app/web inside the Docker image.
  staticDir: "$WEB_STATIC_DIR:"

mail:
  # Outbound-email transport (infra/mail/Mail.kt): `log` (dev default — messages,
  # including generated passwords, go to the ch.nokillswit.mail logger instead of
  # being sent; production startup REFUSES it), `smtp` (real delivery; blank host
  # refuses startup in any mode), or `disabled` (the Docker image default — the
  # password-reset endpoint answers 503).
  transport: "$MAIL_TRANSPORT:log"
  smtp:
    host: "$SMTP_HOST:"
    port: "$SMTP_PORT:587"
    user: "$SMTP_USER:"
    password: "$SMTP_PASSWORD:"
    startTls: "$SMTP_STARTTLS:true"
  from: "$MAIL_FROM:lettuce@localhost"
  # Optional absolute URL of this deployment (e.g. https://lettuce.example.com);
  # when set, outbound emails include a sign-in link.
  appUrl: "$MAIL_APP_URL:"

postgres:
  jdbcUrl: "$POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/lettuce"
  r2dbcUrl: "$POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/lettuce"
  user: "$POSTGRES_USER:lettuce"
  password: "$POSTGRES_PASSWORD:lettuce"
