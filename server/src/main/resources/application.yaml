ktor:
  # Development default for :server:run and tests; the Docker image ships
  # KTOR_DEVELOPMENT=false (production mode: JWT/seed fail-closed checks active,
  # HSTS + HTTPS redirect on).
  development: "$KTOR_DEVELOPMENT:true"
  deployment:
    port: 8080
  application:
    modules:
      # — base plugins
      - ch.nokillswit.plugins.HttpKt.configureHttp
      # Request-body size cap (v4.14.1). Phase-driven, so its line position is immaterial: the
      # Content-Length check runs in the `Validators` phase (before routing, auth and the rate-limit
      # buckets), the streaming cut-off at `call.receive`. Reads http.maxBodyBytes.
      - ch.nokillswit.plugins.BodyLimitKt.configureBodyLimit
      - ch.nokillswit.plugins.SecurityHeadersKt.configureSecurityHeaders
      - ch.nokillswit.plugins.MonitoringKt.configureMonitoring
      # Per-request DB metrics (Server-Timing + the slow-request log). Right after Monitoring, before
      # any module that touches the database — it wraps the whole call pipeline in the metrics element.
      - ch.nokillswit.plugins.RequestTimingKt.configureRequestTiming
      # Health endpoints (/healthz liveness, /readyz readiness) — the readiness handler reads the
      # DB at request time, so this module's boot position relative to configureDatabase is immaterial.
      - ch.nokillswit.plugins.HealthKt.configureHealth
      - ch.nokillswit.plugins.SerializationKt.configureSerialization
      - ch.nokillswit.plugins.SecurityKt.configureSecurity
      - ch.nokillswit.plugins.ErrorHandlingKt.configureErrorHandling
      - ch.nokillswit.plugins.OpenTelemetryKt.configureOpenTelemetry
      - ch.nokillswit.plugins.AutoHeadResponseKt.configureAutoHeadResponse
      - ch.nokillswit.plugins.ResourcesKt.configureResources
      # — infrastructure
      - ch.nokillswit.infra.mail.MailKt.configureMail
      - ch.nokillswit.infra.teams.TeamsKt.configureTeams
      - ch.nokillswit.infra.crypto.CryptoKt.configureCrypto
      - ch.nokillswit.infra.db.FlywayKt.configureFlyway
      - ch.nokillswit.infra.db.DatabaseKt.configureDatabase
      - ch.nokillswit.infra.db.BootstrapKt.configureBootstrap
      # — features
      - ch.nokillswit.users.UserRoutesKt.configureUserRoutes
      - ch.nokillswit.users.CareerPositionRoutesKt.configureCareerPositionRoutes
      - ch.nokillswit.activity.ActivityRoutesKt.configureActivityRoutes
      - ch.nokillswit.teams.TeamRoutesKt.configureTeamRoutes
      - ch.nokillswit.feedbacks.FeedbackRoutesKt.configureFeedbackRoutes
      - ch.nokillswit.oneonones.OneOnOneRoutesKt.configureOneOnOneRoutes
      - ch.nokillswit.goals.GoalRoutesKt.configureGoalRoutes
      - ch.nokillswit.teamkpis.TeamKpiRoutesKt.configureTeamKpiRoutes
      - ch.nokillswit.reviews.ReviewPeriodRoutesKt.configureReviewPeriodRoutes
      - ch.nokillswit.reviews.PerformanceReviewRoutesKt.configurePerformanceReviewRoutes
      - ch.nokillswit.daysoff.PublicHolidayRoutesKt.configurePublicHolidayRoutes
      - ch.nokillswit.daysoff.DaysOffRoutesKt.configureDaysOffRoutes
      - ch.nokillswit.pulse.PulseRoutesKt.configurePulseRoutes
      - ch.nokillswit.impactlog.ImpactLogRoutesKt.configureImpactLogRoutes
      - ch.nokillswit.succession.SuccessionRoutesKt.configureSuccessionRoutes
      - ch.nokillswit.dashboard.DashboardRoutesKt.configureDashboardRoutes
      - ch.nokillswit.templates.TemplateRoutesKt.configureTemplateRoutes
      - ch.nokillswit.dictionaries.DictionaryRoutesKt.configureDictionaryRoutes
      - ch.nokillswit.notifications.NotificationRoutesKt.configureNotificationRoutes
      - ch.nokillswit.alerts.AlertRoutesKt.configureAlertRoutes
      - ch.nokillswit.integration.IntegrationClientRoutesKt.configureIntegrationClientRoutes
      - ch.nokillswit.auth.AuthRoutesKt.configureAuthRoutes
      # — document sharing (after AuthRoutes: its mutation routes wrap the per-caller "shares" and
      #   "shares-batch" RateLimit buckets AuthRoutes' single install registers)
      - ch.nokillswit.sharing.ShareRoutesKt.configureShareRoutes
      # — integration API (after AuthRoutes: its route wrapper needs the RateLimit bucket
      #   AuthRoutes' single install registers; registers nothing when integration.enabled=false)
      - ch.nokillswit.integration.IntegrationKt.configureIntegration
      # — catch-all router
      - ch.nokillswit.plugins.RoutingKt.configureRouting

security:
  # Per-account login lockout (complements the per-IP rate limit): after `threshold`
  # consecutive failures for one email, further attempts are 429 for `durationSeconds`.
  # A successful login resets the counter. DB-backed since v3.11.0/V81 — shared by
  # replicas, a restart no longer resets it.
  lockout:
    threshold: "$LOGIN_LOCKOUT_THRESHOLD:5"
    durationSeconds: "$LOGIN_LOCKOUT_DURATION_SECONDS:900"
  # Per-IP token bucket on POST /api/v1/login. The per-account lockout above is the
  # actual brute-force defence and is unaffected by this. Blank FOLLOWS THE MODE:
  # 10/min in production, 1000/min in development — the e2e suite drives ~90 logins
  # from a single host and would otherwise spend minutes sleeping out the bucket.
  # Set a number to pin it in either mode.
  rateLimit:
    loginPerMinute: "$LOGIN_RATE_LIMIT_PER_MINUTE:"
  # Self-service password reset (POST /api/v1/password-reset): one request per
  # submitted email per interval, uniformly whether or not the account exists.
  # DB-backed since v3.11.0/V81, like the lockout above.
  passwordReset:
    minIntervalSeconds: "$PASSWORD_RESET_MIN_INTERVAL_SECONDS:60"
  # Email MFA (opt-in per user via the MFA feature flag): a login with correct credentials
  # mints a challenge and emails a 6-digit code; the code must come back to
  # POST /api/v1/login/mfa within the TTL and attempt cap. Challenges are DB-backed
  # since v3.11.0/V81, like the lockout above (a restart no longer invalidates them).
  mfa:
    codeTtlSeconds: "$MFA_CODE_TTL_SECONDS:300"
    maxAttempts: "$MFA_MAX_ATTEMPTS:5"
    # Checkup #36 Tier D: caps LIVE (unexpired) pending challenges per account — blunts an
    # email-flood by someone holding the password (only the per-IP login bucket limited this
    # before; rotating hosts sidestep it).
    maxPendingChallenges: "$MFA_MAX_PENDING_CHALLENGES:5"
  csrf:
    # TEMPLATE PLACEHOLDER — CSRF protection is off by default because this API
    # authenticates via bearer JWT in the Authorization header, which browsers
    # do not auto-attach to cross-origin requests. Enable only if you move to
    # cookie-based session auth.
    enabled: "$SECURITY_CSRF_ENABLED:false"
  encryption:
    # AES-256-GCM key (64 hex chars, `openssl rand -hex 32`) for application-level
    # encryption of feedback content at rest (feedbacks.content/requester_message).
    # The default is a committed dev-only key (see infra/crypto/Crypto.kt — it is on
    # the burned list, so production startup refuses it). LOSING THIS KEY MEANS
    # LOSING ALL FEEDBACK CONTENT — back it up separately from the DB backups.
    key: "$DATA_ENCRYPTION_KEY:650180357f3898db23d295f5bd7ce2ee52bfd280aefb562e75a3a64e8b3b80f3"
    # Decrypt-only fallback for key rotation: set the OLD key here and the new one
    # above, boot once (the startup backfill re-encrypts every row under the new
    # key), then remove it.
    previousKey: "$DATA_ENCRYPTION_KEY_PREVIOUS:"

jwt:
  secret: "$JWT_SECRET:secret"
  issuer: "$JWT_ISSUER:http://0.0.0.0:8080/"
  audience: "$JWT_AUDIENCE:lettuce-api"
  realm: "$JWT_REALM:lettuce-api"
  # Short-lived access token used as the API bearer; the SPA silently refreshes it.
  accessExpiresInSeconds: "$JWT_ACCESS_EXPIRES_IN_SECONDS:900"
  # Longer-lived refresh token exchanged at POST /api/v1/refresh. Pure-sliding: each
  # refresh mints a fresh pair, so an idle session ends only after this window elapses.
  refreshExpiresInSeconds: "$JWT_REFRESH_EXPIRES_IN_SECONDS:3600"

bootstrap:
  # When set and the V6 seed admin still has the well-known "changeme" password,
  # it is rotated to this value at startup (idempotent — a later admin-chosen
  # password is never overwritten). Outside development mode, startup FAILS if
  # any active account still carries the seed password.
  adminInitialPassword: "$ADMIN_INITIAL_PASSWORD:"

http:
  # Set true when the app runs behind a reverse proxy / ingress that terminates TLS.
  # The client IP (rate limiting) then comes from X-Forwarded-For (folded across every header
  # line and read from the end, plugins/Http.kt resolveForwardedForOrigin) and the scheme/host
  # (HTTPS redirect) from X-Forwarded-Proto/-Host via XForwardedHeaders. The proxy MUST set
  # those three and overwrite or strip client-supplied values — its own X-Forwarded-For value
  # must be the physically LAST one (X-Forwarded-Port is not read) —
  # k8s/templates/app-ingress.yaml is the reference (ingress-nginx does so by default).
  behindProxy: "$HTTP_BEHIND_PROXY:false"
  # Trusted proxies in front of the app when behindProxy is true (default 1 = the
  # ingress alone). X-Forwarded-For is read from the END of the list: 1 trusts the
  # value the last proxy wrote; N skips the N-1 addresses trusted proxies appended
  # after the client's. Only count proxies that APPEND (nginx
  # proxy_add_x_forwarded_for, ingress-nginx with compute-full-forwarded-for);
  # ingress-nginx's default REPLACES the header, so 1 is right. Anything before the
  # values your proxies wrote is client-supplied and spoofable — never the first value.
  proxyHops: "$HTTP_PROXY_HOPS:1"
  # Comma-separated cross-origin hosts allowed to call the API (e.g.
  # "app.example.com,other.example.com:8443"). Empty (the default) = CORS is not
  # installed at all: production is single-origin (Ktor serves the SPA) and local
  # dev goes through the Vite proxy, so no cross-origin caller exists.
  corsHosts: "$CORS_ALLOWED_HOSTS:"
  # Swagger UI + the OpenAPI spec at /openapi. Blank (default) = follow the mode:
  # served in development, hidden in production. Set "true" to expose them in a
  # trusted production environment, "false" to hide them even in development.
  exposeOpenApi: "$HTTP_EXPOSE_OPENAPI:"
  # Request-body size cap (v4.14.1, plugins/BodyLimit.kt): every request body is bounded BEFORE it is
  # read in full — a declared Content-Length over the cap is refused before routing, an undeclared/
  # chunked body is cut off at the cap while streaming; either way 413 + problem+json. Wire bytes:
  # compressed request bodies are never inflated (plugins/Http.kt). ONE cap for every route: the
  # contract-valid worst case is a 1:1 meeting document — three lists of 100 items x 4000 chars =
  # 1.2M chars, ~3.6 MB when every char is 3 UTF-8 bytes — hence 4 MiB (.claude/docs/security-details.md).
  # Keep the ingress cap (k8s/templates/app-ingress.yaml, proxy-body-size) >= this value.
  # Boot-validated 1024..1073741824 in every mode.
  maxBodyBytes: "$HTTP_MAX_BODY_BYTES:4194304"

perf:
  # Per-request DB metrics (plugins/RequestTiming.kt, "Per-request DB metrics" in
  # .claude/docs/observability.md). serverTiming: the `Server-Timing` response header
  # (`db;dur=…;desc="stmt=N tx=M", app;dur=…` — durations and counts only). Blank (default) = follow the
  # mode: sent in development, hidden in production; set "true" to expose it on a trusted production
  # deployment for a measurement window, "false" to hide it even in development.
  serverTiming: "$PERF_SERVER_TIMING:"
  # A request taking at least this many milliseconds logs ONE INFO line on `ch.nokillswit.perf`
  # (always on, independent of the header). Boot-validated 1..600000.
  slowRequestMs: "$PERF_SLOW_REQUEST_MS:1000"

web:
  # When set, the server serves the built React SPA from this directory (static
  # assets + SPA fallback to index.html). Empty in local dev, where Vite serves
  # the SPA on :5173; set to /app/web inside the Docker image.
  staticDir: "$WEB_STATIC_DIR:"

mail:
  # Outbound-email transport (infra/mail/Mail.kt): `log` (dev default — messages,
  # including generated passwords, go to the ch.nokillswit.mail logger instead of
  # being sent; production startup REFUSES it), `smtp` (real delivery; blank host
  # refuses startup in any mode), or `disabled` (the Docker image default — the
  # password-reset endpoint answers 503).
  transport: "$MAIL_TRANSPORT:log"
  smtp:
    host: "$SMTP_HOST:"
    port: "$SMTP_PORT:587"
    user: "$SMTP_USER:"
    password: "$SMTP_PASSWORD:"
    startTls: "$SMTP_STARTTLS:true"
  from: "$MAIL_FROM:lettuce@localhost"
  # Optional absolute URL of this deployment (e.g. https://lettuce.example.com);
  # when set, outbound emails include a sign-in link.
  appUrl: "$MAIL_APP_URL:"

teams:
  # Outbound Microsoft Teams direct-message transport (infra/teams/Teams.kt), the third
  # notification channel (v4.5.0): `disabled` (the deployment default — off, like
  # integration.enabled), `log` (dev-only — messages go to the ch.nokillswit.teams logger instead
  # of being sent; production startup REFUSES it), or `botframework` (the real Bot Framework
  # connector + Microsoft Graph transport; blank tenantId/appId/appSecret refuses startup in any
  # mode).
  transport: "$TEAMS_TRANSPORT:disabled"
  # Azure AD (Entra) tenant id, app (client) id and client secret of the single-tenant bot
  # registration — from lettuce-secrets in Kubernetes. The secret is posted to loginBaseUrl on
  # every token request, which is why production pins the three base URLs below.
  tenantId: "$TEAMS_TENANT_ID:"
  appId: "$TEAMS_APP_ID:"
  appSecret: "$TEAMS_APP_SECRET:"
  # The Microsoft-documented defaults (see the Learn pages cited in TeamsMessenger.kt). Overrides
  # exist ONLY for the local WireMock stub, in development — production must match these exactly
  # or refuse to start (the client secret is posted to loginBaseUrl).
  serviceUrl: "$TEAMS_SERVICE_URL:https://smba.trafficmanager.net/teams/"
  loginBaseUrl: "$TEAMS_LOGIN_BASE_URL:https://login.microsoftonline.com"
  graphBaseUrl: "$TEAMS_GRAPH_BASE_URL:https://graph.microsoft.com"
  # Per-request HTTP timeout for the connector/Graph/token calls (connect timeout is a fixed 5s).
  requestTimeoutSeconds: "$TEAMS_REQUEST_TIMEOUT_SECONDS:10"
  # How long an Unreachable resolve/send outcome (an uninstalled bot, an unknown Graph user, a
  # blocked conversation) is cached before Lettuce tries that recipient again — bounds how often a
  # persistently unreachable user is hammered on every notification.
  unreachableRetryHours: "$TEAMS_UNREACHABLE_RETRY_HOURS:24"

integration:
  # The read-only integration GraphQL API at POST /integration/graphql (contract:
  # server/src/main/resources/graphql/schema.graphqls; see
  # .claude/docs/features/integration-api.md). Default OFF — a deployment opts in
  # explicitly; when disabled the routes are not registered at all (404). The admin
  # key management at /api/v1/integration-clients works regardless of this flag,
  # so keys can be prepared before enabling the endpoint.
  enabled: "$INTEGRATION_ENABLED:false"
  # Per-API-key token bucket (requests/minute) on the /integration endpoints.
  rateLimitPerMinute: "$INTEGRATION_RATE_LIMIT_PER_MINUTE:120"

sharing:
  # Per-caller token bucket (requests/minute) on the document-sharing mutations (POST /shares and
  # POST /shares/{id}/withdraw) — each call fans out a notification and an email mirror.
  rateLimitPerMinute: "$SHARING_RATE_LIMIT_PER_MINUTE:60"
  # The mass share (POST /shares/batch) has its OWN per-caller bucket — one call fans out up to 20
  # summary notices (+ email + Teams). Boot-validated 1..100000 like the one above.
  batchRateLimitPerMinute: "$SHARING_BATCH_RATE_LIMIT_PER_MINUTE:10"
  # Per-(sharer, sharee) notification cap per rolling 24 h (see SHARE_NOTIFICATION_DAILY_CAP_PER_PAIR
  # in sharing/Share.kt): beyond it shares/withdrawals still happen but mint no notification.
  # Blank = the built-in default (20); a number is boot-validated 1..1000.
  notificationDailyCapPerPair: "$SHARING_NOTIFICATION_DAILY_CAP_PER_PAIR:"

feedbacks:
  # The v3.8.0 lazy expiry sweep (FeedbackService.expireOverdueRequests) is a WRITE on the
  # GET /api/v1/feedbacks read path — bounded since v3.11.0 so a burst of list requests
  # doesn't hit the DB on every single one: at most one sweep actually runs per this many
  # seconds per app instance (a per-instance in-memory gate, the DB predicate stays the
  # correctness backstop — an overdue row is picked up by the next sweep that runs, never
  # missed). 0 = every call (the pre-v3.11.0 behavior; the test suite pins this so the
  # existing "every GET sweeps" assertions keep working).
  expirySweepIntervalSeconds: "$FEEDBACK_EXPIRY_SWEEP_INTERVAL_SECONDS:60"

notifications:
  # v3.12.0/V82: NotificationService.purgeStale hard-deletes a notification once it is seen or
  # user-deleted AND older than this many days — the registered exception to the soft-delete
  # convention (notifications are ephemeral UX; the audit log and the feature-local `*_events`
  # tables are the real trail). 0 disables the purge entirely.
  retentionDays: "$NOTIFICATION_RETENTION_DAYS:30"
  # Bounds how often the purge actually runs a DELETE (per app instance) — the same gate shape
  # as feedbacks.expirySweepIntervalSeconds above. 0 = every mint (the test suite pins this).
  purgeIntervalSeconds: "$NOTIFICATION_PURGE_INTERVAL_SECONDS:3600"

activity:
  # v4.9.0/V90: the sign-in trail (`account_events` — SIGNED_IN/SIGNED_OUT, no IP) behind the activity
  # log's ACCOUNT area. AccountEventService hard-deletes a row older than this many days on its write
  # path — the registered exception to the append-only trails (the notifications precedent). 0 keeps
  # the history forever. Boot-validated 0..3650 in infra/db/Database.kt.
  accountRetentionDays: "$ACTIVITY_ACCOUNT_RETENTION_DAYS:90"
  # Bounds how often the purge actually runs a DELETE (per app instance), the same gate shape as
  # notifications.purgeIntervalSeconds above. 0 = every sign-in/out (the test suite pins this).
  # Boot-validated 0..86400.
  accountPurgeIntervalSeconds: "$ACTIVITY_ACCOUNT_PURGE_INTERVAL_SECONDS:3600"

postgres:
  jdbcUrl: "$POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/lettuce"
  r2dbcUrl: "$POSTGRES_R2DBC_URL:r2dbc:postgresql://localhost:5432/lettuce"
  user: "$POSTGRES_USER:lettuce"
  password: "$POSTGRES_PASSWORD:lettuce"
  # Bounded R2DBC connection pool (infra/db/Database.kt, `.claude/docs/persistence.md`
  # "Connection pool") — a plain r2dbc:postgresql:// connect opens one PostgreSQL backend
  # per suspendTransaction with nothing capping how many run at once. Sizing assumes a
  # SINGLE replica: `maxSize × replicas` must stay well under PostgreSQL's default
  # `max_connections = 100`, with room left for Flyway's one short-lived JDBC connection
  # (infra/db/Flyway.kt) and any other client.
  pool:
    # The ceiling on concurrent pooled connections for this instance.
    maxSize: "$POSTGRES_POOL_MAX_SIZE:20"
    # The floor the pool fills up to on its FIRST acquire (r2dbc-pool warms up lazily — no
    # explicit warmup() call — but configureBootstrap's backfill transactions acquire during
    # boot, so these connections are already open before the first request is served).
    initialSize: "$POSTGRES_POOL_INITIAL_SIZE:2"
    # How long a caller waits for a free connection before failing (surfaces as a 500 —
    # see "Connection pool" in persistence.md — rather than a new declared status).
    maxAcquireTimeSeconds: "$POSTGRES_POOL_MAX_ACQUIRE_SECONDS:10"
    # How long an idle pooled connection may sit before the pool recycles it.
    maxIdleTimeSeconds: "$POSTGRES_POOL_MAX_IDLE_SECONDS:600"
    # v4.7.1 — bounding a HUNG database (one that accepts or holds connections but never
    # answers), which nothing else bounds: the driver has no socket read timeout.
    # Every acquire validates the connection with a round trip (ValidationDepth.REMOTE), failing
    # after this many seconds — a frozen or server-killed connection is discarded instead of
    # handed to a request (the pre-v4.7.1 "handed out once, 500" gap, for a SINGLE dropped
    # connection; after a PostgreSQL restart a few requests can still fail until the pool
    # refreshes). A hung database holds a request at most ~2 × maxAcquireTimeSeconds
    # (r2dbc-pool retries a timed-out acquire once).
    maxValidationTimeSeconds: "$POSTGRES_POOL_MAX_VALIDATION_SECONDS:5"
    # Creating a new connection (TCP connect + startup/auth handshake) fails after this long.
    maxCreateConnectionTimeSeconds: "$POSTGRES_POOL_MAX_CREATE_SECONDS:10"
  # The TCP connect alone (the driver's connectTimeout; Netty's default is 30 s).
  connectTimeoutSeconds: "$POSTGRES_CONNECT_TIMEOUT_SECONDS:10"
  # PostgreSQL's server-side statement_timeout for every pooled connection: a statement a LIVE
  # but stuck server runs longer (a lock wait, a runaway query) is cancelled. 0 = no limit.
  # Lettuce's statements are small; Flyway's JDBC connection is not affected.
  statementTimeoutSeconds: "$POSTGRES_STATEMENT_TIMEOUT_SECONDS:30"
