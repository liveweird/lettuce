openapi: 3.1.0
info:
  title: lettuce-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for users, teams, and feedback exchange.

    Authorization model: layered RBAC.
    - Every user is implicitly a regular user; additional global roles
      (`ADMIN`, `HR`) are carried as the `roles` array and only ever
      ADD privileges on top of that baseline. `ADMIN` is the MANAGEMENT
      role: write access to users, teams, templates, and alerts (plus the
      reads those management screens need) — and NOTHING more: on feedbacks,
      1:1 meetings, goals, and notifications an admin is exactly a standard
      user. `HR` is the read-only AUDITOR: it reads every user, feedback,
      1:1 meeting, and goal — drafts included, content never redacted — plus
      the auditor list view (`view=user`), while its WRITE access stays
      exactly regular-user (no management bypasses, and no notification or
      alert-management access). Reads granted by the HR privilege are
      recorded in the security audit trail (`hr.read` / `hr.list`). A person
      needing both capabilities holds both roles. The JWT issued at
      /login carries the caller's `roles` and userId; per-request team
      membership and feedback relationships are looked up from the database.
    - Team-scoped authority: the user identified by `teams.manager_id`
      may mutate the team or its membership (reassigning the manager itself is
      ADMIN-only). Other authenticated users may only read.
    - Feedback access is derived from the `visibility` enum together with
      the caller's relationship to the row (subject / provider / requester).
      Only the provider may modify a feedback record, and ADMIN gets no
      special feedback access at all — read or write (an admin who is
      themselves a party has ordinary party rights).

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8080
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: teams
  - name: feedbacks
  - name: one-on-ones
  - name: goals
  - name: team-kpis
  - name: templates
  - name: dictionaries
  - name: notifications
  - name: alerts

paths:
  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Always answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a new password is generated, its hash replaces the old one (which stops
        working, and all outstanding refresh tokens are invalidated), and the password is sent
        to the account's email address. Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. Answers `503` on deployments without
        outbound email (`MAIL_TRANSPORT=disabled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (password reset unavailable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists, or if the
        token was minted before the user's most recent password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: |
        Any authenticated user may list. Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email`. Default sort is `id` ascending.
          `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `name` — case-insensitive substring match against `name`.
          - `email` — case-insensitive substring match against `email`.
          - `role` — has-role match: only users holding this additional role (`ADMIN`/`HR`).
          - `teamId` — restrict to users who are members of the given team.

        Malformed query parameters (unknown sort field, unknown role, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the user's name.
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the user's email.
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, HR] }
          description: Only users holding this additional role.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Filter to users who are members of the given team.
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        Requires ADMIN. If the request body omits `roles`, the new user gets no additional
        roles (every user is implicitly a regular user).
        With `sendEmail: true` the new user is emailed their credentials (the same bilingual
        welcome message as the mass import); `emailSent` in the response reports the delivery
        outcome (a failure keeps the account). Rejected with `503` before creating anything
        when the deployment has no outbound email (`MAIL_TRANSPORT=disabled`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Email already in use
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (sendEmail requested)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/users/import:
    post:
      tags: [users]
      operationId: importUsers
      summary: Mass-import users from CSV (ADMIN only)
      description: |
        Creates one account per CSV line (`name,email`; an optional literal `name,email`
        header and blank lines are skipped; names may contain commas — the line is split on
        its last comma). Every row imports independently: a parse error, duplicate, or
        failure on one line never affects the others. Each created account is a regular user
        (no additional roles) with a server-generated 16-character password, returned in that row's `password`
        field — shown to the admin ONCE, never retrievable again. With `sendEmails: true`
        each new user is emailed their password (bilingual EN/PL); if the deployment has no
        outbound email (`MAIL_TRANSPORT=disabled`) the request is rejected with `503` before
        importing anything. A delivery failure after creation yields status `EMAIL_FAILED`
        (the account exists; the password is still in the row). `created` counts `CREATED`
        plus `EMAIL_FAILED` rows; `errors` counts `PARSE_ERROR` plus `ERROR` rows. Caps:
        200 data rows / 256 KiB of CSV per request (`400` beyond either). Deliberately not
        rate-limited per IP (unlike the password reset): the endpoint is admin-only and the
        row/size caps already bound the work per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserImportRequest'
      responses:
        '200':
          description: Per-row import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (sendEmails requested)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user by id
      description: Requires the caller to be the target user, ADMIN, or HR (HR reads are audit-logged).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user, not ADMIN, and not HR
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: replaceUser
      summary: Replace a user
      description: |
        Replaces a user's editable representation — `name`, `email`, and `roles` (all required).
        The password is NOT part of this representation (it has its own `PUT /users/{id}/password`
        sub-resource and is preserved here). Requires the caller to be the target user, or ADMIN.
        Only ADMIN may change a user's `roles`; a non-ADMIN caller must send the set the user
        already has, otherwise the request is rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or attempted to change roles
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Email already in use by another user
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: Requires ADMIN.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user may list. Supports offset pagination, sorting, and filtering.

        - Sortable fields: `id`, `name`. Default sort is `id` ascending; `id` ascending
          is always appended as a deterministic tiebreaker.
        - Filters (all optional):
          - `name` — case-insensitive substring match against the team's name.
          - `managerId` — exact match against the team's manager id.
          - `memberId` — restrict to teams the given user is a member of.

        Each returned item includes the manager's `name` resolved via join so the UI
        does not need an N+1 lookup.

        Malformed query parameters (unknown sort field, non-numeric managerId,
        out-of-range page/pageSize) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the team's name.
        - name: managerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the team's manager id.
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Filter to teams the given user is a member of.
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        Any authenticated user may create a team, but the `managerId` in
        the request body must equal the caller's own user id (ADMIN may
        designate any user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new team resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          description: Validation error (e.g. manager in member list, duplicate members, referenced user does not exist)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller attempted to set `managerId` to another user without being ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams/members:
    get:
      tags: [teams]
      operationId: listTeamMembers
      summary: List members of the caller's teams
      description: |
        Lists team members scoped by `view`. Scoping is always relative to the caller,
        including ADMIN callers.

        - `view=member` (the default): members of teams where the caller is a member.
          The caller's own rows are excluded. Team managers never appear — a manager is
          not a `team_members` row. Items carry the peer feedback stats
          `lastFeedbackGivenAt` / `lastFeedbackReceivedAt` (see `TeamMemberListItem`) —
          when the caller last provided this peer feedback, and when this peer last
          provided the caller feedback the caller can see. Peers run no 1:1s with each
          other in this model, so there is no 1:1 stat.
        - `view=managed`: members of teams where the caller is the manager. With
          `includeIndirect=true`, additionally the members of teams managed by anyone in
          the caller's transitive management chain (the caller's indirect reports, each
          shown with the team they hold under their own manager). Items carry the
          dashboard stats `lastOneOnOneDate` / `lastOneOnOneOpenItems` / `lastFeedbackAt`
          / `activeGoalCount` (see `TeamMemberListItem`) with the caller as the 1:1's
          manager / the feedback's provider / the goals' manager, regardless of
          `includeIndirect`.
        - `view=managers`: the managers of teams where the caller is a member. Each item
          describes a manager (in `userId`/`name`/`email`) and the managed team. The
          caller is excluded. Items carry the same dashboard stats fields with this
          manager as the 1:1's manager / the feedback's provider / the goals' manager.

        In every view a user appearing once per shared team repeats the same stats on
        each row. The `lastOneOnOne*`/`lastFeedbackAt`/`activeGoalCount` set is always
        `null` for `view=member`; the given/received pair is always `null` for
        `view=managers` and `view=managed`.

        Every view's items additionally carry the row user's resolved career profile
        (`careerPath` / `careerSpecialization` / `seniorityLevel`) — see
        `TeamMemberListItem`.

        Each item is one (user, team) pair — a user who shares several teams with the
        caller appears once per team. Soft-deleted users and soft-deleted teams are
        excluded.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id` (the member's user id), `name`, `email`, `teamName`.
          Default sort is `id` ascending. `id` ascending and the team id ascending are
          always appended as deterministic tiebreakers.
        - Filters (all optional, all whitelisted):
          - `name` — case-insensitive substring match against the member's name.
          - `email` — case-insensitive substring match against the member's email.
          - `teamId` — exact match against the team's id.

        Malformed query parameters (unknown view, unknown sort field, non-numeric
        teamId, non-boolean includeIndirect, `includeIndirect` combined with a view other
        than `managed`, out-of-range page/pageSize) respond with `400` and a
        `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [member, managed, managers], default: member }
          description: |
            Which caller-relative slice to list.
            - `member`: members of teams the caller belongs to. Items carry the peer
              feedback stats `lastFeedbackGivenAt` / `lastFeedbackReceivedAt` (see
              `TeamMemberListItem`); no 1:1 stat.
            - `managed`: members of teams the caller manages. Items carry the dashboard
              stats fields (see `TeamMemberListItem`) with the caller as the 1:1's
              manager / the feedback's provider / the goals' manager.
            - `managers`: the managers of teams the caller is a member of. Each item's
              `userId`/`name`/`email` describe the manager and `teamId`/`teamName` the
              managed team. The caller is excluded; a manager who manages several of the
              caller's teams appears once per team. Items carry the dashboard stats
              fields with this manager as the 1:1's manager / the feedback's provider /
              the goals' manager.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=managed` (else `400`). When `true`, widens the scope
            from direct reports to the caller's whole transitive management chain:
            members of teams managed by the caller or by any of the caller's (direct or
            indirect) subordinates. Cycle-safe; the caller themselves never appears.
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the member's name.
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the member's email.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the team's id.
      responses:
        '200':
          description: A page of team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Fetch a team
      description: Any authenticated user may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: replaceTeam
      summary: Replace a team
      description: >-
        Requires the caller to be the team's current manager, or to be ADMIN. Reassigning the
        manager (changing `managerId` to a different user) is ADMIN-only — a current manager may
        edit their team but not hand it off (403 otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Validation error (e.g. referenced user does not exist)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Caller is not the team's manager and not ADMIN, or a non-ADMIN manager attempted to
            reassign `managerId` to a different user
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the team's manager and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdInPath'
    put:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a member to the team (idempotent)
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      responses:
        '204': { description: Member added (or already present) }
        '400':
          description: Validation error (e.g. adding the manager as a member, referenced user does not exist)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the team's manager and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a member from the team (idempotent)
      description: |
        Requires the caller to be the team's current manager, or to be ADMIN.
        Idempotent: removing a user who is not (or no longer) a member is a no-op `204`.
        Zero-member teams are allowed, so removing the last member succeeds. The manager
        is never a `team_members` row, so this endpoint cannot affect them.
      responses:
        '204': { description: Removed (or was not a member) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the team's manager and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks:
    get:
      tags: [feedbacks]
      operationId: listFeedbacks
      summary: List feedbacks for the caller
      description: |
        Lists feedback records scoped by `view`. Scoping is always relative to the caller —
        including ADMIN callers — except `view=user`, the HR auditor view.

        - `view=received` (the default): rows where the caller is the **subject**, scoped exactly
          like the single-GET read rules (every listed row is also openable): (a) the caller is
          the requester and `visibility` is `PROVIDER_REQUESTER`/`PROVIDER_REQUESTER_SUBJECT`
          (any status); (b) otherwise (no requester, or someone else's request) `visibility` is
          `PROVIDER_SUBJECT`/`PROVIDER_REQUESTER_SUBJECT` and `status` is `SENT`/`WITHDRAWN`;
          or (c) `visibility` is `PUBLIC` and `status` is `SENT` (in either role). A
          `DRAFT`/`REQUESTED` row the caller requested has its `contentPreview` redacted (empty)
          until it is sent.
        - `view=provided`: rows where the caller is the provider, regardless of visibility
          (a provider may always read their own records).
        - `view=team`: rows where the subject is one of the caller's **direct reports** (a member
          of a non-deleted team the caller manages) — or, with `includeIndirect=true`, anyone in
          the caller's **transitive management chain** (also members of teams managed, recursively,
          by those members) — AND the caller is a **party** to the row — its provider or
          requester (at any status) — OR `status` is `SENT`/`WITHDRAWN`. Intended for a manager's
          overview; in-progress (`DRAFT`/`REQUESTED`/`REJECTED`) rows the manager is not a party to
          are excluded. A caller who manages no team gets an empty page. When the manager is also
          the requester of an unfinished row, its `contentPreview` is redacted (empty) until sent.
          Note the narrower direct-only default is a list scope, not an authorization boundary:
          the single-GET grants any manager in the subject's chain read access once delivered.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view —
          every feedback the given user is a party to (subject, provider, or requester), at
          every status and visibility, DRAFTs included; `contentPreview` is never redacted.
          HR usage is recorded in the security audit trail. The ordinary sort/filter/paging
          parameters apply on top.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `requesterName`, `subjectName`, `providerName`, `visibility`,
          `status`, `lastModified`. Default sort is `id` ascending. `id` ascending is always
          appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `requesterName` — case-insensitive substring match against the requester's name.
            Rows without a requester never match when this filter is set.
          - `subjectName` — case-insensitive substring match against the subject's name.
          - `providerName` — case-insensitive substring match against the provider's name.
          - `providerId` — exact match against the provider's user id. Combined with
            `view=received`, this scopes the list to feedbacks a specific person gave the caller.
          - `subjectId` — exact match against the subject's user id. Combined with
            `view=provided`, this scopes the list to feedbacks the caller gave a specific person.
          - `visibility` — exact match against the visibility enum.
          - `status` — exact match against the status enum.
          - `lastModified[gte]` — lower bound (inclusive) on `lastModified`, epoch
            milliseconds. Returns rows changed at or after this instant.
        - `content` is returned as `contentPreview`, capped at 200 characters; it is neither
          sortable nor filterable.

        Malformed query parameters (unknown view, unknown sort field, unknown enum value,
        out-of-range page/pageSize) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [received, provided, team, user], default: received }
          description: >-
            Which slice of feedbacks to list — caller-relative, except the HR
            auditor view `user`.
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=team` (else `400`). When `true`, widens the subject scope
            from the caller's direct reports to their whole transitive management chain:
            members of teams managed by the caller or by any of the caller's (direct or
            indirect) subordinates. Cycle-safe; the caller themselves never appears as subject
            through this scope.
        - name: requesterName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the requester's name.
        - name: subjectName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the subject's name.
        - name: providerName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the provider's name.
        - name: providerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the provider's user id.
        - name: subjectId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the subject's user id.
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
          description: Exact match against the record's visibility.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
          description: Exact match against the record's status.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: >-
            Lower bound (inclusive) on `lastModified`, epoch milliseconds.
            Returns rows changed at or after this instant.
      responses:
        '200':
          description: A page of feedbacks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [feedbacks]
      operationId: createFeedback
      summary: Create a feedback record
      description: >-
        Any authenticated user may create a feedback record they are a party to. The provider may
        equal the subject — a self-reflection (feedback about yourself) — either standalone or
        with a requester (someone requesting a self-reflection from the subject). Creation is
        rejected with `409` while a feedback with the same (subject, provider, requester) triple
        — a null requester matches only null — is still in progress (active `DRAFT` or
        `REQUESTED`); the `ProblemDetail.instance` carries `/api/v1/feedbacks/{id}` of the
        existing record. Clients should pre-check via `GET /api/v1/feedbacks/duplicate-check`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new feedback resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          description: 'Validation error (requester ≠ provider; REQUESTED requires a requester; a feedback with a requester may not use PROVIDER_SUBJECT visibility; PROVIDER_REQUESTER visibility requires a requester) or referenced user does not exist'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not a party (provider or requester) to the feedback
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >-
            A feedback with the same (subject, provider, requester) triple is already in
            progress (`DRAFT` or `REQUESTED`); `instance` is the existing record's API path.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/duplicate-check:
    get:
      tags: [feedbacks]
      operationId: checkFeedbackDuplicate
      summary: Check for an in-progress duplicate of a prospective feedback
      description: >-
        Returns the active `DRAFT`/`REQUESTED` feedback matching the given
        (subject, provider, requester) triple, if any — the create screens call this up-front so
        the user is warned (with a link) before filling the form. A null/omitted `requesterId`
        matches only rows without a requester. The caller must be the prospective provider or
        requester — the same party rule as creation, so a matching row always has the
        caller as a party and no unrelated draft's existence can be probed.
      parameters:
        - name: subjectId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: providerId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: requesterId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: The duplicate, or nulls when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCheckResponse'
        '400':
          description: Missing or malformed subjectId/providerId/requesterId
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is neither the prospective provider nor requester
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [feedbacks]
      operationId: getFeedback
      summary: Fetch a feedback record
      description: |
        Authorization (`canReadFeedback`) is evaluated in this order — read access depends on the
        caller's relationship to the row, the `visibility` and (for subject/manager/public) the
        `status`:
        - The **provider** may always read, at any status/visibility. (ADMIN gets no special access.)
        - the **HR auditor** may always read, at any status/visibility — drafts included
          (audit-logged).
        - the **requester** may read at any status, but only when `visibility` is
          `PROVIDER_REQUESTER` or `PROVIDER_REQUESTER_SUBJECT`.
        - the **subject** may read only when `visibility` is `PROVIDER_SUBJECT` or
          `PROVIDER_REQUESTER_SUBJECT` AND `status` is `SENT` or `WITHDRAWN` (so a `DRAFT`/
          `REQUESTED`/`REJECTED` record is not visible to the subject through this rule).
        - any **manager in the subject's management chain** (their manager, that manager's
          manager, and so on — transitive over non-deleted teams) may read a feedback about the
          subordinate once it is delivered — `status` is `SENT` or `WITHDRAWN`; the provider's
          `DRAFT`/`REQUESTED` work stays private to the parties involved.
        - otherwise a `PUBLIC` record may be read by any authenticated user once `status` is `SENT`.
        Anything else is `403`.

        Content redaction: a requester may see that a feedback they requested exists, but while it
        is unfinished (`DRAFT`/`REQUESTED`) the `content` field is returned as an empty string for
        that requester; it becomes visible once the feedback is sent. The HR auditor is exempt —
        even as the requester of an unfinished feedback, HR content is never redacted. The field
        is therefore not guaranteed non-empty and is omitted from `required`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Caller is not the HR auditor and their relationship to the row does not satisfy
            `visibility`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [feedbacks]
      operationId: editFeedbackContent
      summary: Edit a feedback's content and visibility
      description: |
        Edits the feedback's editable representation — `content` and `visibility`. Only the record's
        provider may edit — nobody else, ADMIN included. **Status is not changed here**:
        lifecycle transitions go through the `POST /feedbacks/{id}/{send,withdraw,reject,pick-up}`
        action sub-resources (mirroring notifications' `seen`/`unseen` actions). Party ids and the
        requester message are immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackContentUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: 'Validation error (a feedback with a requester may not use PROVIDER_SUBJECT visibility; PROVIDER_REQUESTER visibility requires a requester)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the feedback's provider
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [feedbacks]
      operationId: deleteFeedback
      summary: Delete a feedback record
      description: |
        Soft-deletes a feedback (the row is flagged, not physically removed, and disappears from
        reads/lists). Only the record's **provider** may delete (nobody else, ADMIN included, has feedback write
        access), and only while the feedback is in **DRAFT** status. If the feedback has a requester,
        they receive a notification that the provider deleted it (no link). The deletion is recorded
        in the feedback's audit history.
      responses:
        '204': { description: Deleted }
        '400':
          description: Feedback is not in DRAFT status (only drafts may be deleted)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the feedback's provider
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [feedbacks]
      operationId: listFeedbackEvents
      summary: List a feedback's audit history
      description: |
        Returns the immutable audit trail for a feedback — one entry per create, status transition,
        content/visibility edit, and deletion — oldest first. Each entry is structural: an event
        `type` plus a `params` map of enum names, with the acting user resolved to `userName`; no
        rendered string is stored (clients localize the description). Authorization matches the
        single-GET above (`canReadFeedback`, with a managing caller allowed): whoever may read the
        feedback may read its history. Events are server-generated; there is no
        create/update/delete endpoint.
      responses:
        '200':
          description: The feedback's events, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller may not read this feedback
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/{id}/send:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: sendFeedback
      summary: Send a feedback (DRAFT → SENT)
      description: |
        Delivers a draft. Provider-only, no request body. Valid only from DRAFT (otherwise 409).
        Notifies the subject, the provider, and the requester (if any) and records an audit
        event. For a self-reflection (provider == subject) only the requester, if any, is
        notified — the other recipients would be the acting user.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/feedbacks/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: withdrawFeedback
      summary: Withdraw a feedback (DRAFT|SENT → WITHDRAWN)
      description: |
        Retracts a draft or a sent feedback (terminal). Provider-only, no request body. Valid from
        DRAFT or SENT (otherwise 409). Notifies the subject (and the requester, if any); for a
        self-reflection (provider == subject) only the requester, if any, is notified.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/feedbacks/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: rejectFeedback
      summary: Reject a feedback request (REQUESTED → REJECTED)
      description: |
        Declines a pending request (terminal). Provider-only, no request body. Valid only from
        REQUESTED (otherwise 409). Notifies the requester.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/feedbacks/{id}/pick-up:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: pickUpFeedback
      summary: Pick up a feedback request (REQUESTED → DRAFT)
      description: |
        The provider accepts a pending request and starts a draft. Provider-only, no request body.
        Valid only from REQUESTED (otherwise 409). Also 409 when an active DRAFT with the same
        (subject, provider, requester) triple already exists (`instance` carries its API path) —
        reachable only with duplicates predating the create-time no-duplicate invariant.
        Notifies the requester.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones:
    get:
      tags: [one-on-ones]
      operationId: listOneOnOnes
      summary: List 1:1 meetings for the caller
      description: |
        Lists 1:1 meetings scoped by `view`. Except `view=user` (the HR auditor view),
        scoping is always relative to the caller, including
        ADMIN callers.

        - `view=own` (the default): meetings where the caller is the **subordinate**.
        - `view=managed`: meetings where the caller is the **manager** (the author).
        - `view=team`: meetings run **by the caller's subordinates as managers** — the manager is
          one of the caller's **direct reports** (a member of a non-deleted team the caller
          manages) or, with `includeIndirect=true`, anyone in the caller's **transitive
          management chain**. A caller who manages no team gets an empty page. The narrower
          direct-only default is a list scope, not an authorization boundary: the single-GET
          grants any manager in the subordinate's chain read access.
        - `view=with`: every meeting **between the caller and one counterpart** (`counterpartId`,
          required for this view and rejected on any other), in **either role direction** — the
          pair may have swapped manager/subordinate roles over time. The caller is a party to
          every returned row.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view —
          every meeting the given user is a party to, in either role direction. HR usage is
          recorded in the security audit trail. The ordinary sort/filter/paging parameters
          apply on top.

        Rows carry the party names, the meeting date, and per-list counts (`pointCount`,
        `decisionCount`, `actionItemCount`, `openActionItemCount`) — never item content.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `meetingDate`, `managerName`, `subordinateName`, `lastModified`.
          Default sort is `meetingDate` **descending** (newest meetings first). `id` ascending is
          always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `managerName` — case-insensitive substring match against the manager's name.
          - `subordinateName` — case-insensitive substring match against the subordinate's name.
          - `meetingDate[gte]` / `meetingDate[lte]` — inclusive ISO-date (`YYYY-MM-DD`) bounds on
            the meeting date. Malformed dates → `400`.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed, team, with, user], default: own }
          description: >-
            Which slice of 1:1 meetings to list — caller-relative, except the HR
            auditor view `user`.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=team` (else `400`). When `true`, widens which managers count
            from the caller's direct reports to their whole transitive management chain.
        - name: counterpartId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            The other party's user id. Required with `view=with` (else `400`), rejected on any
            other view (`400`).
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: managerName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the manager's name.
        - name: subordinateName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the subordinate's name.
        - name: meetingDate[gte]
          in: query
          required: false
          schema: { type: string, format: date }
          description: Lower bound (inclusive) on the meeting date, ISO `YYYY-MM-DD`.
        - name: meetingDate[lte]
          in: query
          required: false
          schema: { type: string, format: date }
          description: Upper bound (inclusive) on the meeting date, ISO `YYYY-MM-DD`.
      responses:
        '200':
          description: A page of 1:1 meetings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOnePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [one-on-ones]
      operationId: createOneOnOne
      summary: Document a new 1:1 meeting
      description: |
        Creates a 1:1 meeting document. The **manager is always the author**: the caller becomes
        the meeting's manager (never taken from the body), and the subordinate must be one of the
        caller's **direct reports** at creation time — there is no ADMIN create-on-behalf.

        **Chronological order**: `meetingDate` may not be strictly earlier than the pair's
        latest existing meeting (`409`) — 1:1s are documented continuously, in order. The same
        date is allowed (a same-day follow-up), and the pair's first meeting accepts any date.

        **Carry-over**: unresolved action items of the pair's previous meeting (the latest
        non-deleted meeting of the same manager+subordinate pair by meeting date, id as
        tiebreaker) are copied into the new meeting server-side, ahead of any `actionItems`
        supplied here. Each copy snapshots the source's text/owner/due date, starts unresolved,
        and carries `copiedFromId` — the source item's id — so the item's history across meetings
        can be reconstructed. Items in this request must NOT carry `id`s (`400`).

        Both parties are notified (view links) — creation is the feature's only notifying
        event; edits and deletions notify nobody. The creation is recorded in the meeting's
        audit history with the carried-over count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOnOneCreateRequest'
      responses:
        '201':
          description: Created — the full document, including the carried-over action items
          headers:
            Location:
              schema: { type: string }
              description: URL of the new 1:1 meeting resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOneResponse'
        '400':
          description: 'Validation error (malformed ISO date, blank or oversized item text, more than 100 items in a list, item ids in a create payload) or referenced user does not exist'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The subordinate is not a direct report of the caller
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >-
            The meeting date is earlier than the pair's latest existing meeting — 1:1s are
            recorded in chronological order (the detail names the conflicting date)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [one-on-ones]
      operationId: getOneOnOne
      summary: Fetch a 1:1 meeting
      description: |
        Returns the full meeting document — parties, date, and the three ordered lists (points
        discussed, decisions made, action items). Readable by the meeting's **manager**, its
        **subordinate**, the **HR auditor** (audit-logged), and any **manager in the
        subordinate's transitive management chain** (their manager, that manager's manager, and
        so on — over non-deleted teams). Anything else — ADMIN included — is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOneResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [one-on-ones]
      operationId: updateOneOnOne
      summary: Replace a 1:1 meeting's document
      description: |
        Full-document replace of the editable representation — the meeting date and the three
        lists. **Manager-only** (the subordinate has read rights only; nobody else — ADMIN
        included — gets write access). The parties are immutable after creation. **Only the pair's latest non-deleted
        meeting** (by meeting date, id as tiebreaker — the carry-over ordering) **may be
        edited**; older meetings are immutable records and answer `409` (the `isLatest` flag on
        the read/list responses tells clients up-front). Deleting the latest meeting makes the
        previous one the pair's latest again.

        Item reconciliation: entries carrying an `id` update that existing row in place; entries
        without an `id` are inserted; rows missing from the payload are removed. Positions are
        rewritten from payload order (the list order IS the stored order). Ids that don't belong
        to this meeting, or duplicated ids, are `400`. `copiedFromId` is server-managed and
        cannot be changed.

        Every change is recorded in the audit history at per-item granularity (point/decision/
        action item added, edited, removed; action item resolved/unresolved, due date changed,
        owner changed; meeting date changed). Pure reordering records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOnOneUpdateRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: 'Validation error (malformed ISO date, blank or oversized item text, more than 100 items in a list, unknown or duplicate item ids)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Not the pair's latest meeting (older 1:1s are immutable records), or the new
            meeting date would fall before the pair's previous meeting (`minMeetingDate` on the
            read response is the floor) — meetings stay chronological
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [one-on-ones]
      operationId: deleteOneOnOne
      summary: Delete a 1:1 meeting
      description: |
        Soft-deletes a 1:1 meeting (the row is flagged, not physically removed, and disappears
        from reads/lists; its audit history is retained). **Manager-only**, and — like PUT —
        **only the pair's latest meeting** (older ones are immutable records, `409`); deleting
        the latest makes the previous one the pair's latest again. Nobody is notified.
        Action-item copy chains passing through the deleted meeting stay walkable — its entries
        are merely skipped in history views.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not the pair's latest meeting — older 1:1s are immutable records
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [one-on-ones]
      operationId: listOneOnOneEvents
      summary: List a 1:1 meeting's audit history
      description: |
        Returns the immutable audit trail for a 1:1 meeting — one entry per creation, per-item
        change, and deletion — oldest first. Each entry is structural: an event `type` plus a
        `params` map (1-based positions, ISO dates, owner enum names — never item text), with the
        acting user resolved to `userName`; no rendered string is stored (clients localize the
        description). Authorization matches the single-GET above: whoever may read the meeting
        may read its history. Events are server-generated; there is no create/update/delete
        endpoint.
      responses:
        '200':
          description: The meeting's events, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOneEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones/action-items/{id}/history:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [one-on-ones]
      operationId: getActionItemHistory
      summary: List every meeting an action item appeared in
      description: |
        Returns the full history of an action item across the chain of carried-over copies — the
        queried item, its ancestors (via `copiedFromId`), and all descendants (copies of it, and
        copies of those) — one entry per appearance, ordered by meeting date (meeting id as
        tiebreaker). Entries whose meeting has been deleted are skipped, but the chain is walked
        through them, so history survives a deleted intermediate meeting.

        Authorization matches the meeting single-GET, checked against the queried item's meeting
        (every copy in a chain belongs to the same manager+subordinate pair). `404` when the item
        does not exist or its meeting has been deleted.
      responses:
        '200':
          description: The action item's appearances, oldest meeting first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemHistoryList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals:
    get:
      tags: [goals]
      operationId: listGoals
      summary: List goals for the caller
      description: |
        Lists goals scoped by `view`. Except `view=user` (the HR auditor view), scoping
        is always relative to the caller, including ADMIN
        callers.

        - `view=own` (the default): goals where the caller is the **subordinate**.
        - `view=managed`: goals where the caller is the **manager** (the author). With
          `includeIndirect=true`, additionally goals set **by managers in the caller's
          transitive management chain** — excluding their DRAFT goals (a draft stays private
          to its pair until activated, matching the single-GET's chain rule; the caller's own
          DRAFTs are always listed).
        - `view=team`: goals set **by the caller's subordinates as managers** — the goal's
          manager is one of the caller's **direct reports** (a member of a non-deleted team the
          caller manages) or, with `includeIndirect=true`, anyone in the caller's **transitive
          management chain**. DRAFT goals are excluded — a draft stays private to the pair until
          activated, matching the single-GET's chain rule. A caller who manages no team gets an
          empty page. The narrower direct-only default is a list scope, not an authorization
          boundary: the single-GET grants any manager in the subordinate's chain read access to
          a non-DRAFT goal.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view —
          every goal the given user is a party to (manager or subordinate), at every status,
          DRAFTs included. HR usage is recorded in the security audit trail. The ordinary
          sort/filter/paging parameters apply on top.

        Rows carry the party names, title, type, status, and the value fields — never the
        description or summary.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `managerName`, `subordinateName`, `title`, `type`, `status`,
          `targetValue`, `currentValue`, `createdAt`, `dueDate`, `lastModified`. Default sort is `createdAt`
          **descending** (newest goals first). `id` ascending is always appended as a
          deterministic tiebreaker. The value columns are null for BINARY goals, so mixed-type
          lists sort those rows together at one end (database NULL ordering).
        - Filters (all optional, all whitelisted):
          - `managerName` / `subordinateName` — case-insensitive substring match against the
            party's name.
          - `managerId` / `subordinateId` — exact party-id match (e.g. the per-manager
            drill-down combines `view=own` with `managerId`).
          - `title` — case-insensitive substring match against the goal title.
          - `type` / `status` — exact enum-name match.
          - `createdAt[gte]` / `lastModified[gte]` — inclusive epoch-millis lower bounds.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed, team, user], default: own }
          description: >-
            Which slice of goals to list — caller-relative, except the HR auditor
            view `user`.
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=managed` and `view=team` (else `400`). For `view=managed`,
            `true` widens the list from the caller's own goals to also include goals set by
            managers in their transitive management chain (their DRAFTs excluded). For
            `view=team`, `true` widens which managers count from the caller's direct reports
            to their whole transitive management chain.
        - name: managerName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the manager's name.
        - name: subordinateName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the subordinate's name.
        - name: managerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact manager-id match.
        - name: subordinateId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact subordinate-id match.
        - name: title
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the goal title.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [BINARY, NUMBER, PERCENTAGE] }
          description: Exact goal-type match.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, CLOSED] }
          description: Exact status match.
        - name: createdAt[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the creation moment, epoch milliseconds.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the last-modified moment, epoch milliseconds.
      responses:
        '200':
          description: A page of goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [goals]
      operationId: createGoal
      summary: Set a new goal for a direct report
      description: |
        Creates a goal, always in **DRAFT** status. The **manager is always the author**: the
        caller becomes the goal's manager (never taken from the body), and the subordinate must
        be one of the caller's **direct reports** at creation time — there is no ADMIN
        create-on-behalf.

        The value fields are type-specific: `targetValue` is **required** for NUMBER and
        PERCENTAGE goals (0–100 for PERCENTAGE) and **must be absent** for BINARY goals. The
        current value starts at the type's zero (`0.0` / not achieved) and only becomes editable
        (via `PUT /goals/{id}/progress`) once the goal is ACTIVE. The **due date** is required
        and must not be earlier than the current date.

        Nobody is notified — a draft is private to the pair until activated. The creation is
        recorded in the goal's audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: Created — the full goal document
          headers:
            Location:
              schema: { type: string }
              description: URL of the new goal resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, out of range, or not applicable to the goal type, a due date that is
            missing, malformed, or in the past) or referenced user does not exist
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The subordinate is not a direct report of the caller
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [goals]
      operationId: getGoal
      summary: Fetch a goal
      description: |
        Returns the full goal document — parties, definition, value fields, status, and (once
        closed at least once) the summary. Readable by the goal's **manager**, its
        **subordinate**, and the **HR auditor** (audit-logged) at every status; a **manager in
        the subordinate's transitive management chain** (their manager, that manager's manager,
        and so on — over non-deleted teams) may read it only once it has left DRAFT
        (ACTIVE/CLOSED) — a draft stays private to the pair. Anything else — ADMIN included —
        is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [goals]
      operationId: updateGoalDefinition
      summary: Edit a draft goal's definition
      description: |
        Edits the goal's definition — title, description, type, target, and due date (the due
        date is editable **only** here and at creation, i.e. only while DRAFT, and must not be
        earlier than the current date). **Manager-only**
        (the subordinate has read rights only; nobody else — ADMIN included — gets write
        access) and **DRAFT-only**: an ACTIVE or CLOSED goal's definition is immutable (`409`) — deactivate
        it first to edit. The parties, status, current value, and summary are not settable here
        (status moves through the action endpoints, the current value through
        `PUT /goals/{id}/progress`, the summary through the close action).

        Changing the type re-initializes the value fields for the new type (BINARY: not
        achieved; NUMBER/PERCENTAGE: `0.0`), discarding any previously recorded progress — the
        audit events explain the reset. Every changed aspect is recorded in the audit history;
        a no-op PUT records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalDefinitionUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, out of range, or not applicable to the goal type, a due date that is
            missing, malformed, or in the past)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The goal is not in DRAFT status — its definition is immutable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [goals]
      operationId: deleteGoal
      summary: Delete a draft goal
      description: |
        Soft-deletes a goal (the row is flagged, not physically removed, and disappears from
        reads/lists; its audit history is retained). **Manager-only** and **DRAFT-only** —
        ACTIVE and CLOSED goals are records and answer `400`; close (or reopen) them through
        the transitions instead. Nobody is notified.
      responses:
        '204': { description: Deleted }
        '400':
          description: The goal is not in DRAFT status — only a draft goal may be deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [goals]
      operationId: updateGoalProgress
      summary: Update an active goal's current value
      description: |
        Updates the goal's current value — the only edit an **ACTIVE** goal accepts (any other
        status is `409`). **Manager-only**. Exactly the field matching the goal's type must be
        set: `achieved` for a BINARY goal, `currentValue` for NUMBER and PERCENTAGE (0–100 for
        PERCENTAGE); the mismatched field is `400`. The change is recorded in the audit history
        (from/to values); a no-op update records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalProgressUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            The value field does not match the goal's type, is missing, or is out of range
            (PERCENTAGE is 0–100)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The goal is not ACTIVE — the current value is only editable while it is
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: activateGoal
      summary: Activate a draft goal
      description: |
        Moves the goal `DRAFT → ACTIVE` (any other current status is `409`). **Manager-only.**
        The goal's **due date must not be in the past** (`400`) — a stale draft must be given a
        fresh due date (via `PUT /goals/{id}`) before it can be activated. Once active, the
        goal becomes visible to the subordinate's wider management chain and its current value
        becomes editable via `PUT /goals/{id}/progress`. The subordinate is notified; the
        transition is recorded in the audit history.
      responses:
        '204': { description: Activated }
        '400':
          description: The goal's due date is in the past — update it before activating
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: deactivateGoal
      summary: Return an active goal to draft
      description: |
        Moves the goal `ACTIVE → DRAFT` (any other current status is `409`), making its
        definition editable again. **Manager-only.** Recorded progress is kept (unless the type
        is later changed in the draft, which re-initializes the value fields). The subordinate
        is notified; the transition is recorded in the audit history.
      responses:
        '204': { description: Returned to draft }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/close:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: closeGoal
      summary: Close an active goal
      description: |
        Moves the goal `ACTIVE → CLOSED` (any other current status is `409`). **Manager-only.**
        Closing always records the body's **summary** (required, non-blank — the only moment
        the summary is settable). The current value is frozen as-is — update it via
        `PUT /goals/{id}/progress` *before* closing. The subordinate is notified; the
        transition is recorded in the audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCloseRequest'
      responses:
        '204': { description: Closed }
        '400':
          description: The summary is missing, blank, or oversized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: reopenGoal
      summary: Reopen a closed goal
      description: |
        Moves the goal `CLOSED → ACTIVE` (any other current status is `409`). **Manager-only.**
        The stored summary is kept as a record of the previous closure and will be overwritten
        at the next close. The subordinate is notified; the transition is recorded in the audit
        history.
      responses:
        '204': { description: Reopened }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [goals]
      operationId: listGoalEvents
      summary: List a goal's audit history
      description: |
        Returns the immutable audit trail for a goal — one entry per creation, changed
        definition aspect, progress update, status transition, and deletion — oldest first. Each
        entry is structural: an event `type` plus a `params` map (enum names and numeric values
        — never title/description/summary text), with the acting user resolved to `userName`; no
        rendered string is stored (clients localize the description). Authorization matches the
        single-GET above: whoever may read the goal may read its history. Events are
        server-generated; there is no create/update/delete endpoint.
      responses:
        '200':
          description: The goal's events, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis:
    get:
      tags: [team-kpis]
      operationId: listTeamKpis
      summary: List team KPIs for the caller
      description: |
        Lists team KPIs scoped by `view` — always relative to the caller, including ADMIN
        callers. A KPI belongs to a **team**; its manager is always the team's **current**
        manager (`teams.manager_id`, resolved at read time — never stored on the KPI), so a
        reassigned team's new manager takes over its KPIs.

        - `view=own` (the default): KPIs of the non-deleted teams the caller is currently a
          **member** of — excluding DRAFTs (a draft stays private to the manager until
          activated, matching the single-GET rule, so every listed row is openable).
        - `view=managed`: KPIs of the teams whose **current manager** the caller is, at every
          status — soft-deleted teams included (their `teamDeleted` flag is set), so a manager
          keeps the history of a disbanded team.

        There is deliberately no HR auditor list view (`view=user` on the goal/feedback/1:1
        lists is per-user; a team KPI is per-team) — the HR auditor instead has audit-logged
        access to every single GET. The `teamId` filter powers the per-team drill-down.

        Rows carry the team and manager names, title, type, status, and the value fields —
        never the description or summary.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `teamName`, `managerName`, `title`, `type`, `status`,
          `targetValue`, `currentValue`, `createdAt`, `lastModified`. Default sort is
          `createdAt` **descending** (newest KPIs first). `id` ascending is always appended as
          a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `teamName` — case-insensitive substring match against the team's name.
          - `teamId` — exact team-id match (the per-team drill-down).
          - `title` — case-insensitive substring match against the KPI title.
          - `type` / `status` — exact enum-name match.
          - `createdAt[gte]` / `lastModified[gte]` — inclusive epoch-millis lower bounds.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed], default: own }
          description: Which slice of team KPIs to list — always caller-relative.
        - name: teamName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the team's name.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact team-id match (the per-team drill-down).
        - name: title
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the KPI title.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [NUMBER, PERCENTAGE] }
          description: Exact KPI-type match.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
          description: Exact status match.
        - name: createdAt[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the creation moment, epoch milliseconds.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the last-modified moment, epoch milliseconds.
      responses:
        '200':
          description: A page of team KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [team-kpis]
      operationId: createTeamKpi
      summary: Set a new KPI for a managed team
      description: |
        Creates a team KPI, always in **DRAFT** status. The author is always the team's
        **current manager**: the caller must be `teams.manager_id` of the (non-deleted)
        `teamId` at creation time — there is no ADMIN create-on-behalf.

        Unlike goals there is no BINARY type: `targetValue` is **always required** (finite;
        0–100 for PERCENTAGE). The KPI starts with no data points (`currentValue` `0.0`,
        `currentValueDate` null); data points become recordable (via the
        `/team-kpis/{id}/values` sub-resource) once the KPI is ACTIVE. There is no due date.

        Nobody is notified — a draft is private to the manager until activated. The creation
        is recorded in the KPI's audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiCreateRequest'
      responses:
        '201':
          description: Created — the full team-KPI document
          headers:
            Location:
              schema: { type: string }
              description: URL of the new team-KPI resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiResponse'
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, not finite, or out of range for PERCENTAGE) or referenced team does not
            exist
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not the team's current manager
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [team-kpis]
      operationId: getTeamKpi
      summary: Fetch a team KPI
      description: |
        Returns the full team-KPI document — team, its current manager, definition, value
        fields, status, and (once archived at least once) the summary. Readable by the team's
        **current manager** and the **HR auditor** (audit-logged) at every status; a current
        **team member**, or any **manager in the chain above the team's manager** (their
        manager, that manager's manager, and so on — over non-deleted teams), may read it only
        once it has left DRAFT (ACTIVE/ARCHIVED) — a draft stays private to the manager.
        Anything else — ADMIN included — is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [team-kpis]
      operationId: updateTeamKpiDefinition
      summary: Edit a draft team KPI's definition
      description: |
        Edits the KPI's definition — title, description, type, and target. **Current-manager-
        only** (members have read rights only; nobody else — ADMIN included — gets write
        access) and **DRAFT-only**: an ACTIVE or ARCHIVED KPI's definition is immutable (`409`)
        — deactivate it first to edit. The team, status, data points, and summary are not
        settable here (status moves through the action endpoints, the data points through the
        `/team-kpis/{id}/values` sub-resource, the summary through the archive action).

        Changing the type **wipes all collected data points** — a NUMBER series is meaningless
        against a PERCENTAGE target and vice versa — resetting `currentValue`/`currentValueDate`
        to `0.0`/null; the audit events explain the reset. Every changed aspect is recorded in
        the audit history; a no-op PUT records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiDefinitionUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, not finite, or out of range for PERCENTAGE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The KPI is not in DRAFT status — its definition is immutable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [team-kpis]
      operationId: deleteTeamKpi
      summary: Delete a draft team KPI
      description: |
        Soft-deletes a team KPI (the row is flagged, not physically removed, and disappears
        from reads/lists; its audit history is retained). **Current-manager-only** and
        **DRAFT-only** — ACTIVE and ARCHIVED KPIs are records and answer `400`; archive (or
        reopen) them through the transitions instead. Nobody is notified.
      responses:
        '204': { description: Deleted }
        '400':
          description: The KPI is not in DRAFT status — only a draft team KPI may be deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/values:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [team-kpis]
      operationId: listTeamKpiValues
      summary: List a team KPI's data points
      description: |
        Returns the KPI's collected data points — one `{id, date, value}` entry per
        measurement, at most one per date, sorted by date **newest first**. Unpaged (the set is
        a hand-entered measurement series, intrinsically small). The view screen's KPI-data tab
        and its value-over-time graph both feed on this list. Authorization matches the
        single-GET: whoever may read the KPI may read its data points.
      responses:
        '200':
          description: The KPI's data points, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiValueList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [team-kpis]
      operationId: addTeamKpiValue
      summary: Record a data point for an active team KPI
      description: |
        Adds a data point — data points are only mutable while the KPI is **ACTIVE** (any other
        status is `409`). **Current-manager-only.** `value` is always required (finite; 0–100
        for PERCENTAGE), and `date` — the ISO `YYYY-MM-DD` date the value was measured — is
        required and must not be in the future (today is allowed). At most **one value per
        date**: a date that already has a data point is `409` — correct the existing point
        instead. The KPI's denormalized `currentValue`/`currentValueDate` are recomputed from
        the max-dated point in the same transaction, the addition mints a `VALUE_RECORDED`
        audit event (params `{date, value}`), and every current team member (except the acting
        manager) is notified with a link to the KPI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiValueWrite'
      responses:
        '201':
          description: Created — the new data point
          headers:
            Location:
              schema: { type: string }
              description: URL of the new data-point resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiValueResponse'
        '400':
          description: >-
            The value is missing, not finite, or out of range (PERCENTAGE is 0–100); or the
            date is missing, not a strict ISO YYYY-MM-DD, or in the future
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiValueConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/values/{valueId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: valueId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 0 }
        description: Id of the data point (must belong to the addressed KPI, else 404).
    put:
      tags: [team-kpis]
      operationId: updateTeamKpiValue
      summary: Correct a data point of an active team KPI
      description: |
        Corrects a data point's date and/or value — only while the KPI is **ACTIVE** (any
        other status is `409`). **Current-manager-only.** The same value/date rules as adding
        apply; moving the point onto a date that already has another data point is `409`. The
        denormalized `currentValue`/`currentValueDate` are recomputed in the same transaction.
        A real change mints a `VALUE_CORRECTED` audit event (params
        `{fromDate, fromValue, toDate, toValue}` — always all four) and notifies every current
        team member (except the acting manager) with a link to the KPI; an exact no-op records
        nothing, notifies nobody, and still answers `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiValueWrite'
      responses:
        '204': { description: Corrected }
        '400':
          description: >-
            The value is missing, not finite, or out of range (PERCENTAGE is 0–100); or the
            date is missing, not a strict ISO YYYY-MM-DD, or in the future
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiValueConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [team-kpis]
      operationId: deleteTeamKpiValue
      summary: Remove a data point of an active team KPI
      description: |
        Removes a data point (hard delete — the `VALUE_REMOVED` audit event, params
        `{date, value}`, keeps the record) — only while the KPI is **ACTIVE** (any other
        status is `409`). **Current-manager-only.** The denormalized
        `currentValue`/`currentValueDate` are recomputed in the same transaction: removing the
        latest-dated point rolls the current value back to the next-latest (or `0.0`/null when
        none remain). Every current team member (except the acting manager) is notified with a
        link to the KPI.
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiValueConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: activateTeamKpi
      summary: Activate a draft team KPI
      description: |
        Moves the KPI `DRAFT → ACTIVE` (any other current status is `409`).
        **Current-manager-only.** Once active, the KPI becomes visible to the team's members
        and the chain above its manager, and its data points become editable via the
        `/team-kpis/{id}/values` sub-resource. Every current team member (except the acting
        manager) is notified; the transition is recorded in the audit history.
      responses:
        '204': { description: Activated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: deactivateTeamKpi
      summary: Return an active team KPI to draft
      description: |
        Moves the KPI `ACTIVE → DRAFT` (any other current status is `409`), making its
        definition editable again — and hiding it from members and the chain until
        re-activated. **Current-manager-only.** Collected data points are kept (unless the
        type is later changed in the draft, which wipes them). Every current team member
        (except the acting manager) is notified — without a link, since a draft is not
        readable by them; the transition is recorded in the audit history.
      responses:
        '204': { description: Returned to draft }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: archiveTeamKpi
      summary: Archive an active team KPI
      description: |
        Moves the KPI `ACTIVE → ARCHIVED` (any other current status is `409`).
        **Current-manager-only.** Archiving always records the body's **summary** (required,
        non-blank — the only moment the summary is settable). The data points are frozen
        as-is — correct them via the `/team-kpis/{id}/values` sub-resource *before* archiving.
        Every current team member (except the acting manager) is notified; the transition is
        recorded in the audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiArchiveRequest'
      responses:
        '204': { description: Archived }
        '400':
          description: The summary is missing, blank, or oversized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: reopenTeamKpi
      summary: Reopen an archived team KPI
      description: |
        Moves the KPI `ARCHIVED → ACTIVE` (any other current status is `409`).
        **Current-manager-only.** The stored summary is kept as a record of the previous
        archiving and will be overwritten at the next archive. Every current team member
        (except the acting manager) is notified; the transition is recorded in the audit
        history.
      responses:
        '204': { description: Reopened }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [team-kpis]
      operationId: listTeamKpiEvents
      summary: List a team KPI's audit history
      description: |
        Returns the immutable audit trail for a team KPI — one entry per creation, changed
        definition aspect, data-point mutation (`VALUE_RECORDED` / `VALUE_CORRECTED` /
        `VALUE_REMOVED`), status transition, and deletion — oldest first. Each entry is
        structural: an event `type` plus a `params` map (enum names, numeric values, and ISO
        dates — never title/description/summary text), with the acting user resolved to
        `userName`; no rendered string is stored (clients localize the description).
        Authorization matches the single-GET above: whoever may read the KPI may read its
        history. Events are server-generated; there is no create/update/delete endpoint.
      responses:
        '200':
          description: The team KPI's events, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      description: |
        Lists templates. Any authenticated user may read.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`. Default sort is `id` ascending. `id` ascending is
          always appended as a deterministic tiebreaker.
        - Filter (optional, whitelisted):
          - `name` — case-insensitive substring match against the template name.
        - `content` is returned as `contentPreview`, capped at 200 characters; it is neither
          sortable nor filterable.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize) respond
        with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the template name.
      responses:
        '200':
          description: A page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a template
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new template resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          description: Validation error (e.g. blank name)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: A template with the same name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Fetch a template
      description: Any authenticated user may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [templates]
      operationId: replaceTemplate
      summary: Replace a template
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Validation error (e.g. blank name)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A template with the same name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: Delete a template
      description: ADMIN only.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/dictionaries/{dictionary}:
    parameters:
      - name: dictionary
        in: path
        required: true
        schema:
          type: string
          enum: [career-paths, career-specializations, seniority-levels]
        description: The dictionary's URL slug. Unknown slugs answer 404.
    get:
      tags: [dictionaries]
      operationId: getDictionary
      summary: List a dictionary's entries
      description: |
        Any authenticated user may read. Unpaged — dictionaries are intrinsically small
        (at most 200 entries). Entries come in the admin-curated order (position ascending,
        `id` as deterministic tiebreaker); soft-deleted entries are never returned.
      responses:
        '200':
          description: The dictionary's active entries, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [dictionaries]
      operationId: replaceDictionary
      summary: Replace a dictionary's entries
      description: |
        Whole-document replace, ADMIN only (the guard runs before slug resolution, so a
        non-admin gets a uniform 403 whether or not the slug exists). Reconciliation: an
        item carrying an `id` renames that existing active entry in place (the id is stable
        across renames); an item without an `id` is inserted; active entries missing from
        the payload are soft-deleted — never physically removed. A soft-deleted entry's id
        can never be resubmitted; re-adding the same value creates a new entry. Positions
        are rewritten from payload order. An empty `items` array is allowed and soft-deletes
        every entry.

        Values are trimmed before storage and comparison. Blank or oversized values,
        duplicate values within the payload (case-sensitive), duplicated or unknown /
        soft-deleted entry ids, and more than 200 items are 400. A clash with another
        active entry's value — e.g. swapping two values in one save, which trips the
        per-statement unique index — is 409; work around a swap with a two-save rename
        through a temporary value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictionaryUpdateRequest'
      responses:
        '204': { description: Replaced }
        '400':
          description: Validation error (blank/oversized/duplicate value, bad entry id, too many items)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A value clashes with another active entry (e.g. a one-save value swap)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts (management view)
      description: |
        Lists all alerts, including inactive and out-of-window ones. ADMIN only — what
        non-admin users see flows through `GET /api/v1/alerts/visible`.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `title`, `startsAt`, `endsAt`. Default sort is `id` ascending.
          `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `title` — case-insensitive substring match against the alert title.
          - `isActive` — strict boolean equality (`true`/`false`).

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, non-boolean
        `isActive`) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: title
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the alert title.
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean equality filter on the active flag.
      responses:
        '200':
          description: A page of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [alerts]
      operationId: createAlert
      summary: Create an alert
      description: |
        ADMIN only. `startsAt`/`endsAt` are epoch milliseconds; when both are set,
        `startsAt` must be strictly before `endsAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new alert resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          description: Validation error (blank title/content, start not before end)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/alerts/visible:
    get:
      tags: [alerts]
      operationId: listVisibleAlerts
      summary: List the currently visible alerts
      description: |
        The alerts every user currently sees as banners. Any authenticated user may call.
        Visibility is evaluated server-side against server time: the alert is active, and the
        current moment lies inside its optional `[startsAt, endsAt]` window (both bounds
        inclusive; an unset bound is unbounded). Unpaged — the set of concurrently visible
        alerts is intrinsically tiny. Ordered by `id` ascending.
      responses:
        '200':
          description: The currently visible alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibleAlertList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Fetch an alert
      description: ADMIN only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [alerts]
      operationId: replaceAlert
      summary: Replace an alert
      description: ADMIN only. All fields are editable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Validation error (blank title/content, start not before end)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [alerts]
      operationId: deleteAlert
      summary: Delete an alert
      description: ADMIN only.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List the caller's notifications
      description: |
        Lists notifications addressed to the calling user (`recipientId` = caller). The list is
        always scoped to the caller, including for ADMIN — there is no cross-user view.

        Notifications are generated as a side-effect of other activities; there is no create
        endpoint.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `timestamp`. Default sort is `timestamp` descending (newest
          first). `id` ascending is always appended as a deterministic tiebreaker.
        - Filter (optional, whitelisted):
          - `wasSeen` — `true`/`false`; restricts to seen / unseen notifications.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, non-boolean
        `wasSeen`) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: wasSeen
          in: query
          required: false
          schema: { type: boolean }
          description: Restrict to seen (`true`) or unseen (`false`) notifications.
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [notifications]
      operationId: getNotification
      summary: Fetch a notification
      description: Recipient-only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [notifications]
      operationId: deleteNotification
      summary: Delete a notification
      description: Recipient-only.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationSeen
      summary: Mark a notification as seen
      description: |
        Sets `wasSeen` to `true`. Idempotent. Recipient-only.
      responses:
        '204': { description: Marked as seen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{id}/unseen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationUnseen
      summary: Mark a notification as unseen
      description: |
        Sets `wasSeen` to `false`. Idempotent. Recipient-only.
      responses:
        '204': { description: Marked as unseen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/seen-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsSeen
      summary: Mark all of the caller's notifications as seen
      description: |
        Sets `wasSeen` to `true` for every one of the authenticated caller's still-unseen
        notifications, in a single request. Idempotent. Intrinsically scoped to the caller's own
        notifications (no `{id}`, no recipient guard — like every notification endpoint,
        recipient-only).
        Deliberately asymmetric: there is no `unseen-all` counterpart — un-seeing is a
        per-notification action (`POST /notifications/{id}/unseen`).
      responses:
        '204': { description: All of the caller's notifications marked as seen }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    UserIdInPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-lastModified,id`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    FeedbackNotProvider:
      description: Caller is not the feedback's provider
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidTransition:
      description: The action is not allowed from the feedback's current status
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    OneOnOneNotReadable:
      description: >-
        Caller is neither a party to the 1:1 meeting, nor the HR auditor, nor a manager in the
        subordinate's management chain
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    OneOnOneNotManager:
      description: Caller is not the meeting's manager (the subordinate has read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    GoalNotReadable:
      description: >-
        Caller is neither a party to the goal, nor the HR auditor, nor a manager in the subordinate's
        management chain — or the goal is still a DRAFT, which the wider chain may not see
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    GoalNotManager:
      description: Caller is not the goal's manager (the subordinate has read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    GoalInvalidTransition:
      description: >-
        The action is not allowed from the goal's current status (the machine is
        DRAFT ↔ ACTIVE ↔ CLOSED, never skipping ACTIVE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiNotReadable:
      description: >-
        Caller is neither the team's current manager, nor the HR auditor, nor a current team
        member, nor a manager in the chain above the team's manager — or the KPI is still a
        DRAFT, which only the manager (and HR) may see
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiNotManager:
      description: Caller is not the team's current manager (members have read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiInvalidTransition:
      description: >-
        The action is not allowed from the KPI's current status (the machine is
        DRAFT ↔ ACTIVE ↔ ARCHIVED, never skipping ACTIVE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiValueConflict:
      description: >-
        The KPI is not ACTIVE (data points are only mutable while it is), or the target date
        already has a data point (at most one value per date — correct the existing point
        instead)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int64, minimum: 0 }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: Additional roles of the authenticated user — empty for a regular user.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The refresh token previously issued by /login or /refresh.

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: |
            Optional. When present, its refresh token is also revoked so an explicit
            logout kills both tokens (the access token is revoked from the bearer).

    UserImportRequest:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: Raw CSV text, `name,email` per line.
        sendEmails:
          type: boolean
          default: false
          description: Email each newly created user their generated password.

    UserImportRow:
      type: object
      required: [line, status]
      properties:
        line: { type: integer, description: 1-based line number in the uploaded file. }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status:
          type: string
          enum: [CREATED, DUPLICATE, PARSE_ERROR, EMAIL_FAILED, ERROR]
        message: { type: string, nullable: true }
        password:
          type: string
          nullable: true
          description: The generated password (CREATED / EMAIL_FAILED rows only) — shown once.

    UserImportResponse:
      type: object
      required: [rows, created, duplicates, errors]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/UserImportRow' }
        created: { type: integer, description: CREATED + EMAIL_FAILED rows. }
        duplicates: { type: integer }
        errors: { type: integer, description: PARSE_ERROR + ERROR rows. }

    UserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 64
          description: At most 71 bytes in UTF-8 (bcrypt limit) — longer is rejected with 400.
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: |
            Additional roles (every user is implicitly a regular user). Create is
            ADMIN-only, so any set may be given; omitted defaults to no additional
            roles.
        sendEmail:
          type: boolean
          default: false
          description: Create only — email the new user their credentials (the bilingual
            welcome message). Rejected with 503 on a deployment without outbound email.
        careerPathId:
          type: integer
          format: int64
          nullable: true
          description: |
            Id of an ACTIVE CAREER_PATH dictionary entry. Omitted or null = leave unset.
            An unknown, wrong-dictionary, or soft-deleted id is rejected with 400.
        careerSpecializationId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE CAREER_SPECIALIZATION dictionary entry — see careerPathId.
        seniorityLevelId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE SENIORITY_LEVEL dictionary entry — see careerPathId.

    UserCreateResponse:
      type: object
      required: [id, name, email, roles, careerPath, careerSpecialization, seniorityLevel]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
        emailSent:
          type: boolean
          nullable: true
          description: Present only when sendEmail was requested — false means the delivery
            failed (the account exists regardless; the password is still shown once).
        careerPath:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
        careerSpecialization:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
        seniorityLevel:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: |
            Part of the full representation (PUT). Changing the set requires ADMIN; a non-ADMIN
            caller must send the set the user already has, otherwise the request is rejected with 403.
        careerPathId:
          type: integer
          format: int64
          nullable: true
          description: |
            Id of an ACTIVE CAREER_PATH dictionary entry. Omitted or null = leave unchanged —
            there is deliberately no way to clear a set value. Assigning or changing requires
            ADMIN (403 otherwise); an unknown, wrong-dictionary, or soft-deleted NEW id is 400.
            Resubmitting the user's current id is never a change (allowed for any caller, even
            when that entry has been soft-deleted since).
        careerSpecializationId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE CAREER_SPECIALIZATION dictionary entry — semantics as careerPathId.
        seniorityLevelId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE SENIORITY_LEVEL dictionary entry — semantics as careerPathId.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 64
          description: At most 71 bytes in UTF-8 (bcrypt limit) — longer is rejected with 400.
        currentPassword:
          type: string
          description: |
            Required when the caller changes their own password (verified against the
            stored hash); not required for an admin resetting another user's password.

    UserResponse:
      type: object
      required: [id, name, email, roles, careerPath, careerSpecialization, seniorityLevel]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: Additional roles — empty for a regular user.
        careerPath:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: |
            The user's career path, resolved from the CAREER_PATH dictionary at read time
            (renames propagate; a soft-deleted referenced entry keeps resolving to its
            retained value). Null until set; once set it can never be cleared.
        careerSpecialization:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the CAREER_SPECIALIZATION dictionary — see careerPath.
        seniorityLevel:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the SENIORITY_LEVEL dictionary — see careerPath.

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamRequest:
      type: object
      required: [name, managerId]
      properties:
        name: { type: string, maxLength: 100 }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          description: |
            Defaults to an empty list when omitted. Zero-member teams are allowed;
            members can be added later via the `/api/v1/teams/{id}/members/{userId}` sub-resource.
          items: { type: integer, format: int64, minimum: 0 }

    TeamResponse:
      type: object
      required: [id, name, managerId, memberIds]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          items: { type: integer, format: int64, minimum: 0 }

    TeamListItem:
      type: object
      required: [id, name, managerId, managerName, managerDeleted]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted:
          type: boolean
          description: True when the user referenced by `managerId` has been soft-deleted.

    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamMemberListItem:
      type: object
      required: [userId, name, email, teamId, teamName]
      properties:
        userId: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        email: { type: string, format: email }
        teamId: { type: integer, format: int64, minimum: 0 }
        teamName: { type: string }
        lastOneOnOneDate:
          type: string
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`; always `null` for
            `view=member`. ISO `YYYY-MM-DD` date of the latest non-deleted 1:1 of the
            (row user, caller) pair in the view's direction — `managers`: run by this
            manager (as the meeting's manager) with the caller as the subordinate;
            `managed`: run by the caller with this member as the subordinate. The
            directional pairing only, not the both-directions history. `null` when no
            such meeting exists.
        lastOneOnOneOpenItems:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`: unresolved action items on
            that latest meeting. `null` exactly when `lastOneOnOneDate` is `null`.
        lastFeedbackAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`; always `null` for
            `view=member`. Epoch milliseconds of the SENT moment (from the feedback
            audit trail) of the newest currently-SENT feedback in the view's direction.
            `managers`: this manager as provider, the caller as subject, restricted to
            feedback visible to the caller under the received-view scoping — feedback
            invisible to the caller never counts. `managed`: the caller as provider,
            this member as subject — provider-side, never visibility-filtered (the
            caller authored it). Withdrawn feedback never counts. Feedbacks predating
            the audit trail fall back to their last-modified time. `null` when there
            is none.
        lastFeedbackGivenAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Populated only for `view=member`; always `null` otherwise. Epoch milliseconds
            of the SENT moment (from the feedback audit trail) of the caller's newest
            currently-SENT feedback about this peer — provider-side, never
            visibility-filtered (the caller authored it). Withdrawn feedback never
            counts; feedbacks predating the audit trail fall back to their last-modified
            time. `null` when there is none.
        lastFeedbackReceivedAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Populated only for `view=member`; always `null` otherwise. Epoch milliseconds
            of the SENT moment (from the feedback audit trail) of the newest
            currently-SENT feedback this peer provided about the caller, restricted to
            feedback visible to the caller under the received-view scoping — feedback
            invisible to the caller never counts. Withdrawn feedback never counts;
            feedbacks predating the audit trail fall back to their last-modified time.
            `null` when there is none.
        activeGoalCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`; always `null` for
            `view=member` (peers have no goal relationship). The number of ACTIVE
            (non-deleted) goals of the (row user, caller) pair in the view's direction —
            `managers`: goals this manager set for the caller; `managed`: goals the
            caller set for this member. `0` when the pair has none; DRAFT and CLOSED
            goals never count.
        careerPath:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: |
            The row user's career path, resolved from the CAREER_PATH dictionary at read
            time (renames propagate; a soft-deleted referenced entry keeps resolving to
            its retained value). Unlike the directional stats, populated for EVERY view;
            null when the field is unset.
        careerSpecialization:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the CAREER_SPECIALIZATION dictionary — see careerPath.
        seniorityLevel:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the SENIORITY_LEVEL dictionary — see careerPath.

    TeamMemberPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    FeedbackContentUpdate:
      type: object
      required: [visibility]
      description: Body of `PUT /feedbacks/{id}` — the editable representation (content + visibility).
      properties:
        content: { type: string, default: "" }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]

    FeedbackRequest:
      type: object
      required: [subjectId, providerId, visibility, status]
      properties:
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        content: { type: string, default: "" }
        requesterMessage:
          type: string
          nullable: true
          description: |
            Requester's clarification note to the provider (why they asked, what they expect).
            Captured only when a feedback is created; immutable afterward — any value sent on
            update (`PUT`) is ignored.

    FeedbackResponse:
      type: object
      required: [id, subjectId, providerId, visibility, status, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        content:
          type: string
          description: |
            The feedback body. Returned as an empty string (and omitted from `required`)
            when the caller may see that the record exists but not its content — a requester
            watching an unfinished (`DRAFT`/`REQUESTED`) feedback they requested.
        requesterMessage:
          type: string
          nullable: true
          description: |
            Requester's clarification note to the provider, set at creation and never editable.
            Null when the requester left it empty.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds of the last change. Server-managed and read-only.
        requesterName:
          type: string
          nullable: true
          description: Display name of the requester; null when there is no requester. Server-resolved, read-only.
        subjectName:
          type: string
          nullable: true
          description: Display name of the subject. Server-resolved, read-only.
        providerName:
          type: string
          nullable: true
          description: Display name of the provider. Server-resolved, read-only.

    FeedbackListItem:
      type: object
      required: [id, requesterDeleted, subjectId, subjectName, subjectDeleted, providerId, providerName, providerDeleted, visibility, status, contentPreview, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        requesterName:
          type: string
          nullable: true
          description: Null when the record has no requester.
        requesterDeleted:
          type: boolean
          description: True when the user referenced by `requesterId` has been soft-deleted. False when there is no requester.
        subjectId: { type: integer, format: int64, minimum: 0 }
        subjectName: { type: string }
        subjectDeleted:
          type: boolean
          description: True when the user referenced by `subjectId` has been soft-deleted.
        providerId: { type: integer, format: int64, minimum: 0 }
        providerName: { type: string }
        providerDeleted:
          type: boolean
          description: True when the user referenced by `providerId` has been soft-deleted.
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        contentPreview:
          type: string
          description: First 200 characters of `content`.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds of the last change. Server-managed and read-only.

    FeedbackPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DuplicateCheckResponse:
      type: object
      description: >-
        The in-progress duplicate for a prospective (subject, provider, requester) triple —
        both fields null when there is none.
      properties:
        existingId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Id of the active DRAFT/REQUESTED feedback matching the triple.
        existingStatus:
          type: string
          enum: [REQUESTED, DRAFT]
          nullable: true
          description: Its status; null exactly when `existingId` is null.

    TemplateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        content: { type: string, default: "" }

    TemplateResponse:
      type: object
      required: [id, name, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        content: { type: string }

    TemplateListItem:
      type: object
      required: [id, name, contentPreview]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        contentPreview:
          type: string
          description: First 200 characters of `content`.

    TemplatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DictionaryEntry:
      type: object
      required: [id, value]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        value: { type: string }

    DictionaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryEntry'

    DictionaryEntryInput:
      type: object
      required: [value]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Present = update that active entry in place; absent = insert a new entry.
        value: { type: string, maxLength: 100 }

    DictionaryUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DictionaryEntryInput'

    AlertRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 150 }
        content:
          type: string
          default: ""
          maxLength: 5000
          description: Markdown-formatted message body. Must not be blank.
        isActive: { type: boolean, default: true }
        startsAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds; the alert is hidden before this moment. Null = unbounded.
        endsAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds; the alert is hidden after this moment. Null = unbounded.

    AlertResponse:
      type: object
      required: [id, title, content, isActive]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        title: { type: string }
        content: { type: string }
        isActive: { type: boolean }
        startsAt: { type: integer, format: int64, nullable: true }
        endsAt: { type: integer, format: int64, nullable: true }

    AlertPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    VisibleAlert:
      type: object
      required: [id, title, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        title: { type: string }
        content:
          type: string
          description: Markdown-formatted message body.

    VisibleAlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VisibleAlert'

    FeedbackEventResponse:
      type: object
      required: [id, feedbackId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        feedbackId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum: [CREATED, DELETED, STATUS_CHANGED, CONTENT_UPDATED, CONTENT_AND_VISIBILITY_UPDATED, VISIBILITY_CHANGED]
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering, as enum names — e.g.
            `{status}` for CREATED, `{from,to}` for STATUS_CHANGED, `{to}` for VISIBILITY_CHANGED.
            Empty object when the event kind needs none.

    FeedbackEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackEventResponse' }

    OneOnOneItemInput:
      type: object
      required: [content]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            Identifies an existing row on PUT (omitted = a new item). Must be omitted on create.
        content: { type: string, maxLength: 4000, description: Plain unformatted paragraph. }

    OneOnOneActionItemInput:
      type: object
      required: [content, owner]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            Identifies an existing row on PUT (omitted = a new item). Must be omitted on create.
        content: { type: string, maxLength: 4000, description: Plain unformatted paragraph. }
        owner:
          type: string
          enum: [MANAGER, SUBORDINATE]
          description: Which of the meeting's two parties owns the action item.
        dueDate:
          type: string
          format: date
          nullable: true
          description: ISO `YYYY-MM-DD`; null = no due date.
        resolved: { type: boolean, default: false }

    OneOnOneCreateRequest:
      type: object
      required: [subordinateId, meetingDate]
      properties:
        subordinateId:
          type: integer
          format: int64
          minimum: 0
          description: Must be a direct report of the caller (the manager).
        meetingDate: { type: string, format: date, description: ISO `YYYY-MM-DD`. }
        points:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
          description: Points discussed, in order. Items must not carry ids.
        decisions:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
          description: Decisions made, in order. Items must not carry ids.
        actionItems:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/OneOnOneActionItemInput' }
          description: >-
            Action items, in order; the carried-over copies from the previous meeting are
            prepended server-side. Items must not carry ids.

    OneOnOneUpdateRequest:
      type: object
      required: [meetingDate, points, decisions, actionItems]
      properties:
        meetingDate: { type: string, format: date, description: ISO `YYYY-MM-DD`. }
        points:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
        decisions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
        actionItems:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OneOnOneActionItemInput' }

    OneOnOneItem:
      type: object
      required: [id, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        content: { type: string }

    OneOnOneActionItem:
      type: object
      required: [id, content, owner, resolved]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        content: { type: string }
        owner:
          type: string
          enum: [MANAGER, SUBORDINATE]
        dueDate: { type: string, format: date, nullable: true }
        resolved: { type: boolean }
        copiedFromId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            The source action item in the pair's previous meeting this one was carried over
            from; null for items authored in this meeting (or when the source row no longer
            exists). Server-managed.
        firstAppearedOn:
          type: string
          format: date
          nullable: true
          description: >-
            ISO date of the item's earliest surviving appearance in its carry-over chain — the
            same meeting the item's history shows first (soft-deleted ancestor meetings are
            skipped). Null when the item first appeared in this meeting or the chain no longer
            survives. Server-managed, read-only.

    OneOnOneResponse:
      type: object
      required: [id, managerId, managerName, subordinateId, subordinateName, meetingDate, lastModified, points, decisions, actionItems]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        meetingDate: { type: string, format: date }
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every update.
        points:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneItem' }
          description: Points discussed, in stored order.
        decisions:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneItem' }
          description: Decisions made, in stored order.
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneActionItem' }
          description: Action items, in stored order.
        isLatest:
          type: boolean
          default: true
          description: >-
            Whether this is the pair's latest non-deleted meeting (meeting date, id as
            tiebreaker). Only the latest may be edited or deleted (PUT/DELETE answer 409
            otherwise); clients open older meetings read-only.
        minMeetingDate:
          type: string
          format: date
          nullable: true
          description: >-
            The pair's previous meeting's date — the chronological floor for this meeting's
            date (PUT rejects anything below it with 409; the edit form uses it as the date
            input's `min`). Null when this is the pair's first meeting.

    OneOnOneListItem:
      type: object
      required: [id, managerId, managerName, managerDeleted, subordinateId, subordinateName, subordinateDeleted, meetingDate, lastModified, pointCount, decisionCount, actionItemCount, openActionItemCount]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted: { type: boolean }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        subordinateDeleted: { type: boolean }
        meetingDate: { type: string, format: date }
        lastModified: { type: integer, format: int64 }
        pointCount: { type: integer, minimum: 0 }
        decisionCount: { type: integer, minimum: 0 }
        actionItemCount: { type: integer, minimum: 0 }
        openActionItemCount:
          type: integer
          minimum: 0
          description: Action items not yet resolved.
        isLatest:
          type: boolean
          default: true
          description: >-
            Whether this row is its pair's latest non-deleted meeting — see
            `OneOnOneResponse.isLatest`. Drives the client's Edit-vs-View affordance.

    OneOnOnePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OneOnOneListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    OneOnOneEventResponse:
      type: object
      required: [id, meetingId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        meetingId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum:
            - CREATED
            - DELETED
            - DATE_CHANGED
            - POINT_ADDED
            - POINT_EDITED
            - POINT_REMOVED
            - DECISION_ADDED
            - DECISION_EDITED
            - DECISION_REMOVED
            - ACTION_ITEM_ADDED
            - ACTION_ITEM_EDITED
            - ACTION_ITEM_REMOVED
            - ACTION_ITEM_RESOLVED
            - ACTION_ITEM_UNRESOLVED
            - ACTION_ITEM_DUE_DATE_CHANGED
            - ACTION_ITEM_OWNER_CHANGED
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — 1-based `position`s, ISO dates,
            owner enum names, the CREATED event's `date`/`carriedOver`. Never item text (the
            content columns are encrypted at rest; this trail is plaintext by design). Empty
            object when the event kind needs none.

    OneOnOneEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneEventResponse' }

    ActionItemHistoryEntry:
      type: object
      required: [actionItemId, meetingId, meetingDate, content, owner, resolved]
      properties:
        actionItemId: { type: integer, format: int64, minimum: 0 }
        meetingId: { type: integer, format: int64, minimum: 0 }
        meetingDate: { type: string, format: date }
        content: { type: string }
        owner:
          type: string
          enum: [MANAGER, SUBORDINATE]
        dueDate: { type: string, format: date, nullable: true }
        resolved: { type: boolean }

    ActionItemHistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActionItemHistoryEntry' }

    GoalCreateRequest:
      type: object
      required: [subordinateId, title, type, dueDate]
      properties:
        subordinateId:
          type: integer
          format: int64
          minimum: 0
          description: Must be a direct report of the caller (the manager).
        title:
          type: string
          maxLength: 200
          description: Plaintext (unlike description/summary) — lists sort and filter on it.
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [BINARY, NUMBER, PERCENTAGE]
          description: How progress is tracked; decides which value fields apply.
        targetValue:
          type: number
          format: double
          nullable: true
          description: >-
            Required for NUMBER and PERCENTAGE (0–100 for PERCENTAGE); must be absent for
            BINARY.
        dueDate:
          type: string
          format: date
          description: >-
            ISO `YYYY-MM-DD`; must not be earlier than the current date.

    GoalDefinitionUpdate:
      type: object
      required: [title, type, dueDate]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [BINARY, NUMBER, PERCENTAGE]
          description: >-
            Changing the type re-initializes the value fields for the new type, discarding any
            recorded progress.
        targetValue:
          type: number
          format: double
          nullable: true
          description: >-
            Required for NUMBER and PERCENTAGE (0–100 for PERCENTAGE); must be absent for
            BINARY.
        dueDate:
          type: string
          format: date
          description: >-
            ISO `YYYY-MM-DD`; must not be earlier than the current date. Editable only while
            DRAFT (this endpoint is DRAFT-only).

    GoalProgressUpdate:
      type: object
      properties:
        currentValue:
          type: number
          format: double
          nullable: true
          description: >-
            The new current value — required for NUMBER and PERCENTAGE goals (0–100 for
            PERCENTAGE); must be absent for BINARY.
        achieved:
          type: boolean
          nullable: true
          description: The new done-flag — required for BINARY goals; must be absent otherwise.

    GoalCloseRequest:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 4000
          description: The closing summary — required and non-blank; recorded on the goal.

    GoalResponse:
      type: object
      required: [id, managerId, managerName, subordinateId, subordinateName, createdAt, dueDate, title, description, type, targetValue, currentValue, achieved, status, summary, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, immutable.
        dueDate:
          type: string
          format: date
          description: >-
            ISO `YYYY-MM-DD`; never earlier than the day it was last saved. Editable only while
            DRAFT.
        title: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [BINARY, NUMBER, PERCENTAGE]
        targetValue:
          type: number
          format: double
          nullable: true
          description: Null for BINARY goals.
        currentValue:
          type: number
          format: double
          nullable: true
          description: Null for BINARY goals; starts at 0.0, editable only while ACTIVE.
        achieved:
          type: boolean
          nullable: true
          description: Null unless BINARY; starts false, editable only while ACTIVE.
        status:
          type: string
          enum: [DRAFT, ACTIVE, CLOSED]
        summary:
          type: string
          nullable: true
          description: >-
            Non-null once the goal has been closed at least once — kept on reopen, overwritten
            at the next close.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every mutation.

    GoalListItem:
      type: object
      required: [id, managerId, managerName, managerDeleted, subordinateId, subordinateName, subordinateDeleted, title, type, targetValue, currentValue, achieved, status, createdAt, dueDate, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted: { type: boolean }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        subordinateDeleted: { type: boolean }
        title: { type: string }
        type:
          type: string
          enum: [BINARY, NUMBER, PERCENTAGE]
        targetValue: { type: number, format: double, nullable: true }
        currentValue: { type: number, format: double, nullable: true }
        achieved: { type: boolean, nullable: true }
        status:
          type: string
          enum: [DRAFT, ACTIVE, CLOSED]
        createdAt: { type: integer, format: int64 }
        dueDate: { type: string, format: date }
        lastModified: { type: integer, format: int64 }

    GoalPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GoalListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    GoalEventResponse:
      type: object
      required: [id, goalId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        goalId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum:
            - CREATED
            - TITLE_CHANGED
            - DESCRIPTION_CHANGED
            - TYPE_CHANGED
            - TARGET_CHANGED
            - DUE_DATE_CHANGED
            - PROGRESS_UPDATED
            - ACHIEVED_CHANGED
            - STATUS_CHANGED
            - DELETED
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — enum names (`from`/`to` statuses
            and types, the CREATED event's `type`), numeric values (target/progress
            `from`/`to`, `""` = no value), and ISO dates (the due-date change's `from`/`to`).
            Never title/description/summary text (description and
            summary are encrypted at rest; this trail is plaintext by design). Empty object when
            the event kind needs none.

    GoalEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GoalEventResponse' }

    TeamKpiCreateRequest:
      type: object
      required: [teamId, title, type, targetValue]
      properties:
        teamId:
          type: integer
          format: int64
          minimum: 0
          description: Must be a non-deleted team whose current manager the caller is.
        title:
          type: string
          maxLength: 200
          description: Plaintext (unlike description/summary) — lists sort and filter on it.
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
          description: How the KPI is measured. There is no BINARY flavor.
        targetValue:
          type: number
          format: double
          description: Always required — finite; 0–100 for PERCENTAGE.

    TeamKpiDefinitionUpdate:
      type: object
      required: [title, type, targetValue]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
          description: >-
            Changing the type wipes all collected data points (a NUMBER series is meaningless
            against a PERCENTAGE target and vice versa).
        targetValue:
          type: number
          format: double
          description: Always required — finite; 0–100 for PERCENTAGE.

    TeamKpiValueWrite:
      type: object
      required: [date, value]
      properties:
        date:
          type: string
          format: date
          description: >-
            The ISO YYYY-MM-DD date the value was measured — required, strict zero-padded, and
            never in the future (today is allowed). At most one value per date per KPI.
        value:
          type: number
          format: double
          description: The measured value — always required (finite; 0–100 for PERCENTAGE).

    TeamKpiValueResponse:
      type: object
      required: [id, date, value]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        date:
          type: string
          format: date
          description: ISO YYYY-MM-DD measurement date — unique within the KPI.
        value: { type: number, format: double }

    TeamKpiValueList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamKpiValueResponse' }
          description: The KPI's data points, sorted by date newest first.

    TeamKpiArchiveRequest:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 4000
          description: The archiving summary — required and non-blank; recorded on the KPI.

    TeamKpiResponse:
      type: object
      required: [id, teamId, teamName, teamDeleted, managerId, managerName, createdAt, title, description, type, targetValue, currentValue, currentValueDate, status, summary, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        teamId: { type: integer, format: int64, minimum: 0 }
        teamName: { type: string }
        teamDeleted:
          type: boolean
          description: >-
            True when the team has been soft-deleted — the KPI stays readable history for the
            team's last manager.
        managerId:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The team's CURRENT manager (`teams.manager_id`), resolved at read time — never
            stored on the KPI, so a reassigned team's new manager takes over.
        managerName: { type: string }
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, immutable.
        title: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
        targetValue: { type: number, format: double }
        currentValue:
          type: number
          format: double
          description: >-
            Denormalized from the data points: the max-dated point's value, recomputed on
            every values mutation — 0.0 when there are none.
        currentValueDate:
          type: string
          format: date
          nullable: true
          description: >-
            ISO YYYY-MM-DD date of the max-dated data point — null when the KPI has no data
            points (never recorded, or wiped by a type-change reset).
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        summary:
          type: string
          nullable: true
          description: >-
            Non-null once the KPI has been archived at least once — kept on reopen,
            overwritten at the next archive.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every mutation.

    TeamKpiListItem:
      type: object
      required: [id, teamId, teamName, teamDeleted, managerId, managerName, managerDeleted, title, type, targetValue, currentValue, status, createdAt, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        teamId: { type: integer, format: int64, minimum: 0 }
        teamName: { type: string }
        teamDeleted: { type: boolean }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted: { type: boolean }
        title: { type: string }
        type:
          type: string
          enum: [NUMBER, PERCENTAGE]
        targetValue: { type: number, format: double }
        currentValue: { type: number, format: double }
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        createdAt: { type: integer, format: int64 }
        lastModified: { type: integer, format: int64 }

    TeamKpiPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamKpiListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamKpiEventResponse:
      type: object
      required: [id, kpiId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        kpiId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum:
            - CREATED
            - TITLE_CHANGED
            - DESCRIPTION_CHANGED
            - TYPE_CHANGED
            - TARGET_CHANGED
            - VALUE_RECORDED
            - VALUE_CORRECTED
            - VALUE_REMOVED
            - STATUS_CHANGED
            - DELETED
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — enum names (`from`/`to`
            statuses and types, the CREATED event's `type`), numeric values (target `from`/`to`),
            and ISO dates. The data-point events carry `{date, value}` (`VALUE_RECORDED` /
            `VALUE_REMOVED`) or `{fromDate, fromValue, toDate, toValue}` (`VALUE_CORRECTED` —
            always all four, even when only one dimension changed). Never
            title/description/summary text (description and summary are encrypted at rest; this
            trail is plaintext by design). Empty object when the event kind needs none.

    TeamKpiEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TeamKpiEventResponse' }

    NotificationResponse:
      type: object
      required: [id, recipientId, timestamp, type, params, wasSeen]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        recipientId: { type: integer, format: int64, minimum: 0 }
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the notification was generated. Server-managed.
        type:
          type: string
          enum:
            - FEEDBACK_REQUESTED_TO_PROVIDER
            - FEEDBACK_REQUESTED_TO_REQUESTER
            - FEEDBACK_SENT_TO_SUBJECT
            - FEEDBACK_SENT_TO_PROVIDER
            - FEEDBACK_SENT_TO_REQUESTER
            - FEEDBACK_SENT_TO_MANAGER
            - FEEDBACK_REJECTED_TO_REQUESTER
            - FEEDBACK_PICKED_UP_TO_REQUESTER
            - FEEDBACK_WITHDRAWN_TO_SUBJECT
            - FEEDBACK_WITHDRAWN_TO_REQUESTER
            - FEEDBACK_DELETED_TO_REQUESTER
            - ONE_ON_ONE_CREATED_TO_SUBORDINATE
            - ONE_ON_ONE_CREATED_TO_MANAGER
            - GOAL_ACTIVATED_TO_SUBORDINATE
            - GOAL_DEACTIVATED_TO_SUBORDINATE
            - GOAL_CLOSED_TO_SUBORDINATE
            - GOAL_REOPENED_TO_SUBORDINATE
            - TEAM_KPI_ACTIVATED_TO_MEMBER
            - TEAM_KPI_DEACTIVATED_TO_MEMBER
            - TEAM_KPI_ARCHIVED_TO_MEMBER
            - TEAM_KPI_VALUE_RECORDED_TO_MEMBER
            - TEAM_KPI_VALUE_CORRECTED_TO_MEMBER
            - TEAM_KPI_VALUE_REMOVED_TO_MEMBER
            - TEAM_KPI_REOPENED_TO_MEMBER
            - PASSWORD_CHANGED
          description: Notification kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation values for the localized message — party names (proper nouns), e.g.
            `{provider,subject,requester}`; plus `self` — the SPA's i18next context carrier:
            `"self"` for the "about yourself" / self-reflection variants, `"reflection"` for a
            requester's own request-for-a-self-reflection confirmation, and on PASSWORD_CHANGED
            `"admin"` (an administrator reset it) or `"reset"` (self-service email reset; absent
            = the user changed it themselves). ONE_ON_ONE_CREATED_TO_SUBORDINATE carries
            `{manager,date}` and ONE_ON_ONE_CREATED_TO_MANAGER `{subordinate,date}` (the
            counterpart's name and the ISO meeting date). The GOAL_* kinds carry
            `{manager,title}` — the manager's name and the goal's plaintext title. The
            TEAM_KPI_* kinds carry `{manager,title,team}` — the manager's name, the KPI's
            plaintext title, and the team's name.
        link:
          type: string
          nullable: true
          description: Optional in-app path to open from the notification; absent when there is nowhere to go.
        wasSeen:
          type: boolean
          description: Whether the recipient has marked the notification as seen.

    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail. Served as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
          description: A URI reference identifying the problem type.
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying the specific occurrence.
