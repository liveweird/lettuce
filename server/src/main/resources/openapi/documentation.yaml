openapi: 3.1.0
info:
  title: lettuce-api
  version: 1.0.0
  description: |
    JWT-authenticated REST API for users, teams, and feedback exchange.

    Authorization model: layered RBAC.
    - Every user is implicitly a regular user; additional global roles
      (`ADMIN`, `HR`) are carried as the `roles` array and only ever
      ADD privileges on top of that baseline. `ADMIN` is the MANAGEMENT
      role: write access to users, teams, templates, and alerts (plus the
      reads those management screens need) — and NOTHING more: on feedbacks,
      1:1 meetings, goals, and notifications an admin is exactly a standard
      user. `HR` is the read-only AUDITOR: it reads every user, feedback,
      1:1 meeting, and goal — drafts included, content never redacted — plus
      the auditor list view (`view=user`), while its WRITE access stays
      exactly regular-user (no management bypasses, and no notification or
      alert-management access). Reads granted by the HR privilege are
      recorded in the security audit trail (`hr.read` / `hr.list`). A person
      needing both capabilities holds both roles. The JWT issued at
      /login carries the caller's `roles` and userId; per-request team
      membership and feedback relationships are looked up from the database.
    - Team-scoped authority: the user identified by `teams.manager_id`
      may mutate the team or its membership (reassigning the manager itself is
      ADMIN-only). Other authenticated users may only read.
    - Feedback access is derived from the `visibility` enum together with
      the caller's relationship to the row (subject / provider / requester).
      Only the provider may modify a feedback record, and ADMIN gets no
      special feedback access at all — read or write (an admin who is
      themselves a party has ordinary party rights).

    All error responses use RFC 7807 `application/problem+json` (`ProblemDetail`).
    Any endpoint may additionally return `500` (`InternalServerError`) on an
    unexpected server fault.
servers:
  - url: http://localhost:8080
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: teams
  - name: feedbacks
  - name: one-on-ones
  - name: goals
  - name: team-kpis
  - name: review-periods
  - name: performance-reviews
  - name: days-off
  - name: public-holidays
  - name: pulse-surveys
  - name: templates
  - name: dictionaries
  - name: notifications
  - name: alerts
  - name: dashboard

paths:
  /api/v1/dashboard/summary:
    get:
      tags: [dashboard]
      operationId: getDashboardSummary
      summary: The caller's at-a-glance dashboard numbers
      description: |
        Aggregated counts for the Dashboard's hero tiles, **strictly caller-scoped** — every
        number is the total of an existing caller-scoped list scope, so nothing is disclosed
        that the corresponding list would not return. `directReports` doubles as the manager
        gate (0 hides the manager tiles client-side) and as the reviews tile's denominator.
        The current-period fields are null while the review-period timeline does not cover
        the current month. `feedbackReceived30d` counts delivered (SENT) feedbacks in the
        caller's received scope by their actual SENT moment (the audit-trail event; rows
        predating the events table fall back to last-modification time), and
        `feedbackReceivedPrev30d` is the same count for the preceding 30-day window
        (days 60–30 ago) — the client renders their difference as the tile's trend.
      responses:
        '200':
          description: The caller's summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for a JWT
      description: |
        Rate-limited per client IP, and additionally throttled per account: after several
        consecutive failures for one email (default 5, `LOGIN_LOCKOUT_THRESHOLD`), further
        attempts for that account — even with the correct password — are rejected with `429`
        for a lockout window (default 15 min, `LOGIN_LOCKOUT_DURATION_SECONDS`). A successful
        login resets the counter.

        A **deactivated** account with correct credentials is rejected with `403` — the check
        runs only after the password verifies, so wrong credentials always get the uniform
        `401` and the endpoint discloses nothing about accounts the caller cannot unlock.

        **Email MFA (opt-in via the `MFA` feature flag):** when the account has MFA enabled,
        correct credentials answer `200` with an `MfaChallengeResponse` instead of tokens — a
        6-digit code is emailed to the account, and the client exchanges it together with the
        `challengeId` at `POST /api/v1/login/mfa` for the ordinary `LoginResponse`. On a
        deployment without outbound email (`MAIL_TRANSPORT=disabled`) an MFA-enabled login
        fails closed with `503`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued, or (MFA-enabled accounts) a second-factor challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LoginResponse'
                  - $ref: '#/components/schemas/MfaChallengeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Credentials are correct but the account is deactivated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: MFA is enabled for the account but this deployment cannot send email
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/login/mfa:
    post:
      tags: [auth]
      operationId: verifyMfa
      summary: Exchange an MFA challenge and emailed code for a JWT pair
      description: |
        Second login step for MFA-enabled accounts. The `challengeId` comes from the login
        response, the 6-digit `code` from the email. Challenges are single-use, expire after
        a short TTL (default 5 min, `MFA_CODE_TTL_SECONDS`), and allow a few attempts
        (default 5, `MFA_MAX_ATTEMPTS`); every failure mode — unknown challenge, expired,
        wrong code, attempts exhausted — answers the uniform `401`. Rate-limited per client
        IP. A user deactivated between the two steps gets the login `403`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The account was deactivated after the challenge was issued
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/password-reset:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a self-service password reset
      description: |
        Always answers `202` for a well-formed request, whether or not an account with that
        email exists (no account enumeration; the actual work happens asynchronously). If the
        account exists, a new password is generated, its hash replaces the old one (which stops
        working, and all outstanding refresh tokens are invalidated), and the password is sent
        to the account's email address. Throttled per submitted email — one request per interval
        (default 60 s, `PASSWORD_RESET_MIN_INTERVAL_SECONDS`) — uniformly for existing and
        unknown addresses, and rate-limited per client IP. A deactivated account is treated
        like an unknown address (no password is minted, no email sent; the `202` stays
        uniform). Answers `503` on deployments without outbound email
        (`MAIL_TRANSPORT=disabled`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted — if the account exists, an email is on its way
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (password reset unavailable)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Exchange a refresh token for a fresh access + refresh pair
      description: |
        Pure-sliding session renewal. Accepts a valid, unexpired, non-revoked refresh token and
        returns a brand-new access token and refresh token (each with a full TTL). The presented
        refresh token is left valid until its own expiry — it is not rotated out. Requires no
        `Authorization` header (the access token may already be expired). Returns `401` for a
        missing/invalid/expired/revoked refresh token, if the user no longer exists or the
        account is deactivated, or if the token was minted before the user's most recent
        password change.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the bearer token (server-side denylist)
      description: |
        Revokes the access token carried in the `Authorization` header. If a `refreshToken` is
        supplied in the body, it is revoked too. The body is optional.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Token revoked
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users
      description: |
        Any authenticated user may list. Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email`. Default sort is `id` ascending.
          `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `name` — case- and accent-insensitive substring match against `name`.
          - `email` — case- and accent-insensitive substring match against `email`.
          - `role` — has-role match: only users holding this additional role (`ADMIN`/`HR`).
          - `teamId` — restrict to users who are members of the given team.
          - `deactivated` — strict boolean: only deactivated (`true`) or only active (`false`)
            accounts.
          - `feature` + `featureEnabled` — feature-flag state filter; the pair MUST be provided
            together (a lone half is `400`). `featureEnabled=true` returns users with the named
            feature enabled (no disabled row), `false` those with it disabled.

        Rows additionally carry `teams` — the non-deleted teams the user is a MEMBER of
        (name-ascending; empty array = none) — a list-only enrichment (v2.1.0, backs the
        /feature-flags team column); the single-user responses omit the key.

        Malformed query parameters (unknown sort field, unknown role, unknown feature,
        out-of-range page/pageSize) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: >-
            Case- and accent-insensitive substring match against the user's name
            (e.g. `zolw` matches `Żółw`).
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the user's email.
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, HR] }
          description: Only users holding this additional role.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Filter to users who are members of the given team.
        - name: deactivated
          in: query
          required: false
          schema: { type: boolean }
          description: >-
            Strict boolean — only deactivated (true) or only active (false) accounts.
        - name: feature
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Feature' }
          description: >-
            Feature-flag state filter — must be paired with `featureEnabled` (400 otherwise).
        - name: featureEnabled
          in: query
          required: false
          schema: { type: boolean }
          description: >-
            Strict boolean — with `feature`, selects users who have that feature enabled (true)
            or disabled (false). Must be paired with `feature` (400 otherwise).
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user
      description: |
        Requires ADMIN. If the request body omits `roles`, the new user gets no additional
        roles (every user is implicitly a regular user).
        With `sendEmail: true` the new user is emailed their credentials (the same bilingual
        welcome message as the mass import); `emailSent` in the response reports the delivery
        outcome (a failure keeps the account). Rejected with `503` before creating anything
        when the deployment has no outbound email (`MAIL_TRANSPORT=disabled`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: Email already in use
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (sendEmail requested)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/users/import:
    post:
      tags: [users]
      operationId: importUsers
      summary: Mass-import users from CSV (ADMIN only)
      description: |
        Creates one account per CSV line (`name,email`; an optional literal `name,email`
        header and blank lines are skipped; names may contain commas — the line is split on
        its last comma). Every row imports independently: a parse error, duplicate, or
        failure on one line never affects the others. Each created account is a regular user
        (no additional roles) with a server-generated 16-character password, returned in that row's `password`
        field — shown to the admin ONCE, never retrievable again. With `sendEmails: true`
        each new user is emailed their password (bilingual EN/PL); if the deployment has no
        outbound email (`MAIL_TRANSPORT=disabled`) the request is rejected with `503` before
        importing anything. A delivery failure after creation yields status `EMAIL_FAILED`
        (the account exists; the password is still in the row). `created` counts `CREATED`
        plus `EMAIL_FAILED` rows; `errors` counts `PARSE_ERROR` plus `ERROR` rows. Caps:
        200 data rows / 256 KiB of CSV per request (`400` beyond either). Deliberately not
        rate-limited per IP (unlike the password reset): the endpoint is admin-only and the
        row/size caps already bound the work per request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserImportRequest'
      responses:
        '200':
          description: Per-row import results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserImportResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503':
          description: This deployment cannot send email (sendEmails requested)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [users]
      operationId: getUser
      summary: Fetch a user by id
      description: Requires the caller to be the target user, ADMIN, or HR (HR reads are audit-logged).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user, not ADMIN, and not HR
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [users]
      operationId: replaceUser
      summary: Replace a user
      description: |
        Replaces a user's editable representation — `name`, `email`, and `roles` (all required).
        The password is NOT part of this representation (it has its own `PUT /users/{id}/password`
        sub-resource and is preserved here). Requires the caller to be the target user, or ADMIN.
        Only ADMIN may change a user's `roles`; a non-ADMIN caller must send the set the user
        already has, otherwise the request is rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or attempted to change roles
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Email already in use by another user
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Delete a user
      description: Requires ADMIN.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: changeUserPassword
      summary: Change a user's password
      description: |
        Sets a new password for the user (minimum 10 characters). Only the password is
        changed; no other fields are touched. Requires the caller to be the target user,
        or to be ADMIN. When the caller changes their OWN password (even an admin),
        `currentPassword` is required and must match; an admin resetting another user's
        password omits it. A successful change invalidates all outstanding refresh tokens
        (already-issued access tokens expire naturally within their TTL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '204': { description: Password updated }
        '400':
          description: New password shorter than 10 characters
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the target user and not ADMIN, or the required current password is missing/incorrect
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [users]
      operationId: deactivateUser
      summary: Deactivate a user account (ADMIN only)
      description: |
        Reversibly disables the account (any current state other than active is `409`).
        **ADMIN-only**, and never one's own account (`403`). A deactivated user cannot sign
        in (`403` at login once the password verifies), existing sessions end at the next
        refresh, self-service password reset is silently skipped, and the user cannot be
        NEWLY assigned anywhere (team member/manager, goal/1:1/review subordinate, feedback
        party — `400` at those create endpoints). Everything else is untouched: their
        historical data stays visible under unchanged rights, they keep their email reserved,
        and `POST /users/{id}/activate` restores access. Audited as `user.deactivated`.
      responses:
        '204': { description: Deactivated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN, or tried to deactivate their own account
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account is already deactivated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [users]
      operationId: activateUser
      summary: Reactivate a deactivated user account (ADMIN only)
      description: |
        Reverses `POST /users/{id}/deactivate` (an account that is not deactivated is `409`).
        **ADMIN-only.** The user can sign in again with their existing password; nothing else
        changes — their data, roles, and email were never touched. Audited as
        `user.reactivated`.
      responses:
        '204': { description: Reactivated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account is not deactivated
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/features:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserDisabledFeatures
      summary: Replace a user's disabled-feature set (ADMIN only)
      description: |
        Per-user feature flags: a **wholesale replace** of the target user's DISABLED set —
        an empty array re-enables everything (the default state; idempotent, a same-set re-PUT
        is `204` again). **ADMIN-only**; unlike deactivation, changing one's OWN flags is
        allowed (the users routes themselves are never feature-gated, so an admin can always
        find their way back). Caller-only semantics: a disabled feature blocks what the user
        themselves may see and execute (`403` on that feature's endpoints, and its notification
        types disappear from their list), never what others may create involving them. Uniform
        for every role — HR audit reads and the ADMIN registries (review periods =
        `PERFORMANCE_REVIEWS`, public holidays = `DAYS_OFF`) are gated exactly like ordinary
        use. The set rides the JWT, so a change takes effect at the target's next token refresh
        (≤15 min) or login. Audited as `user.features_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFeaturesUpdateRequest'
      responses:
        '204': { description: Disabled-feature set replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/users/{id}/email-notifications:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [users]
      operationId: setUserEmailNotifications
      summary: Toggle the user's email-notification mirror (self or ADMIN)
      description: |
        The per-user email-mirror opt-out (v2.3.0): while `enabled` is `true` (the default for
        every account), each in-app notification minted for the user is also sent to their
        email address — bilingual EN+PL, including the notification's deep link when the
        deployment's `mail.appUrl` is configured. `false` = in-app only. **Target user or
        ADMIN** (self-service is the point — the sibling features PUT stays ADMIN-only);
        idempotent (a same-value re-PUT is `204` again); a deactivated target is allowed (the
        setting is inert until reactivation). The flag is read at send time, so a change takes
        effect immediately — no token-refresh staleness. On a `mail.transport=disabled`
        deployment the toggle still persists; no email is sent either way. Audited as
        `user.email_notifications_changed` on an actual change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEmailNotificationsUpdateRequest'
      responses:
        '204': { description: Email-notification setting stored }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is neither the target user nor ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams:
    get:
      tags: [teams]
      operationId: listTeams
      summary: List teams
      description: |
        Any authenticated user may list. Supports offset pagination, sorting, and filtering.

        - Sortable fields: `id`, `name`. Default sort is `id` ascending; `id` ascending
          is always appended as a deterministic tiebreaker.
        - Filters (all optional):
          - `name` — case- and accent-insensitive substring match against the team's name.
          - `managerId` — exact match against the team's manager id.
          - `memberId` — restrict to teams the given user is a member of.

        Each returned item includes the manager's `name` resolved via join so the UI
        does not need an N+1 lookup.

        Malformed query parameters (unknown sort field, non-numeric managerId,
        out-of-range page/pageSize) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the team's name.
        - name: managerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the team's manager id.
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Filter to teams the given user is a member of.
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [teams]
      operationId: createTeam
      summary: Create a team
      description: |
        Any authenticated user may create a team, but the `managerId` in
        the request body must equal the caller's own user id (ADMIN may
        designate any user). Referencing a **deactivated** user as manager
        or member is rejected with `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new team resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400':
          description: Validation error (e.g. manager in member list, duplicate members, referenced user does not exist)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller attempted to set `managerId` to another user without being ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams/members:
    get:
      tags: [teams]
      operationId: listTeamMembers
      summary: List members of the caller's teams
      description: |
        Lists team members scoped by `view`. Scoping is always relative to the caller,
        including ADMIN callers.

        - `view=member` (the default): members of teams where the caller is a member.
          The caller's own rows are excluded. Team managers never appear — a manager is
          not a `team_members` row. Items carry the peer feedback stats
          `lastFeedbackGivenAt` / `lastFeedbackReceivedAt` (see `TeamMemberListItem`) —
          when the caller last provided this peer feedback, and when this peer last
          provided the caller feedback the caller can see. Peers run no 1:1s with each
          other in this model, so there is no 1:1 stat.
        - `view=managed`: members of teams where the caller is the manager. With
          `includeIndirect=true`, additionally the members of teams managed by anyone in
          the caller's transitive management chain (the caller's indirect reports, each
          shown with the team they hold under their own manager). Items carry the
          dashboard stats `lastOneOnOneDate` / `lastOneOnOneOpenItems` / `lastFeedbackAt`
          / `activeGoalCount` (see `TeamMemberListItem`) with the caller as the 1:1's
          manager / the feedback's provider / the goals' manager, regardless of
          `includeIndirect`.
        - `view=managers`: the managers of teams where the caller is a member. Each item
          describes a manager (in `userId`/`name`/`email`) and the managed team. The
          caller is excluded. Items carry the same dashboard stats fields with this
          manager as the 1:1's manager / the feedback's provider / the goals' manager.

        In every view a user appearing once per shared team repeats the same stats on
        each row. The `lastOneOnOne*`/`lastFeedbackAt`/`activeGoalCount` set is always
        `null` for `view=member`; the given/received pair is always `null` for
        `view=managers` and `view=managed`.

        Every view's items additionally carry the row user's resolved career profile
        (`careerPath` / `careerSpecialization` / `seniorityLevel`) — see
        `TeamMemberListItem`.

        Each item is one (user, team) pair — a user who shares several teams with the
        caller appears once per team. Soft-deleted users and soft-deleted teams are
        excluded.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id` (the member's user id), `name`, `email`, `teamName`.
          Default sort is `id` ascending. `id` ascending and the team id ascending are
          always appended as deterministic tiebreakers.
        - Filters (all optional, all whitelisted):
          - `name` — case- and accent-insensitive substring match against the member's name.
          - `email` — case- and accent-insensitive substring match against the member's email.
          - `teamId` — exact match against the team's id.

        Malformed query parameters (unknown view, unknown sort field, non-numeric
        teamId, non-boolean includeIndirect, `includeIndirect` combined with a view other
        than `managed`, out-of-range page/pageSize) respond with `400` and a
        `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [member, managed, managers], default: member }
          description: |
            Which caller-relative slice to list.
            - `member`: members of teams the caller belongs to. Items carry the peer
              feedback stats `lastFeedbackGivenAt` / `lastFeedbackReceivedAt` (see
              `TeamMemberListItem`); no 1:1 stat.
            - `managed`: members of teams the caller manages. Items carry the dashboard
              stats fields (see `TeamMemberListItem`) with the caller as the 1:1's
              manager / the feedback's provider / the goals' manager.
            - `managers`: the managers of teams the caller is a member of. Each item's
              `userId`/`name`/`email` describe the manager and `teamId`/`teamName` the
              managed team. The caller is excluded; a manager who manages several of the
              caller's teams appears once per team. Items carry the dashboard stats
              fields with this manager as the 1:1's manager / the feedback's provider /
              the goals' manager.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=managed` (else `400`). When `true`, widens the scope
            from direct reports to the caller's whole transitive management chain:
            members of teams managed by the caller or by any of the caller's (direct or
            indirect) subordinates. Cycle-safe; the caller themselves never appears.
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the member's name.
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the member's email.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the team's id.
      responses:
        '200':
          description: A page of team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [teams]
      operationId: getTeam
      summary: Fetch a team
      description: Any authenticated user may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [teams]
      operationId: replaceTeam
      summary: Replace a team
      description: >-
        Requires the caller to be the team's current manager, or to be ADMIN. Reassigning the
        manager (changing `managerId` to a different user) is ADMIN-only — a current manager may
        edit their team but not hand it off (403 otherwise). NEWLY adding a **deactivated**
        member or changing the manager to a deactivated user is rejected with `400`;
        resubmitting an unchanged existing reference is not validated, so a team containing a
        since-deactivated user stays editable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Validation error (e.g. referenced user does not exist)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Caller is not the team's manager and not ADMIN, or a non-ADMIN manager attempted to
            reassign `managerId` to a different user
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: deleteTeam
      summary: Delete a team
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the team's manager and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/UserIdInPath'
    put:
      tags: [teams]
      operationId: addTeamMember
      summary: Add a member to the team (idempotent)
      description: >-
        Requires the caller to be the team's current manager, or to be ADMIN. NEWLY adding a
        **deactivated** user is rejected with `400`; re-adding an already-present member (even
        a since-deactivated one) stays the idempotent no-op.
      responses:
        '204': { description: Member added (or already present) }
        '400':
          description: Validation error (e.g. adding the manager as a member, referenced user does not exist)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the team's manager and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [teams]
      operationId: removeTeamMember
      summary: Remove a member from the team (idempotent)
      description: |
        Requires the caller to be the team's current manager, or to be ADMIN.
        Idempotent: removing a user who is not (or no longer) a member is a no-op `204`.
        Zero-member teams are allowed, so removing the last member succeeds. The manager
        is never a `team_members` row, so this endpoint cannot affect them.
      responses:
        '204': { description: Removed (or was not a member) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the team's manager and not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks:
    get:
      tags: [feedbacks]
      operationId: listFeedbacks
      summary: List feedbacks for the caller
      description: |
        Lists feedback records scoped by `view`. Scoping is always relative to the caller —
        including ADMIN callers — except `view=user`, the HR auditor view.

        - `view=received` (the default): rows where the caller is the **subject**, scoped exactly
          like the single-GET read rules (every listed row is also openable): (a) the caller is
          the requester and `visibility` is `PROVIDER_REQUESTER`/`PROVIDER_REQUESTER_SUBJECT`
          (any status); (b) otherwise (no requester, or someone else's request) `visibility` is
          `PROVIDER_SUBJECT`/`PROVIDER_REQUESTER_SUBJECT` and `status` is `SENT`/`WITHDRAWN`;
          or (c) `visibility` is `PUBLIC` and `status` is `SENT` (in either role). A
          `DRAFT`/`REQUESTED` row the caller requested has its `contentPreview` redacted (empty)
          until it is sent.
        - `view=provided`: rows where the caller is the provider, regardless of visibility
          (a provider may always read their own records).
        - `view=team`: rows where the subject is one of the caller's **direct reports** (a member
          of a non-deleted team the caller manages) — or, with `includeIndirect=true`, anyone in
          the caller's **transitive management chain** (also members of teams managed, recursively,
          by those members) — AND the caller is a **party** to the row — its provider or
          requester (at any status) — OR `status` is `SENT`/`WITHDRAWN`. Intended for a manager's
          overview; in-progress (`DRAFT`/`REQUESTED`/`REJECTED`) rows the manager is not a party to
          are excluded. A caller who manages no team gets an empty page. When the manager is also
          the requester of an unfinished row, its `contentPreview` is redacted (empty) until sent.
          Note the narrower direct-only default is a list scope, not an authorization boundary:
          the single-GET grants any manager in the subject's chain read access once delivered.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view —
          every feedback the given user is a party to (subject, provider, or requester), at
          every status and visibility, DRAFTs included; `contentPreview` is never redacted.
          HR usage is recorded in the security audit trail. The ordinary sort/filter/paging
          parameters apply on top.
        - `view=kudos`: the org-wide Kudos wall — **every** feedback with `visibility=PUBLIC`
          and `status=SENT`, regardless of who provided or received it. Available to any
          authenticated caller: these are exactly the rows the single-GET read rules already
          grant everyone. Rows in this view additionally carry the **full `content`**
          (uncapped, alongside the usual `contentPreview`) so the wall can expand cards
          inline. Intended ordering is `sort=-lastModified` (newest first); for a `SENT` row
          `lastModified` is the moment it was sent, unless it was edited afterwards.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `requesterName`, `subjectName`, `providerName`, `visibility`,
          `status`, `lastModified`. Default sort is `id` ascending. `id` ascending is always
          appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `requesterName` — case- and accent-insensitive substring match against the requester's name.
            Rows without a requester never match when this filter is set.
          - `subjectName` — case- and accent-insensitive substring match against the subject's name.
          - `providerName` — case- and accent-insensitive substring match against the provider's name.
          - `providerId` — exact match against the provider's user id. Combined with
            `view=received`, this scopes the list to feedbacks a specific person gave the caller.
          - `subjectId` — exact match against the subject's user id. Combined with
            `view=provided`, this scopes the list to feedbacks the caller gave a specific person.
          - `visibility` — exact match against the visibility enum.
          - `status` — exact match against the status enum.
          - `lastModified[gte]` — lower bound (inclusive) on `lastModified`, epoch
            milliseconds. Returns rows changed at or after this instant.
        - `content` is returned as `contentPreview`, capped at 200 characters; it is neither
          sortable nor filterable. `view=kudos` rows additionally carry the full `content`;
          every other view omits that key.

        Malformed query parameters (unknown view, unknown sort field, unknown enum value,
        out-of-range page/pageSize) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [received, provided, team, user, kudos], default: received }
          description: >-
            Which slice of feedbacks to list — caller-relative, except the HR
            auditor view `user` and the org-wide `kudos` wall.
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=team` (else `400`). When `true`, widens the subject scope
            from the caller's direct reports to their whole transitive management chain:
            members of teams managed by the caller or by any of the caller's (direct or
            indirect) subordinates. Cycle-safe; the caller themselves never appears as subject
            through this scope.
        - name: requesterName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the requester's name.
        - name: subjectName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the subject's name.
        - name: providerName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the provider's name.
        - name: providerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the provider's user id.
        - name: subjectId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the subject's user id.
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
          description: Exact match against the record's visibility.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
          description: Exact match against the record's status.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: >-
            Lower bound (inclusive) on `lastModified`, epoch milliseconds.
            Returns rows changed at or after this instant.
      responses:
        '200':
          description: A page of feedbacks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [feedbacks]
      operationId: createFeedback
      summary: Create a feedback record
      description: >-
        Any authenticated user may create a feedback record they are a party to. The provider may
        equal the subject — a self-reflection (feedback about yourself) — either standalone or
        with a requester (someone requesting a self-reflection from the subject). Creation is
        rejected with `409` while a feedback with the same (subject, provider, requester) triple
        — a null requester matches only null — is still in progress (active `DRAFT` or
        `REQUESTED`); the `ProblemDetail.instance` carries `/api/v1/feedbacks/{id}` of the
        existing record. Clients should pre-check via `GET /api/v1/feedbacks/duplicate-check`.
        Creation involving a **deactivated** party (provider, requester, or subject) is
        rejected with `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new feedback resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400':
          description: 'Validation error (requester ≠ provider; REQUESTED requires a requester; a feedback with a requester may not use PROVIDER_SUBJECT visibility; PROVIDER_REQUESTER visibility requires a requester) or referenced user does not exist'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not a party (provider or requester) to the feedback
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >-
            A feedback with the same (subject, provider, requester) triple is already in
            progress (`DRAFT` or `REQUESTED`); `instance` is the existing record's API path.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/duplicate-check:
    get:
      tags: [feedbacks]
      operationId: checkFeedbackDuplicate
      summary: Check for an in-progress duplicate of a prospective feedback
      description: >-
        Returns the active `DRAFT`/`REQUESTED` feedback matching the given
        (subject, provider, requester) triple, if any — the create screens call this up-front so
        the user is warned (with a link) before filling the form. A null/omitted `requesterId`
        matches only rows without a requester. The caller must be the prospective provider or
        requester — the same party rule as creation, so a matching row always has the
        caller as a party and no unrelated draft's existence can be probed.
      parameters:
        - name: subjectId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: providerId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: requesterId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: The duplicate, or nulls when there is none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateCheckResponse'
        '400':
          description: Missing or malformed subjectId/providerId/requesterId
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is neither the prospective provider nor requester
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [feedbacks]
      operationId: getFeedback
      summary: Fetch a feedback record
      description: |
        Authorization (`canReadFeedback`) is evaluated in this order — read access depends on the
        caller's relationship to the row, the `visibility` and (for subject/manager/public) the
        `status`:
        - The **provider** may always read, at any status/visibility. (ADMIN gets no special access.)
        - the **HR auditor** may always read, at any status/visibility — drafts included
          (audit-logged).
        - the **requester** may read at any status, but only when `visibility` is
          `PROVIDER_REQUESTER` or `PROVIDER_REQUESTER_SUBJECT`.
        - the **subject** may read only when `visibility` is `PROVIDER_SUBJECT` or
          `PROVIDER_REQUESTER_SUBJECT` AND `status` is `SENT` or `WITHDRAWN` (so a `DRAFT`/
          `REQUESTED`/`REJECTED` record is not visible to the subject through this rule).
        - any **manager in the subject's management chain** (their manager, that manager's
          manager, and so on — transitive over non-deleted teams) may read a feedback about the
          subordinate once it is delivered — `status` is `SENT` or `WITHDRAWN`; the provider's
          `DRAFT`/`REQUESTED` work stays private to the parties involved.
        - otherwise a `PUBLIC` record may be read by any authenticated user once `status` is `SENT`.
        Anything else is `403`.

        Content redaction: a requester may see that a feedback they requested exists, but while it
        is unfinished (`DRAFT`/`REQUESTED`) the `content` field is returned as an empty string for
        that requester; it becomes visible once the feedback is sent. The HR auditor is exempt —
        even as the requester of an unfinished feedback, HR content is never redacted. The field
        is therefore not guaranteed non-empty and is omitted from `required`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Caller is not the HR auditor and their relationship to the row does not satisfy
            `visibility`
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [feedbacks]
      operationId: editFeedbackContent
      summary: Edit a feedback's content and visibility
      description: |
        Edits the feedback's editable representation — `content` and `visibility`. Only the record's
        provider may edit — nobody else, ADMIN included. **Status is not changed here**:
        lifecycle transitions go through the `POST /feedbacks/{id}/{send,withdraw,reject,pick-up}`
        action sub-resources (mirroring notifications' `seen`/`unseen` actions). Party ids and the
        requester message are immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackContentUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: 'Validation error (a feedback with a requester may not use PROVIDER_SUBJECT visibility; PROVIDER_REQUESTER visibility requires a requester)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the feedback's provider
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [feedbacks]
      operationId: deleteFeedback
      summary: Delete a feedback record
      description: |
        Soft-deletes a feedback (the row is flagged, not physically removed, and disappears from
        reads/lists). Only the record's **provider** may delete (nobody else, ADMIN included, has feedback write
        access), and only while the feedback is in **DRAFT** status. If the feedback has a requester,
        they receive a notification that the provider deleted it (no link). The deletion is recorded
        in the feedback's audit history.
      responses:
        '204': { description: Deleted }
        '400':
          description: Feedback is not in DRAFT status (only drafts may be deleted)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the feedback's provider
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [feedbacks]
      operationId: listFeedbackEvents
      summary: List a feedback's audit history
      description: |
        Returns the immutable audit trail for a feedback — one entry per create, status transition,
        content/visibility edit, and deletion — newest first (id descending as the same-instant
        tiebreaker). Each entry is structural: an event
        `type` plus a `params` map of enum names, with the acting user resolved to `userName`; no
        rendered string is stored (clients localize the description). Authorization matches the
        single-GET above (`canReadFeedback`, with a managing caller allowed): whoever may read the
        feedback may read its history. Events are server-generated; there is no
        create/update/delete endpoint.
      responses:
        '200':
          description: The feedback's events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller may not read this feedback
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/feedbacks/{id}/send:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: sendFeedback
      summary: Send a feedback (DRAFT → SENT)
      description: |
        Delivers a draft. Provider-only, no request body. Valid only from DRAFT (otherwise 409).
        Notifies the subject, the provider, and the requester (if any) and records an audit
        event. For a self-reflection (provider == subject) only the requester, if any, is
        notified — the other recipients would be the acting user.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/feedbacks/{id}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: withdrawFeedback
      summary: Withdraw a feedback (DRAFT|SENT → WITHDRAWN)
      description: |
        Retracts a draft or a sent feedback (terminal). Provider-only, no request body. Valid from
        DRAFT or SENT (otherwise 409). Notifies the subject (and the requester, if any); for a
        self-reflection (provider == subject) only the requester, if any, is notified.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/feedbacks/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: rejectFeedback
      summary: Reject a feedback request (REQUESTED → REJECTED)
      description: |
        Declines a pending request (terminal). Provider-only, no request body. Valid only from
        REQUESTED (otherwise 409). Notifies the requester.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/v1/feedbacks/{id}/pick-up:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [feedbacks]
      operationId: pickUpFeedback
      summary: Pick up a feedback request (REQUESTED → DRAFT)
      description: |
        The provider accepts a pending request and starts a draft. Provider-only, no request body.
        Valid only from REQUESTED (otherwise 409). Also 409 when an active DRAFT with the same
        (subject, provider, requester) triple already exists (`instance` carries its API path) —
        reachable only with duplicates predating the create-time no-duplicate invariant.
        Notifies the requester.
      responses:
        '204': { description: Transitioned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/FeedbackNotProvider' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones:
    get:
      tags: [one-on-ones]
      operationId: listOneOnOnes
      summary: List 1:1 meetings for the caller
      description: |
        Lists 1:1 meetings scoped by `view`. Except `view=user` (the HR auditor view),
        scoping is always relative to the caller, including
        ADMIN callers.

        - `view=own` (the default): meetings where the caller is the **subordinate**.
        - `view=managed`: meetings where the caller is the **manager** (the author).
        - `view=team`: meetings run **by the caller's subordinates as managers** — the manager is
          one of the caller's **direct reports** (a member of a non-deleted team the caller
          manages) or, with `includeIndirect=true`, anyone in the caller's **transitive
          management chain**. A caller who manages no team gets an empty page. The narrower
          direct-only default is a list scope, not an authorization boundary: the single-GET
          grants any manager in the subordinate's chain read access.
        - `view=with`: every meeting **between the caller and one counterpart** (`counterpartId`,
          required for this view and rejected on any other), in **either role direction** — the
          pair may have swapped manager/subordinate roles over time. The caller is a party to
          every returned row.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view —
          every meeting the given user is a party to, in either role direction. HR usage is
          recorded in the security audit trail. The ordinary sort/filter/paging parameters
          apply on top.

        Rows carry the party names, the meeting date, and per-list counts (`pointCount`,
        `decisionCount`, `actionItemCount`, `openActionItemCount`) — never item content.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `meetingDate`, `managerName`, `subordinateName`, `lastModified`.
          Default sort is `meetingDate` **descending** (newest meetings first). `id` ascending is
          always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `managerName` — case- and accent-insensitive substring match against the manager's name.
          - `subordinateName` — case- and accent-insensitive substring match against the subordinate's name.
          - `meetingDate[gte]` / `meetingDate[lte]` — inclusive ISO-date (`YYYY-MM-DD`) bounds on
            the meeting date. Malformed dates → `400`.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed, team, with, user], default: own }
          description: >-
            Which slice of 1:1 meetings to list — caller-relative, except the HR
            auditor view `user`.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=team` (else `400`). When `true`, widens which managers count
            from the caller's direct reports to their whole transitive management chain.
        - name: counterpartId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            The other party's user id. Required with `view=with` (else `400`), rejected on any
            other view (`400`).
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: managerName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the manager's name.
        - name: subordinateName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the subordinate's name.
        - name: meetingDate[gte]
          in: query
          required: false
          schema: { type: string, format: date }
          description: Lower bound (inclusive) on the meeting date, ISO `YYYY-MM-DD`.
        - name: meetingDate[lte]
          in: query
          required: false
          schema: { type: string, format: date }
          description: Upper bound (inclusive) on the meeting date, ISO `YYYY-MM-DD`.
      responses:
        '200':
          description: A page of 1:1 meetings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOnePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [one-on-ones]
      operationId: createOneOnOne
      summary: Document a new 1:1 meeting
      description: |
        Creates a 1:1 meeting document. The **manager is always the author**: the caller becomes
        the meeting's manager (never taken from the body), and the subordinate must be one of the
        caller's **direct reports** at creation time — there is no ADMIN create-on-behalf.
        A **deactivated** subordinate is rejected with `400`.

        **Chronological order**: `meetingDate` may not be strictly earlier than the pair's
        latest existing meeting (`409`) — 1:1s are documented continuously, in order. The same
        date is allowed (a same-day follow-up), and the pair's first meeting accepts any date.

        **Carry-over**: unresolved action items of the pair's previous meeting (the latest
        non-deleted meeting of the same manager+subordinate pair by meeting date, id as
        tiebreaker) are copied into the new meeting server-side, ahead of any `actionItems`
        supplied here. Each copy snapshots the source's text/owner/due date, starts unresolved,
        and carries `copiedFromId` — the source item's id — so the item's history across meetings
        can be reconstructed. Items in this request must NOT carry `id`s (`400`).

        Both parties are notified (view links) — creation is the feature's only notifying
        event; edits and deletions notify nobody. The creation is recorded in the meeting's
        audit history with the carried-over count.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOnOneCreateRequest'
      responses:
        '201':
          description: Created — the full document, including the carried-over action items
          headers:
            Location:
              schema: { type: string }
              description: URL of the new 1:1 meeting resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOneResponse'
        '400':
          description: 'Validation error (malformed ISO date, blank or oversized item text, more than 100 items in a list, item ids in a create payload) or referenced user does not exist'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The subordinate is not a direct report of the caller
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >-
            The meeting date is earlier than the pair's latest existing meeting — 1:1s are
            recorded in chronological order (the detail names the conflicting date)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [one-on-ones]
      operationId: getOneOnOne
      summary: Fetch a 1:1 meeting
      description: |
        Returns the full meeting document — parties, date, and the three ordered lists (points
        discussed, decisions made, action items). Readable by the meeting's **manager**, its
        **subordinate**, the **HR auditor** (audit-logged), and any **manager in the
        subordinate's transitive management chain** (their manager, that manager's manager, and
        so on — over non-deleted teams). Anything else — ADMIN included — is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOneResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [one-on-ones]
      operationId: updateOneOnOne
      summary: Replace a 1:1 meeting's document
      description: |
        Full-document replace of the editable representation — the meeting date and the three
        lists. **Manager-only** (the subordinate has read rights only; nobody else — ADMIN
        included — gets write access). The parties are immutable after creation. **Only the pair's latest non-deleted
        meeting** (by meeting date, id as tiebreaker — the carry-over ordering) **may be
        edited**; older meetings are immutable records and answer `409` (the `isLatest` flag on
        the read/list responses tells clients up-front). Deleting the latest meeting makes the
        previous one the pair's latest again.

        Item reconciliation: entries carrying an `id` update that existing row in place; entries
        without an `id` are inserted; rows missing from the payload are removed. Positions are
        rewritten from payload order (the list order IS the stored order). Ids that don't belong
        to this meeting, or duplicated ids, are `400`. `copiedFromId` is server-managed and
        cannot be changed.

        Every change is recorded in the audit history at per-item granularity (point/decision/
        action item added, edited, removed; action item resolved/unresolved, due date changed,
        owner changed; meeting date changed). Pure reordering records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneOnOneUpdateRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: 'Validation error (malformed ISO date, blank or oversized item text, more than 100 items in a list, unknown or duplicate item ids)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Not the pair's latest meeting (older 1:1s are immutable records), or the new
            meeting date would fall before the pair's previous meeting (`minMeetingDate` on the
            read response is the floor) — meetings stay chronological
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [one-on-ones]
      operationId: deleteOneOnOne
      summary: Delete a 1:1 meeting
      description: |
        Soft-deletes a 1:1 meeting (the row is flagged, not physically removed, and disappears
        from reads/lists; its audit history is retained). **Manager-only**, and — like PUT —
        **only the pair's latest meeting** (older ones are immutable records, `409`); deleting
        the latest makes the previous one the pair's latest again. Nobody is notified.
        Action-item copy chains passing through the deleted meeting stay walkable — its entries
        are merely skipped in history views.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Not the pair's latest meeting — older 1:1s are immutable records
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [one-on-ones]
      operationId: listOneOnOneEvents
      summary: List a 1:1 meeting's audit history
      description: |
        Returns the immutable audit trail for a 1:1 meeting — one entry per creation, per-item
        change, and deletion — newest first (id descending as the same-instant tiebreaker). Each
        entry is structural: an event `type` plus a
        `params` map (1-based positions, ISO dates, owner enum names — never item text), with the
        acting user resolved to `userName`; no rendered string is stored (clients localize the
        description). Authorization matches the single-GET above: whoever may read the meeting
        may read its history. Events are server-generated; there is no create/update/delete
        endpoint.
      responses:
        '200':
          description: The meeting's events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OneOnOneEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/one-on-ones/action-items/{id}/history:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [one-on-ones]
      operationId: getActionItemHistory
      summary: List every meeting an action item appeared in
      description: |
        Returns the full history of an action item across the chain of carried-over copies — the
        queried item, its ancestors (via `copiedFromId`), and all descendants (copies of it, and
        copies of those) — one entry per appearance, newest meeting first (meeting id descending
        as tiebreaker). Entries whose meeting has been deleted are skipped, but the chain is walked
        through them, so history survives a deleted intermediate meeting.

        Authorization matches the meeting single-GET, checked against the queried item's meeting
        (every copy in a chain belongs to the same manager+subordinate pair). `404` when the item
        does not exist or its meeting has been deleted.
      responses:
        '200':
          description: The action item's appearances, newest meeting first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionItemHistoryList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/OneOnOneNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals:
    get:
      tags: [goals]
      operationId: listGoals
      summary: List goals for the caller
      description: |
        Lists goals scoped by `view`. Except `view=user` (the HR auditor view), scoping
        is always relative to the caller, including ADMIN
        callers.

        - `view=own` (the default): goals where the caller is the **subordinate**.
        - `view=managed`: goals where the caller is the **manager** (the author). With
          `includeIndirect=true`, additionally goals set **by managers in the caller's
          transitive management chain** — excluding their DRAFT goals (a draft stays private
          to its pair until activated, matching the single-GET's chain rule; the caller's own
          DRAFTs are always listed).
        - `view=team`: goals set **by the caller's subordinates as managers** — the goal's
          manager is one of the caller's **direct reports** (a member of a non-deleted team the
          caller manages) or, with `includeIndirect=true`, anyone in the caller's **transitive
          management chain**. DRAFT goals are excluded — a draft stays private to the pair until
          activated, matching the single-GET's chain rule. A caller who manages no team gets an
          empty page. The narrower direct-only default is a list scope, not an authorization
          boundary: the single-GET grants any manager in the subordinate's chain read access to
          a non-DRAFT goal.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view —
          every goal the given user is a party to (manager or subordinate), at every status,
          DRAFTs included. HR usage is recorded in the security audit trail. The ordinary
          sort/filter/paging parameters apply on top.

        Rows carry the party names, title, type, status, and the value fields — for PLAN goals
        the milestone tally (`milestonesDone`/`milestonesTotal`) instead of a value — never the
        description, summary, or milestone texts.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `managerName`, `subordinateName`, `title`, `type`, `status`,
          `targetValue`, `currentValue`, `createdAt`, `dueDate`, `lastModified`. Default sort is `createdAt`
          **descending** (newest goals first). `id` ascending is always appended as a
          deterministic tiebreaker. The value columns are null for PLAN goals, so mixed-type
          lists sort those rows together at one end (database NULL ordering).
        - Filters (all optional, all whitelisted):
          - `managerName` / `subordinateName` — case- and accent-insensitive substring match against the
            party's name.
          - `managerId` / `subordinateId` — exact party-id match (e.g. the per-manager
            drill-down combines `view=own` with `managerId`).
          - `title` — case- and accent-insensitive substring match against the goal title.
          - `type` / `status` — exact enum-name match.
          - `createdAt[gte]` / `lastModified[gte]` — inclusive epoch-millis lower bounds.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed, team, user], default: own }
          description: >-
            Which slice of goals to list — caller-relative, except the HR auditor
            view `user`.
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=managed` and `view=team` (else `400`). For `view=managed`,
            `true` widens the list from the caller's own goals to also include goals set by
            managers in their transitive management chain (their DRAFTs excluded). For
            `view=team`, `true` widens which managers count from the caller's direct reports
            to their whole transitive management chain.
        - name: managerName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the manager's name.
        - name: subordinateName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the subordinate's name.
        - name: managerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact manager-id match.
        - name: subordinateId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact subordinate-id match.
        - name: title
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the goal title.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [PLAN, NUMBER, PERCENTAGE] }
          description: Exact goal-type match.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
          description: Exact status match.
        - name: createdAt[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the creation moment, epoch milliseconds.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the last-modified moment, epoch milliseconds.
      responses:
        '200':
          description: A page of goals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [goals]
      operationId: createGoal
      summary: Set a new goal for a direct report
      description: |
        Creates a goal, always in **DRAFT** status. The **manager is always the author**: the
        caller becomes the goal's manager (never taken from the body), and the subordinate must
        be one of the caller's **direct reports** at creation time — there is no ADMIN
        create-on-behalf. A **deactivated** subordinate is rejected with `400`.

        The value fields are type-specific: `targetValue` is **required** for NUMBER and
        PERCENTAGE goals (0–100 for PERCENTAGE) and **must be absent** for PLAN goals, whose
        progress model is instead their ordered **milestones** — id-less entries here (`400`
        when an entry carries an id), each a non-blank description within 4000 characters, at
        most 100 of them, all starting not-done; the numeric types must send none. The current
        value starts **unset** (`currentValue` null — no recorded value) and is only set (via
        `PUT /goals/{id}/progress`) once the goal is ACTIVE. The **due date** is required and
        must not be earlier than the current date.

        Nobody is notified — a draft is private to the pair until activated. The creation is
        recorded in the goal's audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalCreateRequest'
      responses:
        '201':
          description: Created — the full goal document
          headers:
            Location:
              schema: { type: string }
              description: URL of the new goal resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, out of range, or not applicable to the goal type, an invalid milestone
            list — blank/oversized descriptions, more than 100 entries, entries carrying ids,
            or milestones on a non-PLAN goal — a due date that is missing, malformed, or in
            the past) or referenced user does not exist
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The subordinate is not a direct report of the caller
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [goals]
      operationId: getGoal
      summary: Fetch a goal
      description: |
        Returns the full goal document — parties, definition, value fields, status, and (once
        archived at least once) the summary. Readable by the goal's **manager**, its
        **subordinate**, and the **HR auditor** (audit-logged) at every status; a **manager in
        the subordinate's transitive management chain** (their manager, that manager's manager,
        and so on — over non-deleted teams) may read it only once it has left DRAFT
        (ACTIVE/ARCHIVED) — a draft stays private to the pair. Anything else — ADMIN included —
        is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [goals]
      operationId: updateGoalDefinition
      summary: Edit a draft goal's definition
      description: |
        Edits the goal's definition — title, description, type, target, milestones (PLAN), and
        due date (the due date is editable **only** here and at creation, i.e. only while
        DRAFT, and must not be earlier than the current date). **Manager-only**
        (the subordinate has read rights only; nobody else — ADMIN included — gets write
        access) and **DRAFT-only**: an ACTIVE or ARCHIVED goal's definition is immutable (`409`) — deactivate
        it first to edit. The parties, status, current value, milestone done flags, and summary
        are not settable here (status moves through the action endpoints, progress — the
        current value or the done flags — through `PUT /goals/{id}/progress`, the summary
        through the archive action).

        A PLAN goal's `milestones` is a **whole-list replace** in payload order: entries with
        an `id` keep that row (its done flag preserved; a changed description is an edit),
        stored rows missing from the payload are removed, id-less entries are added (starting
        not-done). An id not belonging to this goal, or sent twice, is `400`.

        Changing the type resets the value fields to **unset** (null — no recorded value; away
        from PLAN the milestones are deleted), discarding any previously recorded progress —
        the audit events explain the reset. Every changed aspect is recorded in the audit
        history; a no-op PUT records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalDefinitionUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, out of range, or not applicable to the goal type, an invalid milestone
            list — blank/oversized descriptions, more than 100 entries, duplicate or foreign
            ids, or milestones on a non-PLAN goal — a due date that is missing, malformed, or
            in the past)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The goal is not in DRAFT status — its definition is immutable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [goals]
      operationId: deleteGoal
      summary: Delete a draft goal
      description: |
        Soft-deletes a goal (the row is flagged, not physically removed, and disappears from
        reads/lists; its audit history is retained). **Manager-only** and **DRAFT-only** —
        ACTIVE and ARCHIVED goals are records and answer `400`; archive (or reopen) them through
        the transitions instead. Nobody is notified.
      responses:
        '204': { description: Deleted }
        '400':
          description: The goal is not in DRAFT status — only a draft goal may be deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [goals]
      operationId: updateGoalProgress
      summary: Update an active goal's progress
      description: |
        Updates the goal's progress — the only edit an **ACTIVE** goal accepts (any other
        status is `409`). Open to **both parties** — the manager and the subordinate (v2.8.0);
        anyone else is `403`. Only the field matching the goal's type may be set —
        `milestones` for a PLAN goal (the **complete** done-state: one entry per milestone,
        ids matching the goal's milestones exactly, else `400`; only actually-flipped flags
        count as changes), `currentValue` for NUMBER and PERCENTAGE (0–100 for PERCENTAGE);
        the mismatched field is `400` — and it is **optional** (v2.8.1): absent leaves the
        state untouched, but a state-less update must then carry a non-blank `comment` (else
        `400`). The optional `comment` (context of the update) is recorded on the history
        event, encrypted at rest; a non-blank comment with an unchanged state still records a
        `PROGRESS_COMMENTED` event. Any recorded update notifies the counterparty. The change
        is recorded in the audit history — one `MILESTONE_COMPLETED`/`MILESTONE_REOPENED`
        entry per toggled milestone (1-based positions), or one `PROGRESS_UPDATED` with
        from/to values (an empty `from` = no previous value); a true no-op (unchanged state,
        no comment) records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalProgressUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            The progress field does not match the goal's type or is out of range (PERCENTAGE
            is 0–100); a PLAN update's milestone ids do not match the goal's milestones
            exactly (missing, foreign, or duplicate ids); neither a state change field nor a
            comment was supplied; or the comment exceeds 4000 characters
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is neither the goal's manager nor its subordinate
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The goal is not ACTIVE — progress is only editable while it is
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: activateGoal
      summary: Activate a draft goal
      description: |
        Moves the goal `DRAFT → ACTIVE` (any other current status is `409`). **Manager-only.**
        The goal's **due date must not be in the past** (`400`) — a stale draft must be given a
        fresh due date (via `PUT /goals/{id}`) before it can be activated — and a **PLAN goal
        needs at least one milestone** (`400`; milestones are defined via `PUT /goals/{id}`).
        Once active, the goal becomes visible to the subordinate's wider management chain and
        its progress becomes editable via `PUT /goals/{id}/progress`. The subordinate is
        notified; the transition is recorded in the audit history.
      responses:
        '204': { description: Activated }
        '400':
          description: >-
            The goal's due date is in the past, or a PLAN goal has no milestones — update the
            draft before activating
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: deactivateGoal
      summary: Return an active goal to draft
      description: |
        Moves the goal `ACTIVE → DRAFT` (any other current status is `409`), making its
        definition editable again. **Manager-only.** Recorded progress — the current value or
        the milestone done flags — is kept (unless the type is later changed in the draft,
        which resets the value fields to unset and drops any milestones). The subordinate
        is notified; the transition is recorded in the audit history.
      responses:
        '204': { description: Returned to draft }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: archiveGoal
      summary: Archive an active goal
      description: |
        Moves the goal `ACTIVE → ARCHIVED` (any other current status is `409`). **Manager-only.**
        Archiving always records the body's **summary** (required, non-blank — the only moment
        the summary is settable). The current value is frozen as-is — update it via
        `PUT /goals/{id}/progress` *before* archiving. The subordinate is notified; the
        transition is recorded in the audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalArchiveRequest'
      responses:
        '204': { description: Archived }
        '400':
          description: The summary is missing, blank, or oversized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [goals]
      operationId: reopenGoal
      summary: Reopen an archived goal
      description: |
        Moves the goal `ARCHIVED → ACTIVE` (any other current status is `409`). **Manager-only.**
        The stored summary is kept as a record of the previous archiving and will be overwritten
        at the next archiving. The subordinate is notified; the transition is recorded in the audit
        history.
      responses:
        '204': { description: Reopened }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/GoalInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/goals/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [goals]
      operationId: listGoalEvents
      summary: List a goal's audit history
      description: |
        Returns the immutable audit trail for a goal — one entry per creation, changed
        definition aspect, milestone change (identified by 1-based position), progress update,
        status transition, and deletion — newest first (id
        descending as the same-instant tiebreaker). Each
        entry is structural: an event `type` plus a `params` map (enum names, numeric values,
        and positions — never title/description/summary/milestone text), with the acting user
        resolved to `userName`; no
        rendered string is stored (clients localize the description). Authorization matches the
        single-GET above: whoever may read the goal may read its history. Events are
        server-generated; there is no create/update/delete endpoint.
      responses:
        '200':
          description: The goal's events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/GoalNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis:
    get:
      tags: [team-kpis]
      operationId: listTeamKpis
      summary: List team KPIs for the caller
      description: |
        Lists team KPIs scoped by `view` — always relative to the caller, including ADMIN
        callers. A KPI belongs to a **team**; its manager is always the team's **current**
        manager (`teams.manager_id`, resolved at read time — never stored on the KPI), so a
        reassigned team's new manager takes over its KPIs.

        - `view=own` (the default): KPIs of the non-deleted teams the caller is currently a
          **member** of — excluding DRAFTs (a draft stays private to the manager until
          activated, matching the single-GET rule, so every listed row is openable).
        - `view=managed`: KPIs of the teams whose **current manager** the caller is, at every
          status — soft-deleted teams included (their `teamDeleted` flag is set), so a manager
          keeps the history of a disbanded team.

        There is deliberately no HR auditor list view (`view=user` on the goal/feedback/1:1
        lists is per-user; a team KPI is per-team) — the HR auditor instead has audit-logged
        access to every single GET. The `teamId` filter powers the per-team drill-down.

        Rows carry the team and manager names, title, type, status, and the value fields —
        never the description or summary.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `teamName`, `managerName`, `title`, `type`, `status`,
          `targetValue`, `currentValue`, `createdAt`, `lastModified`. Default sort is
          `createdAt` **descending** (newest KPIs first). `id` ascending is always appended as
          a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `teamName` — case- and accent-insensitive substring match against the team's name.
          - `teamId` — exact team-id match (the per-team drill-down).
          - `title` — case- and accent-insensitive substring match against the KPI title.
          - `type` / `status` — exact enum-name match.
          - `createdAt[gte]` / `lastModified[gte]` — inclusive epoch-millis lower bounds.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed], default: own }
          description: Which slice of team KPIs to list — always caller-relative.
        - name: teamName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the team's name.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact team-id match (the per-team drill-down).
        - name: title
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the KPI title.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [NUMBER, PERCENTAGE] }
          description: Exact KPI-type match.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, ACTIVE, ARCHIVED] }
          description: Exact status match.
        - name: createdAt[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the creation moment, epoch milliseconds.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the last-modified moment, epoch milliseconds.
      responses:
        '200':
          description: A page of team KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [team-kpis]
      operationId: createTeamKpi
      summary: Set a new KPI for a managed team
      description: |
        Creates a team KPI, always in **DRAFT** status. The author is always the team's
        **current manager**: the caller must be `teams.manager_id` of the (non-deleted)
        `teamId` at creation time — there is no ADMIN create-on-behalf.

        Unlike goals there is no PLAN type: `targetValue` is **always required** (finite;
        0–100 for PERCENTAGE). The KPI starts with no data points (`currentValue` `0.0`,
        `currentValueDate` null); data points become recordable (via the
        `/team-kpis/{id}/values` sub-resource) once the KPI is ACTIVE. There is no due date.

        Nobody is notified — a draft is private to the manager until activated. The creation
        is recorded in the KPI's audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiCreateRequest'
      responses:
        '201':
          description: Created — the full team-KPI document
          headers:
            Location:
              schema: { type: string }
              description: URL of the new team-KPI resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiResponse'
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, not finite, or out of range for PERCENTAGE) or referenced team does not
            exist
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not the team's current manager
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [team-kpis]
      operationId: getTeamKpi
      summary: Fetch a team KPI
      description: |
        Returns the full team-KPI document — team, its current manager, definition, value
        fields, status, and (once archived at least once) the summary. Readable by the team's
        **current manager** and the **HR auditor** (audit-logged) at every status; a current
        **team member**, or any **manager in the chain above the team's manager** (their
        manager, that manager's manager, and so on — over non-deleted teams), may read it only
        once it has left DRAFT (ACTIVE/ARCHIVED) — a draft stays private to the manager.
        Anything else — ADMIN included — is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [team-kpis]
      operationId: updateTeamKpiDefinition
      summary: Edit a draft team KPI's definition
      description: |
        Edits the KPI's definition — title, description, type, and target. **Current-manager-
        only** (members have read rights only; nobody else — ADMIN included — gets write
        access) and **DRAFT-only**: an ACTIVE or ARCHIVED KPI's definition is immutable (`409`)
        — deactivate it first to edit. The team, status, data points, and summary are not
        settable here (status moves through the action endpoints, the data points through the
        `/team-kpis/{id}/values` sub-resource, the summary through the archive action).

        Changing the type **wipes all collected data points** — a NUMBER series is meaningless
        against a PERCENTAGE target and vice versa — resetting `currentValue`/`currentValueDate`
        to `0.0`/null; the audit events explain the reset. Every changed aspect is recorded in
        the audit history; a no-op PUT records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiDefinitionUpdate'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            Validation error (blank or oversized title/description, a target value that is
            missing, not finite, or out of range for PERCENTAGE)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The KPI is not in DRAFT status — its definition is immutable
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [team-kpis]
      operationId: deleteTeamKpi
      summary: Delete a draft team KPI
      description: |
        Soft-deletes a team KPI (the row is flagged, not physically removed, and disappears
        from reads/lists; its audit history is retained). **Current-manager-only** and
        **DRAFT-only** — ACTIVE and ARCHIVED KPIs are records and answer `400`; archive (or
        reopen) them through the transitions instead. Nobody is notified.
      responses:
        '204': { description: Deleted }
        '400':
          description: The KPI is not in DRAFT status — only a draft team KPI may be deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/values:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [team-kpis]
      operationId: listTeamKpiValues
      summary: List a team KPI's data points
      description: |
        Returns the KPI's collected data points — one `{id, date, value}` entry per
        measurement, at most one per date, sorted by date **newest first**. Unpaged (the set is
        a hand-entered measurement series, intrinsically small). The view screen's KPI-data tab
        and its value-over-time graph both feed on this list. Authorization matches the
        single-GET: whoever may read the KPI may read its data points.
      responses:
        '200':
          description: The KPI's data points, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiValueList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [team-kpis]
      operationId: addTeamKpiValue
      summary: Record a data point for an active team KPI
      description: |
        Adds a data point — data points are only mutable while the KPI is **ACTIVE** (any other
        status is `409`). **Current-manager-only.** `value` is always required (finite; 0–100
        for PERCENTAGE), and `date` — the ISO `YYYY-MM-DD` date the value was measured — is
        required and must not be in the future (today is allowed). At most **one value per
        date**: a date that already has a data point is `409` — correct the existing point
        instead. The KPI's denormalized `currentValue`/`currentValueDate` are recomputed from
        the max-dated point in the same transaction, the addition mints a `VALUE_RECORDED`
        audit event (params `{date, value}`), and every current team member (except the acting
        manager) is notified with a link to the KPI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiValueWrite'
      responses:
        '201':
          description: Created — the new data point
          headers:
            Location:
              schema: { type: string }
              description: URL of the new data-point resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiValueResponse'
        '400':
          description: >-
            The value is missing, not finite, or out of range (PERCENTAGE is 0–100); or the
            date is missing, not a strict ISO YYYY-MM-DD, or in the future
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiValueConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/values/{valueId}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - name: valueId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 0 }
        description: Id of the data point (must belong to the addressed KPI, else 404).
    put:
      tags: [team-kpis]
      operationId: updateTeamKpiValue
      summary: Correct a data point of an active team KPI
      description: |
        Corrects a data point's date and/or value — only while the KPI is **ACTIVE** (any
        other status is `409`). **Current-manager-only.** The same value/date rules as adding
        apply; moving the point onto a date that already has another data point is `409`. The
        denormalized `currentValue`/`currentValueDate` are recomputed in the same transaction.
        A real change mints a `VALUE_CORRECTED` audit event (params
        `{fromDate, fromValue, toDate, toValue}` — always all four) and notifies every current
        team member (except the acting manager) with a link to the KPI; an exact no-op records
        nothing, notifies nobody, and still answers `204`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiValueWrite'
      responses:
        '204': { description: Corrected }
        '400':
          description: >-
            The value is missing, not finite, or out of range (PERCENTAGE is 0–100); or the
            date is missing, not a strict ISO YYYY-MM-DD, or in the future
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiValueConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [team-kpis]
      operationId: deleteTeamKpiValue
      summary: Remove a data point of an active team KPI
      description: |
        Removes a data point (hard delete — the `VALUE_REMOVED` audit event, params
        `{date, value}`, keeps the record) — only while the KPI is **ACTIVE** (any other
        status is `409`). **Current-manager-only.** The denormalized
        `currentValue`/`currentValueDate` are recomputed in the same transaction: removing the
        latest-dated point rolls the current value back to the next-latest (or `0.0`/null when
        none remain). Every current team member (except the acting manager) is notified with a
        link to the KPI.
      responses:
        '204': { description: Removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiValueConflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/activate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: activateTeamKpi
      summary: Activate a draft team KPI
      description: |
        Moves the KPI `DRAFT → ACTIVE` (any other current status is `409`).
        **Current-manager-only.** Once active, the KPI becomes visible to the team's members
        and the chain above its manager, and its data points become editable via the
        `/team-kpis/{id}/values` sub-resource. Every current team member (except the acting
        manager) is notified; the transition is recorded in the audit history.
      responses:
        '204': { description: Activated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/deactivate:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: deactivateTeamKpi
      summary: Return an active team KPI to draft
      description: |
        Moves the KPI `ACTIVE → DRAFT` (any other current status is `409`), making its
        definition editable again — and hiding it from members and the chain until
        re-activated. **Current-manager-only.** Collected data points are kept (unless the
        type is later changed in the draft, which wipes them). Every current team member
        (except the acting manager) is notified — without a link, since a draft is not
        readable by them; the transition is recorded in the audit history.
      responses:
        '204': { description: Returned to draft }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: archiveTeamKpi
      summary: Archive an active team KPI
      description: |
        Moves the KPI `ACTIVE → ARCHIVED` (any other current status is `409`).
        **Current-manager-only.** Archiving always records the body's **summary** (required,
        non-blank — the only moment the summary is settable). The data points are frozen
        as-is — correct them via the `/team-kpis/{id}/values` sub-resource *before* archiving.
        Every current team member (except the acting manager) is notified; the transition is
        recorded in the audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamKpiArchiveRequest'
      responses:
        '204': { description: Archived }
        '400':
          description: The summary is missing, blank, or oversized
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/reopen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [team-kpis]
      operationId: reopenTeamKpi
      summary: Reopen an archived team KPI
      description: |
        Moves the KPI `ARCHIVED → ACTIVE` (any other current status is `409`).
        **Current-manager-only.** The stored summary is kept as a record of the previous
        archiving and will be overwritten at the next archive. Every current team member
        (except the acting manager) is notified; the transition is recorded in the audit
        history.
      responses:
        '204': { description: Reopened }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TeamKpiInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/team-kpis/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [team-kpis]
      operationId: listTeamKpiEvents
      summary: List a team KPI's audit history
      description: |
        Returns the immutable audit trail for a team KPI — one entry per creation, changed
        definition aspect, data-point mutation (`VALUE_RECORDED` / `VALUE_CORRECTED` /
        `VALUE_REMOVED`), status transition, and deletion — newest first (id descending as the
        same-instant tiebreaker). Each entry is
        structural: an event `type` plus a `params` map (enum names, numeric values, and ISO
        dates — never title/description/summary text), with the acting user resolved to
        `userName`; no rendered string is stored (clients localize the description).
        Authorization matches the single-GET above: whoever may read the KPI may read its
        history. Events are server-generated; there is no create/update/delete endpoint.
      responses:
        '200':
          description: The team KPI's events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamKpiEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TeamKpiNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/review-periods:
    get:
      tags: [review-periods]
      operationId: listReviewPeriods
      summary: List the review-period timeline
      description: |
        Returns the whole global review-period timeline, oldest first — **unpaged** (the
        registry is intrinsically small and every period picker needs all of it; deliberately
        NOT a standard list endpoint, like `GET /dictionaries/{dictionary}`). Any authenticated
        caller may read it — managers pick a period when creating a performance review. Month
        bounds are inclusive ISO `YYYY-MM` strings.
      responses:
        '200':
          description: All review periods, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPeriodList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [review-periods]
      operationId: createReviewPeriod
      summary: Append a review period to the timeline
      description: |
        **ADMIN-only.** The timeline is **append-only and gapless**: when any period exists,
        the new one must start exactly the month after the latest period ends — anything else
        (a gap or an overlap) is `409`; the first period is free. `startMonth` must not be
        after `endMonth` (both inclusive ISO `YYYY-MM`, strictly zero-padded). Periods are
        immutable once created (there is no PUT). Recorded in the security audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewPeriodCreateRequest'
      responses:
        '201':
          description: Created — the new period
          headers:
            Location:
              schema: { type: string }
              description: URL of the new period resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPeriod'
        '400':
          description: Malformed month (not a zero-padded ISO YYYY-MM) or startMonth after endMonth
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The new period does not start the month after the latest existing period ends (the
            timeline permits no gaps and no overlaps)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/review-periods/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [review-periods]
      operationId: deleteReviewPeriod
      summary: Delete the latest review period
      description: |
        **ADMIN-only.** Hard-deletes a period (the deliberate exception to the soft-delete
        convention — a soft-deleted period would poison the timeline's no-gap rule). Only the
        **latest** period may be deleted, and only while **no performance review references
        it** (soft-deleted reviews count — their rows keep the reference); either violation is
        `409`. Recorded in the security audit trail.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The period is not the latest, or performance reviews reference it
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews:
    get:
      tags: [performance-reviews]
      operationId: listPerformanceReviews
      summary: List performance reviews for the caller
      description: |
        Lists performance reviews scoped by `view`. Except `view=user` (the HR auditor view),
        scoping is always relative to the caller, including ADMIN callers.

        - `view=own` (the default): reviews where the caller is the **subordinate** — but only
          **PUBLISHED** ones, mirroring the single-GET rule (a review in DRAFT or CALIBRATION
          is invisible to its subject).
        - `view=managed`: reviews where the caller is the **manager** (the author), at every
          status. With `includeIndirect=true`, additionally reviews authored **by managers in
          the caller's transitive management chain** — excluding their DRAFT reviews (a draft
          stays private to its author until submitted to calibration, matching the single-GET's
          chain rule; the caller's own DRAFTs are always listed).
        - `view=team`: reviews authored **by the caller's subordinates as managers** — the
          review's manager is one of the caller's **direct reports** (a member of a non-deleted
          team the caller manages) or, with `includeIndirect=true`, anyone in the caller's
          **transitive management chain**. DRAFT reviews are excluded — a draft stays private
          to its author, matching the single-GET's chain rule. A caller who manages no team
          gets an empty page. The narrower direct-only default is a list scope, not an
          authorization boundary: the single-GET grants any manager in the subordinate's chain
          read access to a non-DRAFT review.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view — every
          review the given user is a party to (manager or subordinate), at every status,
          DRAFTs included. HR usage is recorded in the security audit trail. The ordinary
          sort/filter/paging parameters apply on top.

        Rows carry the party names, the period (id + month bounds), status, and the four
        **numeric ratings** — never the summaries.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `managerName`, `subordinateName`, `periodStart` (the period's
          start month — ISO `YYYY-MM`, so lexicographic order is chronological), `status`,
          `createdAt`, `lastModified`. Default sort is `createdAt` **descending** (newest
          reviews first). `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `managerName` / `subordinateName` — case- and accent-insensitive substring match against the
            party's name.
          - `managerId` / `subordinateId` — exact party-id match.
          - `periodId` — exact period match (the per-period drill-down).
          - `status` — exact enum-name match.
          - `createdAt[gte]` / `lastModified[gte]` — inclusive epoch-millis lower bounds.

        Malformed query parameters (unknown view, unknown sort field, out-of-range page/pageSize)
        respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed, team, user], default: own }
          description: >-
            Which slice of reviews to list — caller-relative, except the HR auditor
            view `user`.
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Required with `view=user` (`400` when missing there, `400` with any other view):
            the user whose records the auditor view lists.
        - name: includeIndirect
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Only valid with `view=managed` and `view=team` (else `400`). For `view=managed`,
            `true` widens the list from the caller's own reviews to also include reviews
            authored by managers in their transitive management chain (their DRAFTs excluded).
            For `view=team`, `true` widens which managers count from the caller's direct
            reports to their whole transitive management chain.
        - name: managerName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the manager's name.
        - name: subordinateName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the subordinate's name.
        - name: managerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact manager-id match.
        - name: subordinateId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact subordinate-id match.
        - name: periodId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact review-period match.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [DRAFT, CALIBRATION, PUBLISHED] }
          description: Exact status match.
        - name: createdAt[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the creation moment, epoch milliseconds.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Lower bound (inclusive) on the last-modified moment, epoch milliseconds.
      responses:
        '200':
          description: A page of performance reviews
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReviewPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [performance-reviews]
      operationId: createPerformanceReview
      summary: Create a performance review for a direct report
      description: |
        Creates a performance review, always in **DRAFT** status. The **manager is always the
        author**: the caller becomes the review's manager (never taken from the body), and the
        subordinate must be one of the caller's **direct reports** at creation time — there is
        no ADMIN create-on-behalf. The stored manager stays the author even if the subordinate
        later moves teams (the goals model). A **deactivated** subordinate is rejected with `400`.

        The four category assessments (attitude, delivery, skills, overall) may be **partial**
        — a DRAFT is the manager's scratch space; each set rating must be on the 1–6 scale and
        each summary within bounds. Completeness (all four ratings + non-blank summaries) is
        required only to enter calibration (`POST …/submit`).

        The chosen period must have **started**: a review for a period whose start month is
        after the current month is rejected (`400`) — the currently-running period is fine.

        A subordinate has at most **one active review per period**, at any status: a duplicate
        is `409`, with the `ProblemDetail.instance` pointing at the existing review. A
        (draft-)deleted review frees the slot.

        Nobody is notified — a draft is private to its author until published. The creation is
        recorded in the review's audit history.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceReviewCreateRequest'
      responses:
        '201':
          description: Created — the full review document
          headers:
            Location:
              schema: { type: string }
              description: URL of the new review resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReviewResponse'
        '400':
          description: >-
            Validation error (a rating outside 1–6, an oversized summary, or a period that has
            not started yet) or referenced user or period does not exist
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The subordinate is not a direct report of the caller
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: >-
            The subordinate already has a review for this period (the `instance` field points
            at it)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [performance-reviews]
      operationId: getPerformanceReview
      summary: Fetch a performance review
      description: |
        Returns the full review document — parties, period, status, and the four category
        assessments (rating + summary each). Readable by the review's **manager** (the author)
        at every status and by the **HR auditor** (audit-logged) at every status; by the
        **subordinate** only once **PUBLISHED** (a review in DRAFT or CALIBRATION is invisible
        to them — `403`); and by a **manager in the subordinate's transitive management chain**
        (over non-deleted teams) once it has left DRAFT (CALIBRATION/PUBLISHED — calibration is
        exactly the phase upper managers join to compare ratings). Anything else — ADMIN
        included — is `403`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReviewResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [performance-reviews]
      operationId: updatePerformanceReview
      summary: Edit a review's assessments
      description: |
        Replaces the review's eight assessment values (the four categories' ratings and
        summaries). **Manager-only** (the subordinate has read rights only; nobody else — ADMIN
        included — gets write access). Accepted while **DRAFT or CALIBRATION**; a PUBLISHED
        review is read-only (`409`) — unpublish it first. In CALIBRATION the payload must stay
        **complete**: a value may change but never blank out (`400`). The parties, period, and
        status are not settable here (status moves through the action endpoints).

        Every changed aspect is recorded in the audit history (rating changes with their
        from/to numbers, summary changes as the bare fact — never the text); a no-op PUT
        records nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerformanceReviewUpdateRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: >-
            Validation error (a rating outside 1–6, an oversized summary, or — in CALIBRATION —
            a missing rating or blank summary)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The review is PUBLISHED — read-only until unpublished
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [performance-reviews]
      operationId: deletePerformanceReview
      summary: Delete a draft review
      description: |
        Soft-deletes a performance review (the row is flagged, not physically removed, and
        disappears from reads/lists; its audit history is retained). **Manager-only** and
        **DRAFT-only** — reviews past DRAFT are records and answer `400`; move them through the
        transitions instead. Deleting frees the (subordinate, period) slot for a new review.
        Nobody is notified.
      responses:
        '204': { description: Deleted }
        '400':
          description: The review is not in DRAFT status — only a draft review may be deleted
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [performance-reviews]
      operationId: submitPerformanceReview
      summary: Submit a draft review to calibration
      description: |
        Moves the review `DRAFT → CALIBRATION` (any other current status is `409`).
        **Manager-only.** The review must be **complete** — all four ratings set and all four
        summaries non-blank (`400`) — an incomplete draft cannot enter calibration. Once in
        calibration, the review becomes visible to the subordinate's wider management chain
        (not to the subordinate). Nobody is notified — the calibration phase is invisible to
        the subordinate; the transition is recorded in the audit history.
      responses:
        '204': { description: Submitted to calibration }
        '400':
          description: The review is incomplete — a rating is missing or a summary is blank
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceReviewInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews/{id}/revert:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [performance-reviews]
      operationId: revertPerformanceReview
      summary: Return a calibration review to draft
      description: |
        Moves the review `CALIBRATION → DRAFT` (any other current status is `409`), making it
        private to its author again (the wider management chain loses read access) and lifting
        the completeness requirement on edits. **Manager-only.** Recorded assessments are kept.
        Nobody is notified — neither state is visible to the subordinate; the transition is
        recorded in the audit history.
      responses:
        '204': { description: Returned to draft }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceReviewInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [performance-reviews]
      operationId: publishPerformanceReview
      summary: Publish a calibrated review
      description: |
        Moves the review `CALIBRATION → PUBLISHED` (any other current status is `409`).
        **Manager-only.** A published review is **read-only** and becomes visible to the
        subordinate. The subordinate is notified with a view link; the transition is recorded
        in the audit history.
      responses:
        '204': { description: Published }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceReviewInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews/{id}/unpublish:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [performance-reviews]
      operationId: unpublishPerformanceReview
      summary: Retract a published review to calibration
      description: |
        Moves the review `PUBLISHED → CALIBRATION` (any other current status is `409`).
        **Manager-only.** The review becomes editable again and disappears from the
        subordinate's reads and list. The subordinate is notified **without a link** (the
        review is no longer readable to them); the transition is recorded in the audit history.
      responses:
        '204': { description: Retracted to calibration }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PerformanceReviewInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/performance-reviews/{id}/events:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [performance-reviews]
      operationId: listPerformanceReviewEvents
      summary: List a performance review's audit history
      description: |
        Returns the immutable audit trail for a performance review — one entry per creation,
        changed assessment aspect (both rating and summary changes as the bare category-tagged
        fact), status transition, and deletion — newest first (id descending as the same-instant
        tiebreaker). Each entry is structural: an
        event `type` plus a `params` map (category/status enum names only — never summary text
        and never rating values, since all eight assessment fields are encrypted at rest while
        this trail is plaintext), with the acting user resolved to `userName`; no rendered
        string is stored (clients localize the description). Authorization matches the
        single-GET above:
        whoever may read the review may read its history. Events are server-generated; there is
        no create/update/delete endpoint.
      responses:
        '200':
          description: The review's events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceReviewEventList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/PerformanceReviewNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off:
    get:
      tags: [days-off]
      operationId: listDaysOff
      summary: List days-off requests for the caller
      description: |
        Lists days-off requests scoped by `view`. Except `view=user` (the HR auditor view),
        scoping is always relative to the caller, including ADMIN callers.

        - `view=own` (the default): the caller's own requests, at every status.
        - `view=managed`: requests of the caller's **direct reports** (members of non-deleted
          teams the caller manages), at every status — the same scope as the accept/reject
          right, so every listed row's actions are valid. Deliberately direct-only (no
          `includeIndirect`): a chain manager higher up still reads singles via the read
          guard — the list scope is not an authorization boundary. A caller who manages no
          team gets an empty page.
        - `view=user` (HR only, else `403`; requires `userId`): the auditor view — every
          request of the given user, at every status. HR usage is recorded in the security
          audit trail. The ordinary sort/filter/paging parameters apply on top.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `userName`, `startDate`, `endDate`, `type`, `status`, `days`,
          `createdAt`. Default sort is `startDate` **descending** (most recent periods first).
          `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `userName` — case- and accent-insensitive substring match against the owner's name.
          - `userId` — exact owner-id match; a pin-filter on `view=managed` (the drill-down
            precedent), required with `view=user`, rejected with `view=own` (`400` — own is
            caller-implied).
          - `type` / `status` — exact enum-name match.
          - `startDate[gte]` / `startDate[lte]` — inclusive ISO-date bounds on the start date.

        Malformed query parameters (unknown view, unknown sort field, out-of-range
        page/pageSize) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed, user], default: own }
          description: >-
            Which slice of requests to list — caller-relative, except the HR auditor
            view `user`.
        - name: userId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: |
            Exact owner-id match. Required with `view=user` (`400` when missing there); an
            ordinary pin-filter with `view=managed`; rejected with `view=own` (`400`).
        - name: userName
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the owner's name.
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [PAID, UNPAID] }
          description: Exact type match.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [REQUESTED, ACCEPTED, REJECTED, CANCELLED] }
          description: Exact status match.
        - name: startDate[gte]
          in: query
          required: false
          schema: { type: string, format: date }
          description: Lower bound (inclusive) on the start date, ISO YYYY-MM-DD.
        - name: startDate[lte]
          in: query
          required: false
          schema: { type: string, format: date }
          description: Upper bound (inclusive) on the start date, ISO YYYY-MM-DD.
      responses:
        '200':
          description: A page of days-off requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: view=user requested without the HR role
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [days-off]
      operationId: createDaysOff
      summary: Request days off
      description: |
        Creates a days-off request, always in **REQUESTED** status. The **owner is always the
        caller** — there is no create-on-behalf, not even for ADMIN.

        One request covers one **consecutive period** `[startDate, endDate]` (a single day is
        allowed; both bounds inclusive, strict zero-padded ISO `YYYY-MM-DD`). The period must
        not span calendar years (`400` — split a New-Year period into two requests).
        `startHalf`/`endHalf` mark the period's first/last day as **half days**; a single-day
        request expresses a half day via `startHalf` alone (`endHalf` there is `400`).

        The working-day **cost** is computed server-side: Saturdays, Sundays, and public
        holidays inside the period cost nothing; every other day costs 1 day (0.5 with the
        matching half toggle). The cost is computed against the holiday registry **at creation
        and frozen** — later registry edits never reprice existing requests. A period containing
        no working days at all is `400`.

        State rules (both `409`): the period must not **overlap** any of the owner's REQUESTED
        or ACCEPTED requests — the `ProblemDetail.instance` of the conflict points at the
        existing request; and a **PAID** request must fit the owner's paid-days budget — a
        REQUESTED request already reserves budget, and unused budget carries over between
        calendar years (see `GET /days-off/budgets`). UNPAID requests are unlimited.

        Each of the owner's **current direct managers** is notified; a user with no manager
        notifies nobody (and nobody can accept — a documented top-of-chain limitation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaysOffCreateRequest'
      responses:
        '201':
          description: Created — the full request document
          headers:
            Location:
              schema: { type: string }
              description: URL of the new days-off request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffResponse'
        '400':
          description: >-
            Validation error (malformed or misordered dates, a year-spanning period, endHalf
            on a single-day request, or a period containing no working days)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The period overlaps an existing REQUESTED/ACCEPTED request of the caller (the
            ProblemDetail `instance` points at it), or a PAID request exceeds the remaining
            paid-days budget of its year (or a later carry-over-funded year)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/calendar:
    get:
      tags: [days-off]
      operationId: getDaysOffCalendar
      summary: Month calendar of a team's days off
      description: |
        The month calendar payload for the SPA's leave-planner grid: every user in the scope
        (users without entries included — their rows still render), each carrying their
        **REQUESTED and ACCEPTED** days clipped to the month (the whole period is expanded,
        weekends included, so bars render continuously), plus the month's public holidays.
        REJECTED and CANCELLED requests never appear.

        Scopes (both caller-relative — any authenticated caller may use either; an empty
        scope is an empty user list):
        - `scope=member` (the default): everyone sharing a non-deleted team with the caller,
          the caller included (a team-less caller sees just themselves).
        - `scope=managed`: the caller's direct reports.

        Unpaged by construction — bounded by (scope users × ≤31 days). Users sort by name.
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: The calendar month, strict zero-padded ISO `YYYY-MM` (`400` otherwise).
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [member, managed], default: member }
          description: Whose days off to show — teammates (member) or direct reports (managed).
      responses:
        '200':
          description: The month's calendar payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffCalendarResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/budgets:
    get:
      tags: [days-off]
      operationId: listDaysOffBudgets
      summary: Paid-days budgets for a calendar year
      description: |
        One budget row per user for the given calendar year: the configured **allowance**
        (null = not configured = zero budget), the **carriedOver** days from previous years,
        the year's **reserved** (REQUESTED) and **used** (ACCEPTED) paid days, and the
        **remaining** balance (`carriedOver + allowance − reserved − used`, may be negative
        after a retroactive allowance cut).

        Carry-over is automatic: unused budget in one calendar year transfers to the next.
        The accumulation is anchored at the year of the user's earliest REQUESTED/ACCEPTED
        PAID request (the allowance never phantom-accumulates over empty historical years),
        and the CURRENT allowance value applies to every year — an admin's allowance change
        recomputes history (documented behavior). REJECTED and CANCELLED requests never count.

        Views (both caller-relative): `view=own` (the default) — the caller's single row;
        `view=managed` — one row per **direct report** (the manager's budget overview; empty
        for a caller who manages no team). Rows sort by name.
      parameters:
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [own, managed], default: own }
          description: Whose budgets — the caller's own or their direct reports'.
        - name: year
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100 }
          description: The calendar year; defaults to the server's current year.
      responses:
        '200':
          description: The budget rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffBudgetList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/corrections:
    get:
      tags: [days-off]
      operationId: listDaysOffCorrections
      summary: List a user's paid-days budget corrections
      description: |
        The active budget corrections of one user, newest year (then newest row) first —
        **unpaged** (corrections are intrinsically few). Readable by the **subordinate
        themselves**, the **HR auditor** (audit-logged), and any **manager in the
        subordinate's transitive management chain** (which includes every current direct
        manager). Teammates never qualify — they don't see each other's budgets at all —
        and ADMIN gets nothing special.
      parameters:
        - name: userId
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: Whose corrections to list (`400` when missing).
        - name: year
          in: query
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100 }
          description: Optional exact budget-year filter.
      responses:
        '200':
          description: The corrections, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffCorrectionList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the user, a manager in their chain, or HR
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [days-off]
      operationId: createDaysOffCorrection
      summary: Add a paid-days budget correction
      description: |
        Adds a ± adjustment (whole or half days) to a subordinate's paid-days budget for a
        chosen calendar year, with a mandatory reasoning comment. **No approval workflow** —
        the correction takes effect immediately and enters the carry-over math attributed to
        its year (an earlier year's correction flows forward automatically). Only a **current
        direct manager** of the subordinate may create one; the author is recorded
        (display-only — edit rights follow the current direct managers). A SUBTRACT may push
        a year's balance negative (the deficit carries forward — the allowance-cut
        precedent); only *request creation* is budget-gated. The subordinate is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaysOffCorrectionWrite'
      responses:
        '201':
          description: Created — the correction with its resolved author
          headers:
            Location:
              schema: { type: string }
              description: URL of the new correction resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffCorrection'
        '400':
          description: Validation error (year out of range, days not a positive 0.5-step, blank or oversized comment)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DaysOffNotDirectManager' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/corrections/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    put:
      tags: [days-off]
      operationId: updateDaysOffCorrection
      summary: Edit a paid-days budget correction
      description: |
        Replaces a correction's year, amount, and comment. The **target user is immutable**
        (the payload's `userId` is ignored). Only a **current direct manager** of the
        correction's subordinate may edit — regardless of who authored it. Edits notify
        nobody (the budget numbers are live).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DaysOffCorrectionWrite'
      responses:
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DaysOffNotDirectManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [days-off]
      operationId: deleteDaysOffCorrection
      summary: Delete a paid-days budget correction
      description: |
        Soft-deletes a correction (it drops out of the list and the budget math; the row is
        retained). Only a **current direct manager** of the correction's subordinate may
        delete. Notifies nobody.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DaysOffNotDirectManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [days-off]
      operationId: getDaysOff
      summary: Fetch a days-off request
      description: |
        Returns the full request document. Readable by the **owner** and the **HR auditor**
        (audit-logged) at every status; by any **manager in the owner's transitive management
        chain** at every status; and by a **teammate** (someone sharing a non-deleted team
        with the owner) only while the request is **REQUESTED or ACCEPTED** — exactly what the
        team calendar shows, so a REJECTED or CANCELLED request stays private to the owner,
        their chain, and HR. Anyone else gets `403`. ADMIN gets nothing special.
      responses:
        '200':
          description: The days-off request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaysOffResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DaysOffNotReadable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/{id}/accept:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [days-off]
      operationId: acceptDaysOff
      summary: Accept a days-off request
      description: |
        Accepts a **REQUESTED** request (any other status is `409`). Only a **current direct
        manager** of the owner may accept — never the owner, never a chain manager higher up,
        and ADMIN gets nothing special. Stamps the resolving manager on the record and
        notifies the owner.
      responses:
        '204': { description: Accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DaysOffNotDirectManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DaysOffInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [days-off]
      operationId: rejectDaysOff
      summary: Reject a days-off request
      description: |
        Rejects a **REQUESTED** request (any other status is `409`; REJECTED is terminal).
        Only a **current direct manager** of the owner may reject — the same rule as accept.
        Stamps the resolving manager on the record and notifies the owner.
      responses:
        '204': { description: Rejected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/DaysOffNotDirectManager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DaysOffInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/days-off/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [days-off]
      operationId: cancelDaysOff
      summary: Cancel a days-off request
      description: |
        Cancels the caller's own request (CANCELLED is terminal; only the **owner** may
        cancel). Valid from **REQUESTED** anytime, and from **ACCEPTED** only strictly before
        the request's start date — once the period has started (or on its first day) an
        accepted request is a record and can no longer be withdrawn (`409`). Frees the
        reserved paid budget. Cancelling an accepted request notifies the manager who accepted
        it; cancelling a pending one notifies all current direct managers.
      responses:
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not the request's owner
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/DaysOffInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/public-holidays:
    get:
      tags: [public-holidays]
      operationId: listPublicHolidays
      summary: List the public-holiday registry
      description: |
        Returns the whole global public-holiday registry, oldest date first — **unpaged**
        (the review-periods shape: the registry is intrinsically small, and the days-off
        create form's cost preview needs all of it). Any authenticated caller may read it.
        On these dates everyone is off and no paid budget is deducted; days-off request costs
        are frozen at creation, so registry edits never reprice existing requests.
      responses:
        '200':
          description: All public holidays, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHolidayList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [public-holidays]
      operationId: createPublicHoliday
      summary: Add a public holiday
      description: |
        **ADMIN-only.** Adds a holiday (strict zero-padded ISO `YYYY-MM-DD` date + a
        non-blank name of at most 100 characters). At most one holiday per date — a duplicate
        date is `409` (the DB's unique index; no pre-check by design). Recorded in the
        security audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicHolidayCreateRequest'
      responses:
        '201':
          description: Created — the new holiday
          headers:
            Location:
              schema: { type: string }
              description: URL of the new holiday resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicHoliday'
        '400':
          description: Malformed date (not a zero-padded ISO YYYY-MM-DD) or blank/oversized name
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A holiday already exists on this date
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/public-holidays/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    delete:
      tags: [public-holidays]
      operationId: deletePublicHoliday
      summary: Delete a public holiday
      description: |
        **ADMIN-only.** Hard-deletes a holiday (the registry exception to the soft-delete
        convention — nothing references a holiday by FK, and existing days-off request costs
        stay frozen, so deletion never reprices history). Recorded in the security audit
        trail.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: List templates
      description: |
        Lists templates. Any authenticated user may read.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`. Default sort is `id` ascending. `id` ascending is
          always appended as a deterministic tiebreaker.
        - Filter (optional, whitelisted):
          - `name` — case- and accent-insensitive substring match against the template name.
        - `content` is returned as `contentPreview`, capped at 200 characters; it is neither
          sortable nor filterable.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize) respond
        with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the template name.
      responses:
        '200':
          description: A page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [templates]
      operationId: createTemplate
      summary: Create a template
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new template resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400':
          description: Validation error (e.g. blank name)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '409':
          description: A template with the same name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/templates/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [templates]
      operationId: getTemplate
      summary: Fetch a template
      description: Any authenticated user may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [templates]
      operationId: replaceTemplate
      summary: Replace a template
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Validation error (e.g. blank name)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A template with the same name already exists
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [templates]
      operationId: deleteTemplate
      summary: Delete a template
      description: ADMIN only.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles:
    get:
      tags: [pulse-surveys]
      operationId: listPulseCycles
      summary: List pulse cycles
      description: |
        Any authenticated user with PULSE_SURVEYS enabled. Unpaged registry (newest first) —
        a cadence of weeks caps the volume. The `rotatingQuestionEn`/`rotatingQuestionPl`
        pair is null for non-admins until
        the cycle is OPEN or CLOSED (an unopened cycle's question stays unspoiled; a cancelled
        one reveals nothing); the participation counts are ADMIN-only enrichment.
      responses:
        '200':
          description: All cycles, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseCycleList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [pulse-surveys]
      operationId: schedulePulseCycle
      summary: Schedule a pulse cycle
      description: |
        **ADMIN only.** Creates a cycle at SCHEDULED, picks + snapshots the rotating question
        (least-used active `pulse-rotating-questions` entry, random among ties), and notifies
        every currently eligible user (no survey link yet). The planned dates are advisory —
        opening and closing stay manual. `409` when a SCHEDULED/OPEN cycle already exists
        (at most one non-terminal cycle at a time) or the question bank has no active entries.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulseCycleCreateRequest' }
      responses:
        '201':
          description: Scheduled; Location points at the new cycle
          headers:
            Location:
              schema: { type: string }
              description: URL of the created cycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseCycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [pulse-surveys]
      operationId: getPulseCycle
      summary: Read one pulse cycle
      description: >-
        Any authenticated user with PULSE_SURVEYS enabled; the same rotating-question and
        counts visibility rules as the list.
      responses:
        '200':
          description: The cycle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseCycle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [pulse-surveys]
      operationId: updatePulseCycle
      summary: Edit a cycle's planned dates
      description: |
        **ADMIN only.** SCHEDULED: both dates editable. OPEN: only the close date may change
        ("extend") — the payload must carry the unchanged open date back, else `400`.
        CLOSED/CANCELLED: `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulseCycleUpdateRequest' }
      responses:
        '204': { description: Dates updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/open:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [pulse-surveys]
      operationId: openPulseCycle
      summary: Open a scheduled cycle
      description: |
        **ADMIN only.** SCHEDULED → OPEN (any other status is `409`). Snapshots eligibility
        (active, not deactivated, PULSE_SURVEYS enabled) into the participant set — later user
        churn never changes this cycle — and notifies every participant with the survey link.
      responses:
        '204': { description: Opened }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/close:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [pulse-surveys]
      operationId: closePulseCycle
      summary: Close an open cycle
      description: |
        **ADMIN only.** OPEN → CLOSED (any other status is `409`). Submissions stop, results
        become available under their access rules, and every RESPONDENT is notified.
      responses:
        '204': { description: Closed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [pulse-surveys]
      operationId: cancelPulseCycle
      summary: Cancel a cycle
      description: |
        **ADMIN only.** Any non-CANCELLED status → CANCELLED (`409` when already cancelled).
        Cancelling a CLOSED cycle retracts its results; stored responses are kept for audit
        in every case. Participants are notified only when cancelling an OPEN cycle.
      responses:
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseInvalidTransition' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/participation:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [pulse-surveys]
      operationId: getPulseCycleParticipation
      summary: Read a cycle's participation counts
      description: |
        **ADMIN only**, and counts only — enough to decide close/extend/cancel, never team
        aggregates, comments, or per-user status (the narrowed-ADMIN rule). A SCHEDULED
        cycle reads as zeros.
      responses:
        '200':
          description: The counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseParticipationCounts' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/participation-status:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [pulse-surveys]
      operationId: getPulseParticipationStatus
      summary: Read per-person participation status (managers)
      description: |
        The manager monitoring view: for every team in the caller's monitored tree (teams
        they manage + everything below; HR: the whole org, audit-logged), the cycle's
        participants with a bare submitted yes/no — never any answer content. Works while
        OPEN and after CLOSE (`409` for SCHEDULED/CANCELLED). Requires no own participation;
        non-managers simply receive an empty team list.
      responses:
        '200':
          description: Participation per monitored team
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseParticipationStatusResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/my-response:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [pulse-surveys]
      operationId: getMyPulseResponse
      summary: Read the caller's own saved answers
      description: |
        The edit form's prefill — the ONLY endpoint that ever returns individual answers, and
        only the caller's own, and only while the cycle is OPEN (`409` otherwise, closed
        included: saved answers are never served again once a cycle closes). `403` when the
        caller is not a participant; `404` before the first submission.
      responses:
        '200':
          description: The caller's saved answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseMyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseNotOpen' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [pulse-surveys]
      operationId: submitMyPulseResponse
      summary: Submit or edit the caller's survey
      description: |
        Upsert while the cycle is OPEN (`409` otherwise): the first PUT submits, later PUTs
        fully replace — editable until the admin closes the cycle. `403` when the caller is
        not a participant of the cycle. All six scored answers are required; the comment is
        optional (blank = absent, max 1000 characters).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulseResponseSubmitRequest' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseNotOpen' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/results:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/PulseTeamId'
      - $ref: '#/components/parameters/PulseMode'
    get:
      tags: [pulse-surveys]
      operationId: getPulseTeamResults
      summary: Read one team's aggregated results for a closed cycle
      description: |
        Anonymous team-scope aggregates: eNPS + segment percentages, per-driver-question
        mean/favorable/unfavorable, response rate, and deltas vs the immediately preceding
        non-cancelled closed cycle (rotating-question deltas only when the same question was
        asked). `409` unless the cycle is CLOSED — uniform for every caller, HR included
        (results never leak while OPEN and never exist for CANCELLED). Access: HR org-wide
        (audit-logged), otherwise the caller must have RESPONDED in this cycle (the per-cycle
        fill gate — no role exemption, ADMIN included) and the team must be in their visible
        tree (member-of + managed + below). Fewer than 3 responses in the scope →
        `insufficientResponses: true` with all aggregates null (k-anonymity), not an error.
      responses:
        '200':
          description: The team's results block (or the withheld marker)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseTeamResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseNotClosed' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/cycles/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
      - $ref: '#/components/parameters/PulseTeamId'
      - $ref: '#/components/parameters/PulseMode'
    get:
      tags: [pulse-surveys]
      operationId: getPulseComments
      summary: Read a team scope's anonymized comments (managers)
      description: |
        The written answers for the scope, author-free and shuffled per request. Managers
        only (the team must be in the caller's MONITORED tree — managed + below; HR org-wide,
        audit-logged); plain members never read comments; no own-participation requirement.
        `409` unless CLOSED. Fewer than 3 responses in the scope → withheld
        (`insufficientResponses: true`, empty items).
      responses:
        '200':
          description: The anonymized comments (or the withheld marker)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseCommentsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/PulseNotClosed' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/trend:
    parameters:
      - $ref: '#/components/parameters/PulseTeamId'
      - $ref: '#/components/parameters/PulseMode'
    get:
      tags: [pulse-surveys]
      operationId: getPulseTrend
      summary: Read a team's eNPS trend across closed cycles
      description: |
        One point per non-cancelled CLOSED cycle, oldest first. Team access as for results
        (HR org-wide, audited; otherwise the caller's visible tree). The per-cycle fill gate
        applies POINT-WISE for non-HR callers: a cycle the caller sat out yields
        `NOT_A_RESPONDENT` (no numbers at all); a scope under 3 responses yields
        `NOT_ENOUGH_RESPONSES` (counts shown, eNPS withheld).
      responses:
        '200':
          description: The trend series
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseTrendResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/visible-teams:
    get:
      tags: [pulse-surveys]
      operationId: getPulseVisibleTeams
      summary: List the teams the caller's pulse views may target
      description: |
        Backs the SPA's team pickers (the team tree is derived server-side only):
        `resultsTeams` = teams the caller is a member of + teams they manage + everything
        below either; `monitoredTeams` = managed + below (empty for non-managers). HR gets
        every team in both.
      responses:
        '200':
          description: The two team scopes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseVisibleTeams' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/pulse-surveys/settings:
    get:
      tags: [pulse-surveys]
      operationId: getPulseSettings
      summary: Read the pulse settings
      description: >-
        **ADMIN only** (reads included — the values exist solely to prefill the admin
        scheduling form). Advisory only: the server never schedules, opens, or closes
        anything on its own.
      responses:
        '200':
          description: The settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PulseSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [pulse-surveys]
      operationId: updatePulseSettings
      summary: Update the pulse settings
      description: '**ADMIN only.** cadenceWeeks 1-52, openDays 1-90; audited with deltas.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PulseSettings' }
      responses:
        '204': { description: Saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/dictionaries/{dictionary}:
    parameters:
      - name: dictionary
        in: path
        required: true
        schema:
          type: string
          enum: [career-paths, career-specializations, seniority-levels, pulse-rotating-questions]
        description: The dictionary's URL slug. Unknown slugs answer 404.
    get:
      tags: [dictionaries]
      operationId: getDictionary
      summary: List a dictionary's entries
      description: |
        Any authenticated user may read. Unpaged — dictionaries are intrinsically small
        (at most 200 entries). Entries come in the admin-curated order (position ascending,
        `id` as deterministic tiebreaker); soft-deleted entries are never returned.
      responses:
        '200':
          description: The dictionary's active entries, in order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [dictionaries]
      operationId: replaceDictionary
      summary: Replace a dictionary's entries
      description: |
        Whole-document replace, ADMIN only (the guard runs before slug resolution, so a
        non-admin gets a uniform 403 whether or not the slug exists). Reconciliation: an
        item carrying an `id` renames that existing active entry in place (the id is stable
        across renames); an item without an `id` is inserted; active entries missing from
        the payload are soft-deleted — never physically removed. A soft-deleted entry's id
        can never be resubmitted; re-adding the same value creates a new entry. Positions
        are rewritten from payload order. An empty `items` array is allowed and soft-deletes
        every entry.

        Values are trimmed before storage and comparison. Blank or oversized values,
        duplicate values within the payload (case-sensitive), duplicated or unknown /
        soft-deleted entry ids, and more than 200 items are 400. A clash with another
        active entry's value — e.g. swapping two values in one save, which trips the
        per-statement unique index — is 409; work around a swap with a two-save rename
        through a temporary value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DictionaryUpdateRequest'
      responses:
        '204': { description: Replaced }
        '400':
          description: Validation error (blank/oversized/duplicate value, bad entry id, too many items)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A value clashes with another active entry (e.g. a one-save value swap)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/alerts:
    get:
      tags: [alerts]
      operationId: listAlerts
      summary: List alerts (management view)
      description: |
        Lists all alerts, including inactive and out-of-window ones. ADMIN only — what
        non-admin users see flows through `GET /api/v1/alerts/visible`.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `title`, `startsAt`, `endsAt`. Default sort is `id` ascending.
          `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (optional, whitelisted):
          - `title` — case- and accent-insensitive substring match against the alert title.
          - `isActive` — strict boolean equality (`true`/`false`).

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, non-boolean
        `isActive`) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: title
          in: query
          required: false
          schema: { type: string }
          description: Case- and accent-insensitive substring match against the alert title.
        - name: isActive
          in: query
          required: false
          schema: { type: boolean }
          description: Strict boolean equality filter on the active flag.
      responses:
        '200':
          description: A page of alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [alerts]
      operationId: createAlert
      summary: Create an alert
      description: |
        ADMIN only. `startsAt`/`endsAt` are epoch milliseconds; when both are set,
        `startsAt` must be strictly before `endsAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new alert resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400':
          description: Validation error (blank title/content, start not before end)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/alerts/visible:
    get:
      tags: [alerts]
      operationId: listVisibleAlerts
      summary: List the currently visible alerts
      description: |
        The alerts every user currently sees as banners. Any authenticated user may call.
        Visibility is evaluated server-side against server time: the alert is active, and the
        current moment lies inside its optional `[startsAt, endsAt]` window (both bounds
        inclusive; an unset bound is unbounded). Unpaged — the set of concurrently visible
        alerts is intrinsically tiny. Ordered by `id` ascending.
      responses:
        '200':
          description: The currently visible alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisibleAlertList'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [alerts]
      operationId: getAlert
      summary: Fetch an alert
      description: ADMIN only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    put:
      tags: [alerts]
      operationId: replaceAlert
      summary: Replace an alert
      description: ADMIN only. All fields are editable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRequest'
      responses:
        '204': { description: Updated }
        '400':
          description: Validation error (blank title/content, start not before end)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [alerts]
      operationId: deleteAlert
      summary: Delete an alert
      description: ADMIN only.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not ADMIN
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: List the caller's notifications
      description: |
        Lists notifications addressed to the calling user (`recipientId` = caller). The list is
        always scoped to the caller, including for ADMIN — there is no cross-user view.

        Notifications are generated as a side-effect of other activities; there is no create
        endpoint.

        Notifications whose type belongs to one of the caller's admin-disabled features
        (feature flags) are excluded from the rows AND from `total` while the flag is off —
        they reappear (still unseen) when the feature is re-enabled. Minting is never
        suppressed.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `timestamp`. Default sort is `timestamp` descending (newest
          first). `id` ascending is always appended as a deterministic tiebreaker.
        - Filter (optional, whitelisted):
          - `wasSeen` — `true`/`false`; restricts to seen / unseen notifications.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, non-boolean
        `wasSeen`) respond with `400` and a `ProblemDetail` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: wasSeen
          in: query
          required: false
          schema: { type: boolean }
          description: Restrict to seen (`true`) or unseen (`false`) notifications.
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [notifications]
      operationId: getNotification
      summary: Fetch a notification
      description: Recipient-only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [notifications]
      operationId: deleteNotification
      summary: Delete a notification
      description: Recipient-only.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationSeen
      summary: Mark a notification as seen
      description: |
        Sets `wasSeen` to `true`. Idempotent. Recipient-only.
      responses:
        '204': { description: Marked as seen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{id}/unseen:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [notifications]
      operationId: markNotificationUnseen
      summary: Mark a notification as unseen
      description: |
        Sets `wasSeen` to `false`. Idempotent. Recipient-only.
      responses:
        '204': { description: Marked as unseen }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Caller is not the recipient
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/seen-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsSeen
      summary: Mark all of the caller's notifications as seen
      description: |
        Sets `wasSeen` to `true` for every one of the authenticated caller's still-unseen
        notifications, in a single request. Idempotent. Intrinsically scoped to the caller's own
        notifications (no `{id}`, no recipient guard — like every notification endpoint,
        recipient-only).
        Deliberately asymmetric: there is no `unseen-all` counterpart — un-seeing is a
        per-notification action (`POST /notifications/{id}/unseen`).
      responses:
        '204': { description: All of the caller's notifications marked as seen }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      # int32: ids are 32-bit server-side; a non-numeric or out-of-range id is a 400.
      schema: { type: integer, format: int32, minimum: 0 }
    UserIdInPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-lastModified,id`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.
    PulseTeamId:
      name: teamId
      in: query
      required: true
      schema: { type: integer, format: int32, minimum: 0 }
      description: The team the pulse scope is built from. Unknown/deleted teams answer 404.
    PulseMode:
      name: mode
      in: query
      required: false
      schema: { type: string, enum: [direct, subtree], default: direct }
      description: >-
        Aggregation scope: `direct` = the team's current members only; `subtree` = members
        plus every transitive subordinate of a member (the full report tree below the team).

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Missing or invalid token
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Caller is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: Conflict with an existing resource
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >-
        Throttled — either the per-IP rate-limit bucket is exhausted (generic detail) or, on
        /login, the per-account lockout is active (account-specific detail). Both carry a
        ProblemDetail body.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InternalServerError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PulseInvalidTransition:
      description: >-
        The action is not allowed from the cycle's current status (the machine is
        SCHEDULED -> OPEN -> CLOSED, CANCELLED from any of the three)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PulseNotOpen:
      description: >-
        The cycle is not OPEN — submissions and own-answer reads exist only while a cycle
        is open (a closed cycle's answers are never served again)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PulseNotClosed:
      description: >-
        The cycle is not CLOSED — results and comments exist only for closed cycles,
        uniformly for every caller (never while OPEN, never for CANCELLED)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    FeedbackNotProvider:
      description: Caller is not the feedback's provider
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    InvalidTransition:
      description: The action is not allowed from the feedback's current status
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    OneOnOneNotReadable:
      description: >-
        Caller is neither a party to the 1:1 meeting, nor the HR auditor, nor a manager in the
        subordinate's management chain
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    OneOnOneNotManager:
      description: Caller is not the meeting's manager (the subordinate has read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    GoalNotReadable:
      description: >-
        Caller is neither a party to the goal, nor the HR auditor, nor a manager in the subordinate's
        management chain — or the goal is still a DRAFT, which the wider chain may not see
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    GoalNotManager:
      description: Caller is not the goal's manager (the subordinate has read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    GoalInvalidTransition:
      description: >-
        The action is not allowed from the goal's current status (the machine is
        DRAFT ↔ ACTIVE ↔ ARCHIVED, never skipping ACTIVE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiNotReadable:
      description: >-
        Caller is neither the team's current manager, nor the HR auditor, nor a current team
        member, nor a manager in the chain above the team's manager — or the KPI is still a
        DRAFT, which only the manager (and HR) may see
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiNotManager:
      description: Caller is not the team's current manager (members have read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiInvalidTransition:
      description: >-
        The action is not allowed from the KPI's current status (the machine is
        DRAFT ↔ ACTIVE ↔ ARCHIVED, never skipping ACTIVE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TeamKpiValueConflict:
      description: >-
        The KPI is not ACTIVE (data points are only mutable while it is), or the target date
        already has a data point (at most one value per date — correct the existing point
        instead)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PerformanceReviewNotReadable:
      description: >-
        Caller is neither the review's manager, nor the HR auditor, nor — once the review has
        left DRAFT — its subordinate (PUBLISHED only) or a manager in the subordinate's
        management chain (CALIBRATION/PUBLISHED); a DRAFT is private to its author (and HR)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PerformanceReviewNotManager:
      description: Caller is not the review's manager (the subordinate has read rights only)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    PerformanceReviewInvalidTransition:
      description: >-
        The action is not allowed from the review's current status (the machine is
        DRAFT ↔ CALIBRATION ↔ PUBLISHED, never skipping CALIBRATION)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    DaysOffNotReadable:
      description: >-
        Caller may not read this days-off request (not the owner, HR, a manager in the
        owner's chain, or — for a REQUESTED/ACCEPTED request — a teammate)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    DaysOffNotDirectManager:
      description: Caller is not a current direct manager of the request's owner
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    DaysOffInvalidTransition:
      description: >-
        The action is not allowed from the request's current status (accept/reject need
        REQUESTED; cancel needs REQUESTED, or ACCEPTED strictly before the start date)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    LoginResponse:
      type: object
      required: [token, expiresAt, refreshToken, refreshExpiresAt, userId, roles, disabledFeatures]
      properties:
        token:
          type: string
          description: "Short-lived access token; send as the `Authorization: Bearer` value."
        expiresAt:
          type: integer
          format: int64
          description: Access-token expiry as Unix epoch milliseconds.
        refreshToken:
          type: string
          description: Longer-lived token; POST to /api/v1/refresh to obtain a fresh pair.
        refreshExpiresAt:
          type: integer
          format: int64
          description: Refresh-token expiry as Unix epoch milliseconds.
        userId: { type: integer, format: int64, minimum: 0 }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: Additional roles of the authenticated user — empty for a regular user.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: >-
            The authenticated user's admin-disabled features — empty for full access.

    MfaChallengeResponse:
      type: object
      required: [mfaRequired, challengeId, expiresAt]
      properties:
        mfaRequired:
          type: boolean
          description: Always true — the discriminator against LoginResponse in the login 200.
        challengeId:
          type: string
          description: Opaque single-use challenge id; send it back with the emailed code.
        expiresAt:
          type: integer
          format: int64
          description: Challenge (and code) expiry as Unix epoch milliseconds.

    MfaVerifyRequest:
      type: object
      required: [challengeId, code]
      properties:
        challengeId: { type: string }
        code:
          type: string
          description: The 6-digit code from the sign-in email.

    Feature:
      type: string
      enum: [DAYS_OFF, FEEDBACKS, GOALS, MFA, ONE_ON_ONES, PERFORMANCE_REVIEWS, PULSE_SURVEYS, TEAM_KPIS]
      description: >-
        A per-user-toggleable feature area (feature flags). Storage models the DISABLED
        set — absent = enabled, so every user defaults to full access. MFA is the one
        inverted-default value: every user starts with it DISABLED (opt-in email MFA at
        login; it gates the login flow, not any feature routes).

    UserFeaturesUpdateRequest:
      type: object
      required: [disabledFeatures]
      properties:
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: >-
            The complete new DISABLED set (wholesale replace) — an empty array re-enables
            everything. An unknown feature name is rejected with 400.

    UserEmailNotificationsUpdateRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >-
            True = mirror every in-app notification to the user's email address (the
            default); false = in-app only.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: The refresh token previously issued by /login or /refresh.

    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: |
            Optional. When present, its refresh token is also revoked so an explicit
            logout kills both tokens (the access token is revoked from the bearer).

    UserImportRequest:
      type: object
      required: [csv]
      properties:
        csv:
          type: string
          description: Raw CSV text, `name,email` per line.
        sendEmails:
          type: boolean
          default: false
          description: Email each newly created user their generated password.

    UserImportRow:
      type: object
      required: [line, status]
      properties:
        line: { type: integer, description: 1-based line number in the uploaded file. }
        name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status:
          type: string
          enum: [CREATED, DUPLICATE, PARSE_ERROR, EMAIL_FAILED, ERROR]
        message: { type: string, nullable: true }
        password:
          type: string
          nullable: true
          description: The generated password (CREATED / EMAIL_FAILED rows only) — shown once.

    UserImportResponse:
      type: object
      required: [rows, created, duplicates, errors]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/UserImportRow' }
        created: { type: integer, description: CREATED + EMAIL_FAILED rows. }
        duplicates: { type: integer }
        errors: { type: integer, description: PARSE_ERROR + ERROR rows. }

    UserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 10
          maxLength: 64
          description: At most 71 bytes in UTF-8 (bcrypt limit) — longer is rejected with 400.
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: |
            Additional roles (every user is implicitly a regular user). Create is
            ADMIN-only, so any set may be given; omitted defaults to no additional
            roles.
        sendEmail:
          type: boolean
          default: false
          description: Create only — email the new user their credentials (the bilingual
            welcome message). Rejected with 503 on a deployment without outbound email.
        careerPathId:
          type: integer
          format: int64
          nullable: true
          description: |
            Id of an ACTIVE CAREER_PATH dictionary entry. Omitted or null = leave unset.
            An unknown, wrong-dictionary, or soft-deleted id is rejected with 400.
        careerSpecializationId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE CAREER_SPECIALIZATION dictionary entry — see careerPathId.
        seniorityLevelId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE SENIORITY_LEVEL dictionary entry — see careerPathId.
        paidDaysOffAllowance:
          type: integer
          minimum: 0
          maximum: 365
          nullable: true
          description: |
            Annual paid days-off allowance in whole days. Omitted or null = leave unset
            (= zero paid budget). The current value applies to every calendar year.

    UserCreateResponse:
      type: object
      required: [id, name, email, roles, careerPath, careerSpecialization, seniorityLevel, paidDaysOffAllowance, deactivated, disabledFeatures, emailNotificationsEnabled]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        email: { type: string }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
        emailSent:
          type: boolean
          nullable: true
          description: Present only when sendEmail was requested — false means the delivery
            failed (the account exists regardless; the password is still shown once).
        careerPath:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
        careerSpecialization:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
        seniorityLevel:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
        paidDaysOffAllowance:
          type: integer
          nullable: true
          description: Annual paid days-off allowance in whole days; null = not configured.
        deactivated:
          type: boolean
          description: Always false at creation — kept so both user-response shapes stay aligned.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: Always empty at creation (default all-enabled) — aligned with UserResponse.
        emailNotificationsEnabled:
          type: boolean
          description: Always true at creation (the V51 default) — aligned with UserResponse.

    UserUpdateRequest:
      type: object
      required: [name, email, roles]
      properties:
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: |
            Part of the full representation (PUT). Changing the set requires ADMIN; a non-ADMIN
            caller must send the set the user already has, otherwise the request is rejected with 403.
        careerPathId:
          type: integer
          format: int64
          nullable: true
          description: |
            Id of an ACTIVE CAREER_PATH dictionary entry. Omitted or null = leave unchanged —
            there is deliberately no way to clear a set value. Assigning or changing requires
            ADMIN (403 otherwise); an unknown, wrong-dictionary, or soft-deleted NEW id is 400.
            Resubmitting the user's current id is never a change (allowed for any caller, even
            when that entry has been soft-deleted since).
        careerSpecializationId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE CAREER_SPECIALIZATION dictionary entry — semantics as careerPathId.
        seniorityLevelId:
          type: integer
          format: int64
          nullable: true
          description: Id of an ACTIVE SENIORITY_LEVEL dictionary entry — semantics as careerPathId.
        paidDaysOffAllowance:
          type: integer
          minimum: 0
          maximum: 365
          nullable: true
          description: |
            Annual paid days-off allowance in whole days. Omitted or null = leave unchanged —
            there is deliberately no way to clear a set value. Assigning or changing requires
            ADMIN (403 otherwise); resubmitting the current value is never a change. The
            current value applies to every calendar year — changing it recomputes carry-over
            retroactively.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 10
          maxLength: 64
          description: At most 71 bytes in UTF-8 (bcrypt limit) — longer is rejected with 400.
        currentPassword:
          type: string
          description: |
            Required when the caller changes their own password (verified against the
            stored hash); not required for an admin resetting another user's password.

    UserResponse:
      type: object
      required: [id, name, email, roles, careerPath, careerSpecialization, seniorityLevel, paidDaysOffAllowance, deactivated, disabledFeatures, emailNotificationsEnabled]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string, enum: [ADMIN, HR] }
          description: Additional roles — empty for a regular user.
        careerPath:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: |
            The user's career path, resolved from the CAREER_PATH dictionary at read time
            (renames propagate; a soft-deleted referenced entry keeps resolving to its
            retained value). Null until set; once set it can never be cleared.
        careerSpecialization:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the CAREER_SPECIALIZATION dictionary — see careerPath.
        seniorityLevel:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the SENIORITY_LEVEL dictionary — see careerPath.
        paidDaysOffAllowance:
          type: integer
          nullable: true
          description: |
            Annual paid days-off allowance in whole days; null = not configured = zero paid
            budget. ADMIN-only assignable; rides the user representation like the career
            fields (managers consume the derived budget numbers via GET /days-off/budgets).
        deactivated:
          type: boolean
          description: |
            True when an admin has reversibly deactivated the account: the user cannot sign in
            and cannot be NEWLY assigned (team member/manager, goal/1:1/review subordinate,
            feedback party), but all their existing data keeps rendering unchanged and their
            email stays reserved. Flipped only via POST /users/{id}/deactivate|activate —
            never via PUT.
        teams:
          type: array
          items: { $ref: '#/components/schemas/TeamRef' }
          description: |
            Teams the user is a MEMBER of (non-deleted, name-ascending) — a list enrichment
            (v2.1.0, backs the /feature-flags team column): present on `GET /api/v1/users`
            rows (empty array = no teams), OMITTED (not computed) on the single-user
            responses. Membership only — managing a team without being on its roster does
            not list it.
        disabledFeatures:
          type: array
          items: { $ref: '#/components/schemas/Feature' }
          description: |
            The user's admin-disabled features (empty = full access). Caller-only semantics:
            each named feature's endpoints answer 403 for THIS user, and the SPA hides the
            feature from them; others' interactions with the user are untouched. Replaced
            only via PUT /users/{id}/features — never via the whole-user PUT.
        emailNotificationsEnabled:
          type: boolean
          description: |
            The email-mirror opt-out (v2.3.0): true (the default) = every in-app notification
            minted for the user is also emailed to them. Flipped only via
            PUT /users/{id}/email-notifications — never via the whole-user PUT.

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamRequest:
      type: object
      required: [name, managerId]
      properties:
        name: { type: string, maxLength: 100 }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          description: |
            Defaults to an empty list when omitted. Zero-member teams are allowed;
            members can be added later via the `/api/v1/teams/{id}/members/{userId}` sub-resource.
          items: { type: integer, format: int64, minimum: 0 }

    TeamResponse:
      type: object
      required: [id, name, managerId, memberIds]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          items: { type: integer, format: int64, minimum: 0 }
        managerName:
          type: string
          description: >-
            Display name of the user referenced by `managerId` (resolved even when that user
            is soft-deleted). Populated by the single-team GET only; the create/update
            responses omit the key.
        managerDeleted:
          type: boolean
          description: >-
            True when the user referenced by `managerId` has been soft-deleted. Populated by
            the single-team GET only; the create/update responses omit the key.

    TeamListItem:
      type: object
      required: [id, name, managerId, managerName, managerDeleted]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted:
          type: boolean
          description: True when the user referenced by `managerId` has been soft-deleted.

    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamMemberListItem:
      type: object
      required: [userId, name, email, teamId, teamName]
      properties:
        userId: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        email: { type: string, format: email }
        teamId: { type: integer, format: int64, minimum: 0 }
        teamName: { type: string }
        lastOneOnOneDate:
          type: string
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`; always `null` for
            `view=member`. ISO `YYYY-MM-DD` date of the latest non-deleted 1:1 of the
            (row user, caller) pair in the view's direction — `managers`: run by this
            manager (as the meeting's manager) with the caller as the subordinate;
            `managed`: run by the caller with this member as the subordinate. The
            directional pairing only, not the both-directions history. `null` when no
            such meeting exists.
        lastOneOnOneOpenItems:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`: unresolved action items on
            that latest meeting. `null` exactly when `lastOneOnOneDate` is `null`.
        lastFeedbackAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`; always `null` for
            `view=member`. Epoch milliseconds of the SENT moment (from the feedback
            audit trail) of the newest currently-SENT feedback in the view's direction.
            `managers`: this manager as provider, the caller as subject, restricted to
            feedback visible to the caller under the received-view scoping — feedback
            invisible to the caller never counts. `managed`: the caller as provider,
            this member as subject — provider-side, never visibility-filtered (the
            caller authored it). Withdrawn feedback never counts. Feedbacks predating
            the audit trail fall back to their last-modified time. `null` when there
            is none.
        lastFeedbackGivenAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Populated only for `view=member`; always `null` otherwise. Epoch milliseconds
            of the SENT moment (from the feedback audit trail) of the caller's newest
            currently-SENT feedback about this peer — provider-side, never
            visibility-filtered (the caller authored it). Withdrawn feedback never
            counts; feedbacks predating the audit trail fall back to their last-modified
            time. `null` when there is none.
        lastFeedbackReceivedAt:
          type: integer
          format: int64
          nullable: true
          description: |
            Populated only for `view=member`; always `null` otherwise. Epoch milliseconds
            of the SENT moment (from the feedback audit trail) of the newest
            currently-SENT feedback this peer provided about the caller, restricted to
            feedback visible to the caller under the received-view scoping — feedback
            invisible to the caller never counts. Withdrawn feedback never counts;
            feedbacks predating the audit trail fall back to their last-modified time.
            `null` when there is none.
        activeGoalCount:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Populated for `view=managers` and `view=managed`; always `null` for
            `view=member` (peers have no goal relationship). The number of ACTIVE
            (non-deleted) goals of the (row user, caller) pair in the view's direction —
            `managers`: goals this manager set for the caller; `managed`: goals the
            caller set for this member. `0` when the pair has none; DRAFT and ARCHIVED
            goals never count.
        lastReviewId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: |
            Populated only for `view=managed`; always `null` otherwise. Id of the
            caller's latest authored (non-deleted) performance review about this
            member — latest by review period (newest `startMonth` wins), at ANY
            status: the caller wrote it, so DRAFTs count, matching the card's other
            author-side stats. `null` when the caller never reviewed this member.
        lastReviewPeriodStartMonth:
          type: string
          nullable: true
          description: |
            ISO `YYYY-MM` start month of that review's period. `null` exactly when
            `lastReviewId` is `null`.
        lastReviewPeriodEndMonth:
          type: string
          nullable: true
          description: |
            ISO `YYYY-MM` end month (inclusive) of that review's period. `null`
            exactly when `lastReviewId` is `null`.
        lastReviewStatus:
          type: string
          enum: [DRAFT, CALIBRATION, PUBLISHED]
          nullable: true
          description: |
            That review's status. `null` exactly when `lastReviewId` is `null`.
        careerPath:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: |
            The row user's career path, resolved from the CAREER_PATH dictionary at read
            time (renames propagate; a soft-deleted referenced entry keeps resolving to
            its retained value). Unlike the directional stats, populated for EVERY view;
            null when the field is unset.
        careerSpecialization:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the CAREER_SPECIALIZATION dictionary — see careerPath.
        seniorityLevel:
          nullable: true
          allOf: [ { $ref: '#/components/schemas/DictionaryEntry' } ]
          description: Resolved from the SENIORITY_LEVEL dictionary — see careerPath.
        nextVacationStart:
          type: string
          format: date
          nullable: true
          description: |
            ISO start date of the row user's next ACCEPTED days-off request that hasn't ended
            yet (an ongoing one counts; pending requests never show). Populated for
            `view=managed` and `view=member` (teammates see accepted absences by calendar
            parity); always null on `view=managers`, and null when nothing is planned.
        daysOffRemaining:
          type: number
          format: double
          nullable: true
          description: |
            The row user's remaining paid-days budget for the current calendar year
            (carry-over and corrections included). Populated ONLY for `view=managed` —
            budgets are manager/self-scoped, so peer and manager rows never carry it.

    TeamMemberPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    FeedbackContentUpdate:
      type: object
      required: [visibility]
      description: Body of `PUT /feedbacks/{id}` — the editable representation (content + visibility).
      properties:
        content: { type: string, default: "" }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]

    FeedbackRequest:
      type: object
      required: [subjectId, providerId, visibility, status]
      properties:
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        content: { type: string, default: "" }
        requesterMessage:
          type: string
          nullable: true
          description: |
            Requester's clarification note to the provider (why they asked, what they expect).
            Captured only when a feedback is created; immutable afterward — any value sent on
            update (`PUT`) is ignored.

    FeedbackResponse:
      type: object
      required: [id, subjectId, providerId, visibility, status, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        content:
          type: string
          description: |
            The feedback body. Returned as an empty string (and omitted from `required`)
            when the caller may see that the record exists but not its content — a requester
            watching an unfinished (`DRAFT`/`REQUESTED`) feedback they requested.
        requesterMessage:
          type: string
          nullable: true
          description: |
            Requester's clarification note to the provider, set at creation and never editable.
            Null when the requester left it empty.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds of the last change. Server-managed and read-only.
        requesterName:
          type: string
          nullable: true
          description: Display name of the requester; null when there is no requester. Server-resolved, read-only.
        subjectName:
          type: string
          nullable: true
          description: Display name of the subject. Server-resolved, read-only.
        providerName:
          type: string
          nullable: true
          description: Display name of the provider. Server-resolved, read-only.

    FeedbackListItem:
      type: object
      required: [id, requesterDeleted, subjectId, subjectName, subjectDeleted, providerId, providerName, providerDeleted, visibility, status, contentPreview, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        requesterName:
          type: string
          nullable: true
          description: Null when the record has no requester.
        requesterDeleted:
          type: boolean
          description: True when the user referenced by `requesterId` has been soft-deleted. False when there is no requester.
        subjectId: { type: integer, format: int64, minimum: 0 }
        subjectName: { type: string }
        subjectDeleted:
          type: boolean
          description: True when the user referenced by `subjectId` has been soft-deleted.
        providerId: { type: integer, format: int64, minimum: 0 }
        providerName: { type: string }
        providerDeleted:
          type: boolean
          description: True when the user referenced by `providerId` has been soft-deleted.
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        contentPreview:
          type: string
          description: First 200 characters of `content`.
        content:
          type: string
          nullable: true
          description: >-
            Full (uncapped) content. Present only on `view=kudos` rows — every other view
            omits the key entirely.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds of the last change. Server-managed and read-only.

    FeedbackPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DuplicateCheckResponse:
      type: object
      description: >-
        The in-progress duplicate for a prospective (subject, provider, requester) triple —
        both fields null when there is none.
      properties:
        existingId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Id of the active DRAFT/REQUESTED feedback matching the triple.
        existingStatus:
          type: string
          enum: [REQUESTED, DRAFT]
          nullable: true
          description: Its status; null exactly when `existingId` is null.

    TemplateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        content: { type: string, default: "" }

    TemplateResponse:
      type: object
      required: [id, name, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        content: { type: string }

    TemplateListItem:
      type: object
      required: [id, name, contentPreview]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        contentPreview:
          type: string
          description: First 200 characters of `content`.

    TemplatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    DictionaryEntry:
      type: object
      required: [id, valueEn, valuePl]
      description: Every entry is bilingual (V53) — clients render the viewer's language.
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        valueEn: { type: string }
        valuePl: { type: string }

    DictionaryEntryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryEntry'

    DictionaryEntryInput:
      type: object
      required: [valueEn, valuePl]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: Present = update that active entry in place; absent = insert a new entry.
        valueEn: { type: string, maxLength: 100 }
        valuePl: { type: string, maxLength: 100 }

    DictionaryUpdateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DictionaryEntryInput'

    AlertRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 150 }
        content:
          type: string
          default: ""
          maxLength: 5000
          description: Markdown-formatted message body. Must not be blank.
        isActive: { type: boolean, default: true }
        startsAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds; the alert is hidden before this moment. Null = unbounded.
        endsAt:
          type: integer
          format: int64
          nullable: true
          description: Epoch milliseconds; the alert is hidden after this moment. Null = unbounded.

    AlertResponse:
      type: object
      required: [id, title, content, isActive]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        title: { type: string }
        content: { type: string }
        isActive: { type: boolean }
        startsAt: { type: integer, format: int64, nullable: true }
        endsAt: { type: integer, format: int64, nullable: true }

    AlertPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlertResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    VisibleAlert:
      type: object
      required: [id, title, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        title: { type: string }
        content:
          type: string
          description: Markdown-formatted message body.

    VisibleAlertList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VisibleAlert'

    FeedbackEventResponse:
      type: object
      required: [id, feedbackId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        feedbackId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum: [CREATED, DELETED, STATUS_CHANGED, CONTENT_UPDATED, CONTENT_AND_VISIBILITY_UPDATED, VISIBILITY_CHANGED]
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering, as enum names — e.g.
            `{status}` for CREATED, `{from,to}` for STATUS_CHANGED, `{to}` for VISIBILITY_CHANGED.
            Empty object when the event kind needs none.

    FeedbackEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackEventResponse' }

    OneOnOneItemInput:
      type: object
      required: [content]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            Identifies an existing row on PUT (omitted = a new item). Must be omitted on create.
        content: { type: string, maxLength: 4000, description: Plain unformatted paragraph. }

    OneOnOneActionItemInput:
      type: object
      required: [content, owner]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            Identifies an existing row on PUT (omitted = a new item). Must be omitted on create.
        content: { type: string, maxLength: 4000, description: Plain unformatted paragraph. }
        owner:
          type: string
          enum: [MANAGER, SUBORDINATE]
          description: Which of the meeting's two parties owns the action item.
        dueDate:
          type: string
          format: date
          nullable: true
          description: ISO `YYYY-MM-DD`; null = no due date.
        resolved: { type: boolean, default: false }

    OneOnOneCreateRequest:
      type: object
      required: [subordinateId, meetingDate]
      properties:
        subordinateId:
          type: integer
          format: int64
          minimum: 0
          description: Must be a direct report of the caller (the manager).
        meetingDate: { type: string, format: date, description: ISO `YYYY-MM-DD`. }
        points:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
          description: Points discussed, in order. Items must not carry ids.
        decisions:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
          description: Decisions made, in order. Items must not carry ids.
        actionItems:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/OneOnOneActionItemInput' }
          description: >-
            Action items, in order; the carried-over copies from the previous meeting are
            prepended server-side. Items must not carry ids.

    OneOnOneUpdateRequest:
      type: object
      required: [meetingDate, points, decisions, actionItems]
      properties:
        meetingDate: { type: string, format: date, description: ISO `YYYY-MM-DD`. }
        points:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
        decisions:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OneOnOneItemInput' }
        actionItems:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/OneOnOneActionItemInput' }

    OneOnOneItem:
      type: object
      required: [id, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        content: { type: string }

    OneOnOneActionItem:
      type: object
      required: [id, content, owner, resolved]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        content: { type: string }
        owner:
          type: string
          enum: [MANAGER, SUBORDINATE]
        dueDate: { type: string, format: date, nullable: true }
        resolved: { type: boolean }
        copiedFromId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            The source action item in the pair's previous meeting this one was carried over
            from; null for items authored in this meeting (or when the source row no longer
            exists). Server-managed.
        firstAppearedOn:
          type: string
          format: date
          nullable: true
          description: >-
            ISO date of the item's earliest surviving appearance in its carry-over chain — the
            same meeting the item's history shows first (soft-deleted ancestor meetings are
            skipped). Null when the item first appeared in this meeting or the chain no longer
            survives. Server-managed, read-only.

    OneOnOneResponse:
      type: object
      required: [id, managerId, managerName, subordinateId, subordinateName, meetingDate, lastModified, points, decisions, actionItems]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        meetingDate: { type: string, format: date }
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every update.
        points:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneItem' }
          description: Points discussed, in stored order.
        decisions:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneItem' }
          description: Decisions made, in stored order.
        actionItems:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneActionItem' }
          description: Action items, in stored order.
        isLatest:
          type: boolean
          default: true
          description: >-
            Whether this is the pair's latest non-deleted meeting (meeting date, id as
            tiebreaker). Only the latest may be edited or deleted (PUT/DELETE answer 409
            otherwise); clients open older meetings read-only.
        minMeetingDate:
          type: string
          format: date
          nullable: true
          description: >-
            The pair's previous meeting's date — the chronological floor for this meeting's
            date (PUT rejects anything below it with 409; the edit form uses it as the date
            input's `min`). Null when this is the pair's first meeting.

    OneOnOneListItem:
      type: object
      required: [id, managerId, managerName, managerDeleted, subordinateId, subordinateName, subordinateDeleted, meetingDate, lastModified, pointCount, decisionCount, actionItemCount, openActionItemCount]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted: { type: boolean }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        subordinateDeleted: { type: boolean }
        meetingDate: { type: string, format: date }
        lastModified: { type: integer, format: int64 }
        pointCount: { type: integer, minimum: 0 }
        decisionCount: { type: integer, minimum: 0 }
        actionItemCount: { type: integer, minimum: 0 }
        openActionItemCount:
          type: integer
          minimum: 0
          description: Action items not yet resolved.
        isLatest:
          type: boolean
          default: true
          description: >-
            Whether this row is its pair's latest non-deleted meeting — see
            `OneOnOneResponse.isLatest`. Drives the client's Edit-vs-View affordance.

    OneOnOnePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OneOnOneListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    OneOnOneEventResponse:
      type: object
      required: [id, meetingId, userId, userName, timestamp, type, params]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        meetingId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum:
            - CREATED
            - DELETED
            - DATE_CHANGED
            - POINT_ADDED
            - POINT_EDITED
            - POINT_REMOVED
            - DECISION_ADDED
            - DECISION_EDITED
            - DECISION_REMOVED
            - ACTION_ITEM_ADDED
            - ACTION_ITEM_EDITED
            - ACTION_ITEM_REMOVED
            - ACTION_ITEM_RESOLVED
            - ACTION_ITEM_UNRESOLVED
            - ACTION_ITEM_DUE_DATE_CHANGED
            - ACTION_ITEM_OWNER_CHANGED
          description: Structured event kind; the client renders it in the viewer's language.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — 1-based `position`s, ISO dates,
            owner enum names, the CREATED event's `date`/`carriedOver`. Never item text (the
            content columns are encrypted at rest; this trail is plaintext by design). Empty
            object when the event kind needs none.

    OneOnOneEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OneOnOneEventResponse' }

    ActionItemHistoryEntry:
      type: object
      required: [actionItemId, meetingId, meetingDate, content, owner, resolved]
      properties:
        actionItemId: { type: integer, format: int64, minimum: 0 }
        meetingId: { type: integer, format: int64, minimum: 0 }
        meetingDate: { type: string, format: date }
        content: { type: string }
        owner:
          type: string
          enum: [MANAGER, SUBORDINATE]
        dueDate: { type: string, format: date, nullable: true }
        resolved: { type: boolean }

    ActionItemHistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActionItemHistoryEntry' }

    GoalMilestoneInput:
      type: object
      required: [description]
      properties:
        id:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: >-
            An existing milestone row of this goal to keep (its done flag is preserved — the
            definition PUT never ticks); absent = a new milestone, starting not-done. Must be
            absent on create.
        description:
          type: string
          minLength: 1
          maxLength: 4000
          description: Non-blank; stored encrypted at rest. Payload order IS the order.

    GoalMilestoneDone:
      type: object
      required: [id, done]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        done: { type: boolean }

    GoalMilestoneResponse:
      type: object
      required: [id, description, done]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        description: { type: string }
        done: { type: boolean }

    GoalCreateRequest:
      type: object
      required: [subordinateId, title, type, dueDate]
      properties:
        subordinateId:
          type: integer
          format: int64
          minimum: 0
          description: Must be a direct report of the caller (the manager).
        title:
          type: string
          maxLength: 200
          description: Plaintext (unlike description/summary) — lists sort and filter on it.
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [PLAN, NUMBER, PERCENTAGE]
          description: How progress is tracked; decides which value fields apply.
        targetValue:
          type: number
          format: double
          nullable: true
          description: >-
            Required for NUMBER and PERCENTAGE (0–100 for PERCENTAGE); must be absent for
            PLAN.
        milestones:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/GoalMilestoneInput' }
          description: >-
            PLAN only (the numeric types must send none, `400` otherwise): the goal's ordered
            milestones, id-less at creation. At most 100.
        dueDate:
          type: string
          format: date
          description: >-
            ISO `YYYY-MM-DD`; must not be earlier than the current date.

    GoalDefinitionUpdate:
      type: object
      required: [title, type, dueDate]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 4000, default: '' }
        type:
          type: string
          enum: [PLAN, NUMBER, PERCENTAGE]
          description: >-
            Changing the type re-initializes the value fields for the new type, discarding any
            recorded progress (away from PLAN the milestones are deleted).
        targetValue:
          type: number
          format: double
          nullable: true
          description: >-
            Required for NUMBER and PERCENTAGE (0–100 for PERCENTAGE); must be absent for
            PLAN.
        milestones:
          type: array
          maxItems: 100
          default: []
          items: { $ref: '#/components/schemas/GoalMilestoneInput' }
          description: >-
            PLAN only (the numeric types must send none, `400` otherwise): the whole-list
            replacement of the goal's milestones in payload order — id-matched rows kept (done
            flags preserved), missing rows removed, id-less rows added. Duplicate or foreign
            ids are `400`.
        dueDate:
          type: string
          format: date
          description: >-
            ISO `YYYY-MM-DD`; must not be earlier than the current date. Editable only while
            DRAFT (this endpoint is DRAFT-only).

    GoalProgressUpdate:
      type: object
      properties:
        currentValue:
          type: number
          format: double
          nullable: true
          description: >-
            The new current value — NUMBER and PERCENTAGE goals only (0–100 for PERCENTAGE);
            must be absent for PLAN. Optional: absent leaves the value untouched (a
            state-less update requires a non-blank comment).
        milestones:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/GoalMilestoneDone' }
          description: >-
            The complete done-state — PLAN goals only; must be absent otherwise. One entry per
            milestone, ids matching the goal's milestones exactly (else `400`). Optional:
            absent leaves the flags untouched (a state-less update requires a non-blank
            comment).
        comment:
          type: string
          nullable: true
          maxLength: 4000
          description: >-
            Optional context of the update, shown in the goal's history (stored encrypted at
            rest on the history event, never in its params). Blank counts as absent; a
            non-blank comment with an unchanged state records a `PROGRESS_COMMENTED` event.

    GoalArchiveRequest:
      type: object
      required: [summary]
      properties:
        summary:
          type: string
          minLength: 1
          maxLength: 4000
          description: The archiving summary — required and non-blank; recorded on the goal.

    GoalResponse:
      type: object
      required: [id, managerId, managerName, subordinateId, subordinateName, createdAt, dueDate, title, description, type, targetValue, currentValue, milestones, status, summary, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, immutable.
        dueDate:
          type: string
          format: date
          description: >-
            ISO `YYYY-MM-DD`; never earlier than the day it was last saved. Editable only while
            DRAFT.
        title: { type: string }
        description: { type: string }
        type:
          type: string
          enum: [PLAN, NUMBER, PERCENTAGE]
        targetValue:
          type: number
          format: double
          nullable: true
          description: Null for PLAN goals.
        currentValue:
          type: number
          format: double
          nullable: true
          description: >-
            Null for PLAN goals — and null while no value has been recorded yet (a fresh
            goal starts unset); settable only while ACTIVE.
        milestones:
          type: array
          items: { $ref: '#/components/schemas/GoalMilestoneResponse' }
          description: >-
            PLAN only (empty for the numeric types): the goal's ordered milestones — its whole
            progress model. Defined (whole-list replaced) while DRAFT via `PUT /goals/{id}`;
            done flags ticked while ACTIVE via `PUT /goals/{id}/progress`.
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        summary:
          type: string
          nullable: true
          description: >-
            Non-null once the goal has been archived at least once — kept on reopen, overwritten
            at the next archiving.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds; server-managed, bumped on every mutation.

    GoalListItem:
      type: object
      required: [id, managerId, managerName, managerDeleted, subordinateId, subordinateName, subordinateDeleted, title, type, targetValue, currentValue, milestonesDone, milestonesTotal, status, createdAt, dueDate, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted: { type: boolean }
        subordinateId: { type: integer, format: int64, minimum: 0 }
        subordinateName: { type: string }
        subordinateDeleted: { type: boolean }
        title: { type: string }
        type:
          type: string
          enum: [PLAN, NUMBER, PERCENTAGE]
        targetValue: { type: number, format: double, nullable: true }
        currentValue: { type: number, format: double, nullable: true }
        milestonesDone:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            PLAN only (null for the numeric types): how many milestones are done. Milestone
            texts never ride list rows.
        milestonesTotal:
          type: integer
          nullable: true
          minimum: 0
          description: 'PLAN only (null for the numeric types): the milestone count.'
        status:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
