openapi: 3.1.0
info:
  title: lettuce-api
  version: 1.0.0-SNAPSHOT
  description: |
    JWT-authenticated REST API for users, teams, and feedback exchange.

    Authorization model: layered RBAC.
    - Global roles on `users.role`: `ADMIN` and `USER`. ADMIN bypasses all
      per-resource checks. The JWT issued at /login carries the caller's
      global role and userId; per-request team membership and feedback
      relationships are looked up from the database.
    - Team-scoped authority: the user identified by `teams.manager_id`
      may mutate the team or its membership. Other authenticated users
      may only read.
    - Feedback access is derived from the `visibility` enum together with
      the caller's relationship to the row (subject / provider / requester).
      Only the provider (or ADMIN) may modify a feedback record.
servers:
  - url: http://localhost:8080
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: teams
  - name: feedbacks
  - name: templates
  - name: notifications

paths:
  /api/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unknown email or wrong password

  /api/logout:
    post:
      tags: [auth]
      summary: Revoke the bearer token (server-side denylist)
      responses:
        '204':
          description: Token revoked
        '401':
          description: Missing or invalid token

  /api/users:
    get:
      tags: [users]
      summary: List users
      description: |
        Any authenticated user may list. Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`, `email`, `role`. Default sort is `id` ascending.
          `id` ascending is always appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `name` — case-insensitive substring match against `name`.
          - `email` — case-insensitive substring match against `email`.
          - `role` — exact match, `ADMIN` or `USER`.
          - `teamId` — restrict to users who are members of the given team.
        - The `q` free-text param defined elsewhere is not used by this endpoint.

        Malformed query parameters (unknown sort field, unknown role, out-of-range page/pageSize)
        respond with `400` and an `ApiError` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the user's name.
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the user's email.
        - name: role
          in: query
          required: false
          schema: { type: string, enum: [ADMIN, USER] }
          description: Exact match against the user's global role.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Filter to users who are members of the given team.
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          description: Malformed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      tags: [users]
      summary: Create a user
      description: |
        Requires ADMIN. If the request body omits `role`, the new user defaults to `USER`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Caller is not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Fetch a user by id
      description: Requires the caller to be the target user, or to be ADMIN.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the target user and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
    put:
      tags: [users]
      summary: Update a user
      description: |
        Updates a user's `name`, `email`, and `role`. The password cannot be
        changed via this endpoint and the existing password is preserved.
        Requires the caller to be the target user, or to be ADMIN.
        Only ADMIN may change a user's `role`; a non-ADMIN caller must either
        omit `role` or send the value the user already has, otherwise the request is rejected with 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204': { description: Updated }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the target user and not ADMIN, or attempted to escalate role, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
        '409':
          description: Email already in use by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [users]
      summary: Delete a user
      description: Requires ADMIN.
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/users/{id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [users]
      summary: Change a user's password
      description: |
        Sets a new password for the user. Only the password is changed; no other
        fields are touched. Requires the caller to be the target user, or to be ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordUpdateRequest'
      responses:
        '204': { description: Password updated }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the target user and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }

  /api/teams:
    get:
      tags: [teams]
      summary: List teams
      description: |
        Any authenticated user may list. Supports offset pagination, sorting, and filtering.

        - Sortable fields: `id`, `name`. Default sort is `id` ascending; `id` ascending
          is always appended as a deterministic tiebreaker.
        - Filters (all optional):
          - `name` — case-insensitive substring match against the team's name.
          - `managerId` — exact match against the team's manager id.
          - `memberId` — restrict to teams the given user is a member of.

        Each returned item includes the manager's `name` resolved via join so the UI
        does not need an N+1 lookup.

        Malformed query parameters (unknown sort field, non-numeric managerId,
        out-of-range page/pageSize) respond with `400` and an `ApiError` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the team's name.
        - name: managerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the team's manager id.
        - name: memberId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Filter to teams the given user is a member of.
      responses:
        '200':
          description: A page of teams
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPage'
        '400':
          description: Malformed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      tags: [teams]
      summary: Create a team
      description: |
        Any authenticated user may create a team, but the `managerId` in
        the request body must equal the caller's own user id (ADMIN may
        designate any user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { description: Validation error (e.g. manager in member list, duplicate members) }
        '401': { description: Missing or invalid token }
        '403': { description: Caller attempted to set `managerId` to another user without being ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/teams/members:
    get:
      tags: [teams]
      summary: List members of the caller's teams
      description: |
        Lists team members scoped by `view`. Scoping is always relative to the caller,
        including ADMIN callers.

        - `view=member` (the default): members of teams where the caller is a member.
          The caller's own rows are excluded. Team managers never appear — a manager is
          not a `team_members` row.
        - `view=managed`: members of teams where the caller is the manager.
        - `view=managers`: the managers of teams where the caller is a member. Each item
          describes a manager (in `userId`/`name`/`email`) and the managed team. The
          caller is excluded.

        Each item is one (user, team) pair — a user who shares several teams with the
        caller appears once per team. Soft-deleted users and soft-deleted teams are
        excluded.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id` (the member's user id), `name`, `email`, `teamName`.
          Default sort is `id` ascending. `id` ascending and the team id ascending are
          always appended as deterministic tiebreakers.
        - Filters (all optional, all whitelisted):
          - `name` — case-insensitive substring match against the member's name.
          - `email` — case-insensitive substring match against the member's email.
          - `teamId` — exact match against the team's id.

        Malformed query parameters (unknown view, unknown sort field, non-numeric
        teamId, out-of-range page/pageSize) respond with `400` and an `ApiError` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [member, managed, managers], default: member }
          description: |
            Which caller-relative slice to list.
            - `member`: members of teams the caller belongs to.
            - `managed`: members of teams the caller manages.
            - `managers`: the managers of teams the caller is a member of. Each item's
              `userId`/`name`/`email` describe the manager and `teamId`/`teamName` the
              managed team. The caller is excluded; a manager who manages several of the
              caller's teams appears once per team.
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the member's name.
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the member's email.
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
          description: Exact match against the team's id.
      responses:
        '200':
          description: A page of team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberPage'
        '400':
          description: Malformed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/teams/{id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Fetch a team
      description: Any authenticated user may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401': { description: Missing or invalid token }
        '404': { description: Not found }
    put:
      tags: [teams]
      summary: Replace a team
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '204': { description: Updated }
        '400': { description: Validation error }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the team's manager and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
    delete:
      tags: [teams]
      summary: Delete a team
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the team's manager and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }

  /api/teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserIdInPath'
    put:
      tags: [teams]
      summary: Add a member to the team (idempotent)
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      responses:
        '204': { description: Member added (or already present) }
        '400': { description: Validation error (e.g. adding the manager as a member) }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the team's manager and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Team not found }
    delete:
      tags: [teams]
      summary: Remove a member from the team
      description: Requires the caller to be the team's current manager, or to be ADMIN.
      responses:
        '204': { description: Removed }
        '400': { description: Cannot remove the last member or the manager via this endpoint }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the team's manager and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Team not found }

  /api/feedbacks:
    get:
      tags: [feedbacks]
      summary: List feedbacks for the caller
      description: |
        Lists feedback records scoped by `view`. Scoping is always relative to the caller,
        including ADMIN callers.

        - `view=received` (the default): rows where the caller is the **subject** AND one of:
          (a) the row has no requester and `status` is `SENT`/`WITHDRAWN`; (b) the caller is the
          requester (any status/visibility); or (c) someone else is the requester, `visibility`
          is `PROVIDER_SUBJECT`/`PROVIDER_REQUESTER_SUBJECT`/`PUBLIC`, and `status` is
          `SENT`/`WITHDRAWN`. `PROVIDER_REQUESTER` rows appear only via (b). A `DRAFT`/`REQUESTED`
          row the caller requested has its `contentPreview` redacted (empty) until it is sent.
        - `view=provided`: rows where the caller is the provider, regardless of visibility
          (a provider may always read their own records).
        - `view=team`: rows where the subject is a member of a non-deleted team the caller manages
          (the caller's subordinates), AND the caller is a **party** to the row — its provider or
          requester (at any status) — OR `status` is `SENT`/`WITHDRAWN`. Intended for a manager's
          overview; in-progress (`DRAFT`/`REQUESTED`/`REJECTED`) rows the manager is not a party to
          are excluded. A caller who manages no team gets an empty page. When the manager is also
          the requester of an unfinished row, its `contentPreview` is redacted (empty) until sent.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `requesterName`, `subjectName`, `providerName`, `visibility`,
          `status`, `lastModified`. Default sort is `id` ascending. `id` ascending is always
          appended as a deterministic tiebreaker.
        - Filters (all optional, all whitelisted):
          - `requesterName` — case-insensitive substring match against the requester's name.
            Rows without a requester never match when this filter is set.
          - `subjectName` — case-insensitive substring match against the subject's name.
          - `providerName` — case-insensitive substring match against the provider's name.
          - `providerId` — exact match against the provider's user id. Combined with
            `view=received`, this scopes the list to feedbacks a specific person gave the caller.
          - `subjectId` — exact match against the subject's user id. Combined with
            `view=provided`, this scopes the list to feedbacks the caller gave a specific person.
          - `visibility` — exact match against the visibility enum.
          - `status` — exact match against the status enum.
          - `lastModified[gte]` — lower bound (inclusive) on `lastModified`, epoch
            milliseconds. Returns rows changed at or after this instant.
        - `content` is returned as `contentPreview`, capped at 200 characters; it is neither
          sortable nor filterable.

        Malformed query parameters (unknown view, unknown sort field, unknown enum value,
        out-of-range page/pageSize) respond with `400` and an `ApiError` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [received, provided, team], default: received }
          description: Which caller-relative slice of feedbacks to list.
        - name: requesterName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the requester's name.
        - name: subjectName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the subject's name.
        - name: providerName
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the provider's name.
        - name: providerId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
          description: Exact match against the provider's user id.
        - name: subjectId
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 1 }
          description: Exact match against the subject's user id.
        - name: visibility
          in: query
          required: false
          schema:
            type: string
            enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
          description: Exact match against the record's visibility.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
          description: Exact match against the record's status.
        - name: lastModified[gte]
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: >-
            Lower bound (inclusive) on `lastModified`, epoch milliseconds.
            Returns rows changed at or after this instant.
      responses:
        '200':
          description: A page of feedbacks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '400':
          description: Malformed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      tags: [feedbacks]
      summary: Create a feedback record
      description: Any authenticated user may create a feedback record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400': { description: 'Validation error (provider ≠ subject; requester ≠ provider; REQUESTED requires a requester; a feedback with a requester may not use PROVIDER_SUBJECT visibility) or referenced user does not exist' }
        '401': { description: Missing or invalid token }

  /api/feedbacks/{id}:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    get:
      tags: [feedbacks]
      summary: Fetch a feedback record
      description: |
        Authorization (`canReadFeedback`) is evaluated in this order — read access depends on the
        caller's relationship to the row, the `visibility` and (for subject/manager/public) the
        `status`:
        - ADMIN and the **provider** may always read, at any status/visibility.
        - the **requester** may read at any status, but only when `visibility` is
          `PROVIDER_REQUESTER` or `PROVIDER_REQUESTER_SUBJECT`.
        - the **subject** may read only when `visibility` is `PROVIDER_SUBJECT` or
          `PROVIDER_REQUESTER_SUBJECT` AND `status` is `SENT` or `WITHDRAWN` (so a `DRAFT`/
          `REQUESTED`/`REJECTED` record is not visible to the subject through this rule).
        - a **manager of the subject** may read any feedback about a subordinate, at any status
          (the endpoint grants a managing caller an unconditional read).
        - otherwise a `PUBLIC` record may be read by any authenticated user once `status` is `SENT`.
        Anything else is `403`.

        Content redaction: a requester may see that a feedback they requested exists, but while it
        is unfinished (`DRAFT`/`REQUESTED`) the `content` field is returned empty for that requester;
        it becomes visible once the feedback is sent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '401': { description: Missing or invalid token }
        '403': { description: Caller's relationship to the row does not satisfy `visibility`, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
    put:
      tags: [feedbacks]
      summary: Replace a feedback record
      description: Only the record's provider (or ADMIN) may modify a feedback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204': { description: Updated }
        '400': { description: 'Validation error (same invariants as create — incl. a feedback with a requester may not use PROVIDER_SUBJECT visibility) or invalid status transition' }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the feedback's provider and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
    delete:
      tags: [feedbacks]
      summary: Delete a feedback record
      description: Only the record's provider (or ADMIN) may delete a feedback.
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not the feedback's provider and not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/feedbacks/{id}/events:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    get:
      tags: [feedbacks]
      summary: List a feedback's audit history
      description: |
        Returns the immutable audit trail for a feedback — one entry per create, status transition
        and content/visibility edit — oldest first, each carrying the acting user and a generated
        description. Authorization matches the single-GET above (`canReadFeedback`, with a managing
        caller allowed): whoever may read the feedback may read its history. Events are
        server-generated; there is no create/update/delete endpoint.
      responses:
        '200':
          description: The feedback's events, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackEventList'
        '401': { description: Missing or invalid token }
        '403': { description: Caller may not read this feedback, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }

  /api/templates:
    get:
      tags: [templates]
      summary: List templates
      description: |
        Lists templates. Any authenticated user may read.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `name`. Default sort is `id` ascending. `id` ascending is
          always appended as a deterministic tiebreaker.
        - Filter (optional, whitelisted):
          - `name` — case-insensitive substring match against the template name.
        - `content` is returned as `contentPreview`, capped at 200 characters; it is neither
          sortable nor filterable.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize) respond
        with `400` and an `ApiError` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match against the template name.
      responses:
        '200':
          description: A page of templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '400':
          description: Malformed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      tags: [templates]
      summary: Create a template
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '400': { description: Validation error (e.g. blank name) }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: A template with the same name already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/templates/{id}:
    parameters:
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [templates]
      summary: Fetch a template
      description: Any authenticated user may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResponse'
        '401': { description: Missing or invalid token }
        '404': { description: Not found }
    put:
      tags: [templates]
      summary: Replace a template
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateRequest'
      responses:
        '204': { description: Updated }
        '400': { description: Validation error (e.g. blank name) }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
        '409': { description: A template with the same name already exists, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      tags: [templates]
      summary: Delete a template
      description: ADMIN only.
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is not ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/notifications:
    get:
      tags: [notifications]
      summary: List the caller's notifications
      description: |
        Lists notifications addressed to the calling user (`recipientId` = caller). The list is
        always scoped to the caller, including for ADMIN — there is no cross-user view.

        Notifications are generated as a side-effect of other activities; there is no create
        endpoint.

        Supports offset pagination, sorting and filtering.

        - Sortable fields: `id`, `timestamp`. Default sort is `timestamp` descending (newest
          first). `id` ascending is always appended as a deterministic tiebreaker.
        - Filter (optional, whitelisted):
          - `wasSeen` — `true`/`false`; restricts to seen / unseen notifications.

        Malformed query parameters (unknown sort field, out-of-range page/pageSize, non-boolean
        `wasSeen`) respond with `400` and an `ApiError` body.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: wasSeen
          in: query
          required: false
          schema: { type: boolean }
          description: Restrict to seen (`true`) or unseen (`false`) notifications.
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: Malformed query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401': { description: Missing or invalid token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

  /api/notifications/{id}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    get:
      tags: [notifications]
      summary: Fetch a notification
      description: The recipient or an ADMIN may read.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '401': { description: Missing or invalid token }
        '403': { description: Caller is neither the recipient nor ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }
    delete:
      tags: [notifications]
      summary: Delete a notification
      description: The recipient or an ADMIN may delete.
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is neither the recipient nor ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }

  /api/notifications/{id}/seen:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [notifications]
      summary: Mark a notification as seen
      description: |
        Sets `wasSeen` to `true`. Idempotent. The recipient or an ADMIN may call it.
      responses:
        '204': { description: Marked as seen }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is neither the recipient nor ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }

  /api/notifications/{id}/unseen:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    post:
      tags: [notifications]
      summary: Mark a notification as unseen
      description: |
        Sets `wasSeen` to `false`. Idempotent. The recipient or an ADMIN may call it.
      responses:
        '204': { description: Marked as unseen }
        '401': { description: Missing or invalid token }
        '403': { description: Caller is neither the recipient nor ADMIN, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    UserIdInPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    TeamId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    FeedbackId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    TemplateId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    NotificationId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
      description: 1-based page index. Defaults to 1.
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      description: Rows per page. Defaults to 20, maximum 100.
    Sort:
      name: sort
      in: query
      required: false
      schema: { type: string }
      description: |
        Sort spec. Format: `field` (ascending) or `-field` (descending). Multiple fields are
        comma-separated, leftmost wins: `sort=-createdAt,id`. The endpoint declares its
        sortable-field whitelist; unknown fields are rejected with `400`. `id` ascending is
        always appended as a deterministic tiebreaker.

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt, userId, role]
      properties:
        token: { type: string }
        expiresAt:
          type: integer
          format: int64
          description: Token expiry as Unix epoch milliseconds
        userId: { type: integer, format: int64, minimum: 0 }
        role:
          type: string
          enum: [ADMIN, USER]
          description: Global role of the authenticated user.

    UserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string }
        role:
          type: string
          enum: [ADMIN, USER]
          description: |
            Honoured only when the caller is ADMIN. Non-ADMIN callers must omit this
            field or send the value the user already has, otherwise the request is
            rejected with 403. Omitted on create defaults to USER.

    UserUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
        role:
          type: string
          enum: [ADMIN, USER]
          description: |
            Honoured only when the caller is ADMIN. Non-ADMIN callers must omit this
            field or send the value the user already has, otherwise the request is
            rejected with 403. Omitting it keeps the user's current role.

    PasswordUpdateRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8 }

    UserResponse:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [ADMIN, USER]
          description: Global role.

    UserPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamRequest:
      type: object
      required: [name, managerId]
      properties:
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          description: |
            Defaults to an empty list when omitted. Zero-member teams are allowed;
            members can be added later via the `/api/teams/{id}/members/{userId}` sub-resource.
          items: { type: integer, format: int64, minimum: 0 }

    TeamResponse:
      type: object
      required: [id, name, managerId, memberIds]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          items: { type: integer, format: int64, minimum: 0 }

    TeamListItem:
      type: object
      required: [id, name, managerId, managerName, managerDeleted]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        managerName: { type: string }
        managerDeleted:
          type: boolean
          description: True when the user referenced by `managerId` has been soft-deleted.

    TeamPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TeamMemberListItem:
      type: object
      required: [userId, name, email, teamId, teamName]
      properties:
        userId: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        email: { type: string }
        teamId: { type: integer, format: int64, minimum: 0 }
        teamName: { type: string }

    TeamMemberPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMemberListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    FeedbackRequest:
      type: object
      required: [subjectId, providerId, visibility, status]
      properties:
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        content: { type: string, default: "" }

    FeedbackResponse:
      type: object
      required: [id, subjectId, providerId, visibility, status, content, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        content: { type: string }
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds of the last change. Server-managed and read-only.
        requesterName:
          type: string
          nullable: true
          description: Display name of the requester; null when there is no requester. Server-resolved, read-only.
        subjectName:
          type: string
          nullable: true
          description: Display name of the subject. Server-resolved, read-only.
        providerName:
          type: string
          nullable: true
          description: Display name of the provider. Server-resolved, read-only.

    FeedbackListItem:
      type: object
      required: [id, requesterDeleted, subjectId, subjectName, subjectDeleted, providerId, providerName, providerDeleted, visibility, status, contentPreview, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        requesterName:
          type: string
          nullable: true
          description: Null when the record has no requester.
        requesterDeleted:
          type: boolean
          description: True when the user referenced by `requesterId` has been soft-deleted. False when there is no requester.
        subjectId: { type: integer, format: int64, minimum: 0 }
        subjectName: { type: string }
        subjectDeleted:
          type: boolean
          description: True when the user referenced by `subjectId` has been soft-deleted.
        providerId: { type: integer, format: int64, minimum: 0 }
        providerName: { type: string }
        providerDeleted:
          type: boolean
          description: True when the user referenced by `providerId` has been soft-deleted.
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN, REJECTED]
        contentPreview:
          type: string
          description: First 200 characters of `content`.
        lastModified:
          type: integer
          format: int64
          description: Epoch milliseconds of the last change. Server-managed and read-only.

    FeedbackPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedbackListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    TemplateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        content: { type: string, default: "" }

    TemplateResponse:
      type: object
      required: [id, name, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        content: { type: string }

    TemplateListItem:
      type: object
      required: [id, name, contentPreview]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        contentPreview:
          type: string
          description: First 200 characters of `content`.

    TemplatePage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TemplateListItem'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    FeedbackEventResponse:
      type: object
      required: [id, feedbackId, userId, userName, timestamp, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        feedbackId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        content:
          type: string
          description: Human-readable description of what changed.

    FeedbackEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeedbackEventResponse' }

    NotificationResponse:
      type: object
      required: [id, recipientId, timestamp, message, wasSeen]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        recipientId: { type: integer, format: int64, minimum: 0 }
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the notification was generated. Server-managed.
        message: { type: string }
        link:
          type: string
          nullable: true
          description: Optional in-app path to open from the notification; absent when there is nowhere to go.
        wasSeen:
          type: boolean
          description: Whether the recipient has marked the notification as seen.

    NotificationPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        total:
          type: integer
          format: int64
          minimum: 0
          description: Row count after filters, before pagination.

    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: conflict }
        message: { type: string }
