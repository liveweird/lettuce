      properties:
        id: { type: integer, format: int64, minimum: 0 }
        goalId: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName:
          type: string
          description: Display name of the user who performed the change. Server-resolved, read-only.
        timestamp:
          type: integer
          format: int64
          description: Epoch milliseconds when the event was recorded. Server-managed.
        type:
          type: string
          enum:
            - CREATED
            - TITLE_CHANGED
            - DESCRIPTION_CHANGED
            - TYPE_CHANGED
            - TARGET_CHANGED
            - DUE_DATE_CHANGED
            - PROGRESS_UPDATED
            - ACHIEVED_CHANGED
            - MILESTONE_ADDED
            - MILESTONE_EDITED
            - MILESTONE_REMOVED
            - MILESTONE_COMPLETED
            - MILESTONE_REOPENED
            - PROGRESS_COMMENTED
            - STATUS_CHANGED
            - DELETED
          description: >-
            Structured event kind; the client renders it in the viewer's language.
            ACHIEVED_CHANGED is historical only (the pre-v2.9.0 BINARY type's flag flip) —
            nothing mints it anymore.
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            Interpolation params for the localized rendering — enum names (`from`/`to` statuses
            and types, the CREATED event's `type`), numeric values (target/progress
            `from`/`to`, `""` = no value), 1-based milestone positions (the `MILESTONE_*`
            events' `position`), and ISO dates (the due-date change's `from`/`to`).
            Never title/description/summary/milestone/comment text (params stay plaintext by
            design; the progress-update comment lives in the separate `comment` field,
            encrypted at rest). Empty object when the event kind needs none.
        comment:
          type: string
          nullable: true
          description: >-
            The progress update's optional context comment (PROGRESS_UPDATED /
            MILESTONE_COMPLETED / MILESTONE_REOPENED / PROGRESS_COMMENTED — on a multi-event
            update it rides the last-minted event, topping the newest-first timeline; also on
            historical ACHIEVED_CHANGED rows; stored encrypted at rest, decrypted here).
            Absent on every other event kind.

