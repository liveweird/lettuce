    DaysOffCreateRequest:
      type: object
      required: [type, startDate, endDate]
      properties:
        type:
          type: string
          enum: [PAID, UNPAID]
          description: PAID draws on the owner's paid-days budget; UNPAID is unlimited.
        startDate:
          type: string
          format: date
          description: First day of the period, strict zero-padded ISO YYYY-MM-DD.
        endDate:
          type: string
          format: date
          description: >-
            Last day (inclusive), not before startDate and in the same calendar year — a
            New-Year-spanning wish is two requests.
        startHalf:
          type: boolean
          default: false
          description: The period's first day is a half day. A single-day request expresses its half day here.
        endHalf:
          type: boolean
          default: false
          description: The period's last day is a half day; must stay false on a single-day request (400).

    DaysOffResponse:
      type: object
      required:
        [id, userId, userName, type, status, startDate, endDate, startHalf, endHalf, days,
         createdAt, resolvedById, resolvedByName, resolvedAt, cancelledAt, lastModified]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        userId: { type: integer, format: int64, minimum: 0 }
        userName: { type: string }
        type: { type: string, enum: [PAID, UNPAID] }
        status:
          type: string
          enum: [REQUESTED, ACCEPTED, REJECTED, CANCELLED]
          description: >-
            REQUESTED → ACCEPTED | REJECTED (a direct manager resolves), plus terminal
            CANCELLED (the owner withdraws). REQUESTED and ACCEPTED reserve paid budget;
            REJECTED and CANCELLED free it.
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        startHalf: { type: boolean }
        endHalf: { type: boolean }
        days:
          type: number
          format: double
          description: >-
            The frozen working-day cost in days (0.5 steps) — weekends and public holidays
            inside the period cost nothing; computed against the holiday registry at creation
            and never repriced.
        createdAt: { type: integer, format: int64, description: "Epoch milliseconds, immutable." }
        resolvedById:
          type: integer
          format: int64
          minimum: 0
          nullable: true
          description: The accepting/rejecting manager — null while REQUESTED.
        resolvedByName: { type: string, nullable: true }
        resolvedAt: { type: integer, format: int64, nullable: true, description: Epoch milliseconds. }
        cancelledAt: { type: integer, format: int64, nullable: true, description: Epoch milliseconds. }
        lastModified: { type: integer, format: int64 }

