openapi: 3.1.0
info:
  title: lettuce-api
  version: 1.0.0-SNAPSHOT
  description: |
    JWT-authenticated REST API for users, teams, and feedback exchange.
servers:
  - url: http://localhost:8080
    description: Local dev

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: users
  - name: teams
  - name: feedbacks

paths:
  /login:
    post:
      tags: [auth]
      summary: Exchange credentials for a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Unknown email or wrong password

  /logout:
    post:
      tags: [auth]
      summary: Revoke the bearer token (server-side denylist)
      responses:
        '204':
          description: Token revoked
        '401':
          description: Missing or invalid token

  /users:
    post:
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
              description: URL of the new user resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Missing or invalid token
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [users]
      summary: Fetch a user by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401': { description: Missing or invalid token }
        '404': { description: Not found }
    put:
      tags: [users]
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '204': { description: Updated }
        '401': { description: Missing or invalid token }
        '404': { description: Not found }
        '409':
          description: Email already in use by another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    delete:
      tags: [users]
      summary: Delete a user
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }

  /teams:
    post:
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '400': { description: Validation error (e.g. manager in member list, duplicate members, empty member list) }
        '401': { description: Missing or invalid token }

  /teams/{id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Fetch a team
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401': { description: Missing or invalid token }
        '404': { description: Not found }
    put:
      tags: [teams]
      summary: Replace a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamRequest'
      responses:
        '204': { description: Updated }
        '400': { description: Validation error }
        '401': { description: Missing or invalid token }
    delete:
      tags: [teams]
      summary: Delete a team
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }

  /teams/{id}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/UserIdInPath'
    put:
      tags: [teams]
      summary: Add a member to the team (idempotent)
      responses:
        '204': { description: Member added (or already present) }
        '400': { description: Validation error (e.g. adding the manager as a member) }
        '401': { description: Missing or invalid token }
    delete:
      tags: [teams]
      summary: Remove a member from the team
      responses:
        '204': { description: Removed }
        '400': { description: Cannot remove the last member or the manager via this endpoint }
        '401': { description: Missing or invalid token }

  /feedbacks:
    post:
      tags: [feedbacks]
      summary: Create a feedback record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '400': { description: Validation error or referenced user does not exist }
        '401': { description: Missing or invalid token }

  /feedbacks/{id}:
    parameters:
      - $ref: '#/components/parameters/FeedbackId'
    get:
      tags: [feedbacks]
      summary: Fetch a feedback record
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '401': { description: Missing or invalid token }
        '404': { description: Not found }
    put:
      tags: [feedbacks]
      summary: Replace a feedback record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '204': { description: Updated }
        '400': { description: Validation error or invalid status transition }
        '401': { description: Missing or invalid token }
    delete:
      tags: [feedbacks]
      summary: Delete a feedback record
      responses:
        '204': { description: Deleted }
        '401': { description: Missing or invalid token }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    UserIdInPath:
      name: userId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    TeamId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }
    FeedbackId:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 0 }

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt:
          type: integer
          format: int64
          description: Token expiry as Unix epoch milliseconds

    UserRequest:
      type: object
      required: [name, age, email, password]
      properties:
        name: { type: string, maxLength: 50 }
        age: { type: integer, minimum: 0 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string }

    UserResponse:
      type: object
      required: [id, name, age, email]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        age: { type: integer }
        email: { type: string, format: email }

    TeamRequest:
      type: object
      required: [name, managerId, memberIds]
      properties:
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          items: { type: integer, format: int64, minimum: 0 }

    TeamResponse:
      type: object
      required: [id, name, managerId, memberIds]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        name: { type: string }
        managerId: { type: integer, format: int64, minimum: 0 }
        memberIds:
          type: array
          items: { type: integer, format: int64, minimum: 0 }

    FeedbackRequest:
      type: object
      required: [subjectId, providerId, visibility, status]
      properties:
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN]
        content: { type: string, default: "" }

    FeedbackResponse:
      type: object
      required: [id, subjectId, providerId, visibility, status, content]
      properties:
        id: { type: integer, format: int64, minimum: 0 }
        requesterId:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        subjectId: { type: integer, format: int64, minimum: 0 }
        providerId: { type: integer, format: int64, minimum: 0 }
        visibility:
          type: string
          enum: [PROVIDER_SUBJECT, PROVIDER_REQUESTER, PROVIDER_REQUESTER_SUBJECT, PUBLIC]
        status:
          type: string
          enum: [REQUESTED, DRAFT, SENT, WITHDRAWN]
        content: { type: string }

    ApiError:
      type: object
      required: [error, message]
      properties:
        error: { type: string, example: conflict }
        message: { type: string }
