# Only the front door reaches the app (v4.7.1). The deployment runs with HTTP_BEHIND_PROXY=true, so
# the app trusts X-Forwarded-For/-Proto/-Host — any pod that can reach port 8080 directly could pick
# its own rate-limit key and scheme (security audit, v4.5.2 L6). This admits ingress on 8080 ONLY
# from the ingress controller's pods; everything else in the cluster is dropped.
#
# THIS FILE LIVES IN k8s/templates/ ON PURPOSE: the selector below names the FRONT DOOR, which is a
# per-deployment choice (the reference is ingress-nginx in the `ingress-nginx` namespace — retired,
# local-proof only, see app-ingress.yaml). Adjust both selectors to the controller you actually
# run, then apply it next to the Ingress:
#   kubectl apply -f k8s/templates/app-networkpolicy.yaml
# Applying it without a matching controller makes the app unreachable through anything but
# `kubectl port-forward` (which enters the pod's network namespace directly, not via the policy).
# Kubelet probes keep working on the reference clusters (k3s/OrbStack: node-originated traffic is
# admitted); verify that on yours — a probe blocked by a policy shows up as the pod never Ready.
# Needs a CNI that enforces NetworkPolicy; egress (Teams, SMTP, PostgreSQL) stays unrestricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app
  labels:
    io.kompose.service: app
spec:
  podSelector:
    matchLabels:
      io.kompose.service: app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
