# TEMPLATE — do NOT apply with these placeholder values (the app refuses to start on the
# placeholder JWT secret). Create the real secret out-of-band and never commit it:
#
#   kubectl create secret generic lettuce-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_USER=lettuce \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
#     --from-literal=ADMIN_INITIAL_PASSWORD='<choose-the-first-admin-password>' \
#     --from-literal=DATA_ENCRYPTION_KEY="$(openssl rand -hex 32)" \
#     --from-literal=SMTP_USER='<smtp-username-or-empty>' \
#     --from-literal=SMTP_PASSWORD='<smtp-password-or-empty>'
#
# SMTP_USER/SMTP_PASSWORD feed the outbound-email transport (password-reset feature);
# they are read as optional — omit them when MAIL_TRANSPORT stays "disabled" or the
# SMTP relay needs no auth.
#
# ADMIN_INITIAL_PASSWORD rotates the seeded admin@lettuce.local account away from the
# well-known 'changeme' on first boot; without it, production mode refuses to start.
#
# DATA_ENCRYPTION_KEY encrypts feedback content at rest (AES-256-GCM, applied by the app
# before rows reach PostgreSQL). LOSING IT MEANS LOSING ALL FEEDBACK CONTENT — back it up
# separately from (never inside) the DB backups. Rotate via DATA_ENCRYPTION_KEY_PREVIOUS
# (see CLAUDE.md "Encryption at rest").
apiVersion: v1
kind: Secret
metadata:
  name: lettuce-secrets
type: Opaque
stringData:
  JWT_SECRET: CHANGE-ME-openssl-rand-hex-32
  POSTGRES_USER: lettuce
  POSTGRES_PASSWORD: CHANGE-ME
  ADMIN_INITIAL_PASSWORD: CHANGE-ME
  # Not valid hex, so the app fail-closes on this placeholder in ANY mode.
  DATA_ENCRYPTION_KEY: CHANGE-ME-openssl-rand-hex-32
  SMTP_USER: ""
  SMTP_PASSWORD: ""
