apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: app
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: app
    spec:
      containers:
        - env:
            # Secrets come from the `lettuce-secrets` Secret — see k8s/templates/secret.yaml for how to
            # create it (never commit real values). The app fail-closes on placeholder/burned
            # JWT secrets and on unrotated seed passwords, so a misconfigured deploy crash-loops
            # instead of running with a backdoor.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: JWT_SECRET
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: ADMIN_INITIAL_PASSWORD
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: DATA_ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/lettuce
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/lettuce
            # Production posture (the image default). For throwaway local-cluster testing over
            # plain HTTP (no TLS ingress), set this to "true" — HTTPS redirect / HSTS turn off
            # and the seed credentials are tolerated, exactly like the compose demo.
            - name: KTOR_DEVELOPMENT
              value: "false"
            # The app sits behind the TLS-terminating Ingress in k8s/app-ingress.yaml, which sets
            # X-Forwarded-For (replaced with the real client IP) + X-Forwarded-Proto/-Host, so
            # rate limiting keys on the real client and the HTTPS redirect sees the real scheme
            # and name. HTTP_PROXY_HOPS = trusted proxies that APPEND to X-Forwarded-For (1 =
            # the ingress alone; see application.yaml `http.proxyHops`).
            - name: HTTP_BEHIND_PROXY
              value: "true"
            - name: HTTP_PROXY_HOPS
              value: "1"
            # The read-only GraphQL integration API at /integration/graphql (v3.0.0). Off by
            # default (fail-closed: no routes registered); enabled here so integration clients
            # issued via the ADMIN key registry can query it. Per-key rate limit:
            # INTEGRATION_RATE_LIMIT_PER_MINUTE (default 120).
            - name: INTEGRATION_ENABLED
              value: "true"
            # Outbound email for the self-service password reset. Ships disabled — set
            # "smtp" plus real SMTP_HOST/MAIL_FROM/MAIL_APP_URL to enable (production
            # refuses the `log` transport). SMTP credentials come from the Secret.
            - name: MAIL_TRANSPORT
              value: "disabled"
            - name: SMTP_HOST
              value: ""
            - name: SMTP_PORT
              value: "587"
            - name: SMTP_STARTTLS
              value: "true"
            - name: MAIL_FROM
              value: "lettuce@localhost"
            # The public URL the emails link to — keep in step with the Ingress host
            # (k8s/app-ingress.yaml) and the certificate SAN. Blank = link-less emails (the
            # server warns at startup).
            - name: MAIL_APP_URL
              value: "https://lettuce.example.com"
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: SMTP_PASSWORD
                  optional: true
          # Built locally with `docker build -t lettuce-app:latest .`; OrbStack's
          # Kubernetes shares the Docker image store, so IfNotPresent uses it
          # directly (`:latest` would otherwise default to Always → registry pull).
          image: lettuce-app:latest
          imagePullPolicy: IfNotPresent
          name: lettuce-app
          ports:
            - containerPort: 8080
              protocol: TCP
          # Sized for the tuned JVM baked into the image (SerialGC + -Xmx256m + C1): ~270 MiB RSS
          # under light load. Request covers steady state; the 512 MiB limit bounds it with headroom.
          resources:
            requests:
              cpu: "250m"
              memory: "320Mi"
            limits:
              memory: "512Mi"
          # The image sets WEB_STATIC_DIR, so / serves the SPA. Initial delays
          # cover JVM boot + Flyway; until postgres is ready the app restarts,
          # which the rollout absorbs.
          # Both probes send X-Forwarded-Proto: https — the header the TLS-terminating
          # ingress sets (HTTP_BEHIND_PROXY above makes the app trust it). Without it,
          # production mode answers the plain-HTTP probe with a 301 to https://<pod-ip>/,
          # which the kubelet FOLLOWS (same host) into a refused :443 — readiness never
          # passes and liveness restarts the pod every period (the v3.6.1 crash loop).
          readinessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 30
            periodSeconds: 10
      restartPolicy: Always
