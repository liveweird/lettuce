apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: app
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: app
    spec:
      containers:
        - env:
            - name: JWT_SECRET
              value: dev-only-9f3c1a7b2e8d4655b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f60718293a4b5c6d
            - name: POSTGRES_JDBC_URL
              value: jdbc:postgresql://postgres:5432/lettuce
            - name: POSTGRES_PASSWORD
              value: lettuce
            - name: POSTGRES_R2DBC_URL
              value: r2dbc:postgresql://postgres:5432/lettuce
            - name: POSTGRES_USER
              value: lettuce
          # Built locally with `docker build -t lettuce-app:latest .`; OrbStack's
          # Kubernetes shares the Docker image store, so IfNotPresent uses it
          # directly (`:latest` would otherwise default to Always → registry pull).
          image: lettuce-app:latest
          imagePullPolicy: IfNotPresent
          name: lettuce-app
          ports:
            - containerPort: 8080
              protocol: TCP
          # The image sets WEB_STATIC_DIR, so / serves the SPA. Initial delays
          # cover JVM boot + Flyway; until postgres is ready the app restarts,
          # which the rollout absorbs.
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      restartPolicy: Always
