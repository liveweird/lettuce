apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (HEAD)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (HEAD)
      labels:
        io.kompose.service: postgres
    spec:
      # Pod hardening (v3.11.0, checkup-#35 Tier D — the app-deployment.yaml treatment applied to
      # the database): the container starts DIRECTLY as the image's `postgres` user (uid/gid 70
      # on the alpine image), so the entrypoint's root-only chown + su-exec step never runs and
      # every capability can be dropped. `fsGroup: 70` makes a freshly provisioned PVC writable;
      # a volume populated earlier by the root-start path is already owned by 70:70 and needs
      # nothing. A data directory RESTORED as root (backup-and-restore.md) must be `chown -R
      # 70:70` once — the symptom is a permission-denied crash loop at startup, never data loss.
      # Proven live on OrbStack (uid 70, read-only rootfs, pod restart against a populated PVC).
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - env:
            - name: POSTGRES_DB
              value: lettuce
            # Credentials come from the `lettuce-secrets` Secret (see k8s/templates/secret.yaml) so the
            # same values feed both this container and the app's connection settings.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lettuce-secrets
                  key: POSTGRES_USER
          # Keep this digest aligned with Compose and PostgresTestSupport.
          image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          # kompose emits the compose healthcheck as a single-string argv, which
          # exec can't run — keep the command as a proper argv list. The
          # readinessProbe gates the Service endpoint (the compose
          # `depends_on: service_healthy` equivalent).
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lettuce", "-d", "lettuce"]
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "lettuce", "-d", "lettuce"]
            initialDelaySeconds: 10
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          name: lettuce-postgres
          ports:
            - containerPort: 5432
              protocol: TCP
          # Sized like the app pod (Checkup #36 Tier C): a single-tenant PostgreSQL with the
          # default 128 MiB shared_buffers idles well under 256 MiB; the limit bounds a runaway
          # backend without starving the app on a small node.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: postgres-data
            # The two places postgres must write outside its data directory under a read-only
            # root filesystem: the Unix socket directory (`pg_isready` in the probes above and the
            # entrypoint's bootstrap both use it) and scratch space.
            - mountPath: /var/run/postgresql
              name: run
            - mountPath: /tmp
              name: tmp
      restartPolicy: Always
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
