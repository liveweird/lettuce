name: quality

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Test deployment image validation
        run: ./scripts/test-render-app-deployment.sh

      - name: Test recovery schema comparison
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Test Docker build context
        run: ./scripts/test-docker-build-context.sh

      # check includes tests, Detekt, Kover verification, and dependency alignment.
      - name: Run backend quality gates
        run: |
          for state in gradle/verification-metadata.xml gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile core/gradle.lockfile core/buildscript-gradle.lockfile server/gradle.lockfile server/buildscript-gradle.lockfile; do
            test -s "$state"
          done
          ./gradlew --dependency-verification strict check :server:installDist
          git diff --exit-code -- gradle/verification-metadata.xml gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile core/gradle.lockfile core/buildscript-gradle.lockfile server/gradle.lockfile server/buildscript-gradle.lockfile

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Check for unused web code
        working-directory: web
        run: npm run knip

      - name: Run web coverage gate
        working-directory: web
        run: npm run test:coverage

      # Per-chunk raw/gzip/brotli sizes of the build, plus (since v4.15.1) a budget gate on the initial payload.
      # It runs after lint, knip and coverage so an overrun never hides those results. The step fails when the
      # files `index.html` loads up front exceed 360,000 B gzip or 12 files (v4.15.1 measured ~333 kB over 8,
      # ~8 % headroom; the first baseline was 480,795 B over 38). Raise a limit only in the PR that deliberately
      # grows the initial payload, with the reason. Node stdlib only; the script lives outside web/
      # (perf/web/bundle-report.mjs); the JSON is written first, so the artifact uploads (!cancelled()) on an overrun too.
      - name: Bundle-size report
        run: node perf/web/bundle-report.mjs --out "$RUNNER_TEMP/web-bundle-report.json" --max-initial-gzip 360000 --max-initial-files 12

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: web-bundle-report
          path: ${{ runner.temp }}/web-bundle-report.json
          retention-days: 30

  api-contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install schema generator
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Lint OpenAPI contract
        run: >-
          npx --yes @stoplight/spectral-cli@6.15.0 lint
          server/src/main/resources/openapi/documentation.yaml
          --ruleset api-guidelines/api-guidelines.spectral.yaml
          --fail-severity error

      - name: Verify generated web schema is current
        working-directory: web
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts

  e2e-static:
    name: E2E source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Type-check e2e suite
        working-directory: e2e
        run: npm run typecheck

      - name: Check spec and scenario pairing
        working-directory: e2e
        run: npm run check:scenarios

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Trivy over every Gradle lockfile - the runtime, test, build-tool and plugin classpaths
      # (the three buildscript lockfiles) - failing on any HIGH or CRITICAL advisory. The
      # advisory database is fetched at run time, so a newly published advisory can turn this
      # job red with no code change: that is the point (see "Automatic CI gates" in
      # .claude/docs/testing.md). The image is pinned by digest like every other container.
      - name: Scan Gradle lockfiles
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-locks/core" "$RUNNER_TEMP/gradle-locks/server" "$RUNNER_TEMP/trivy-cache" "$RUNNER_TEMP/trivy-out"
          cp gradle.lockfile settings-gradle.lockfile buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/"
          cp core/gradle.lockfile core/buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/core/"
          cp server/gradle.lockfile server/buildscript-gradle.lockfile "$RUNNER_TEMP/gradle-locks/server/"
          docker run --rm \
            -v "$RUNNER_TEMP/gradle-locks:/scan:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/cache" \
            -v "$RUNNER_TEMP/trivy-out:/out" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            fs --scanners vuln --include-dev-deps --format json \
            --output /out/gradle-vulnerabilities.json --cache-dir /cache --no-progress /scan
          python3 - <<'PY'
          import collections
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "trivy-out", "gradle-vulnerabilities.json")) as report:
              results = json.load(report).get("Results") or []
          # Trivy matches lockfiles by name; one it stops recognising would silently leave the
          # scan, so every copied lockfile must appear as a target (with or without findings).
          expected = {
              "gradle.lockfile", "settings-gradle.lockfile", "buildscript-gradle.lockfile",
              "core/gradle.lockfile", "core/buildscript-gradle.lockfile",
              "server/gradle.lockfile", "server/buildscript-gradle.lockfile",
          }
          scanned = {result["Target"] for result in results}
          print("Scanned lockfiles:", ", ".join(sorted(scanned)))
          if expected - scanned:
              raise SystemExit(f"Lockfiles missing from the scan: {sorted(expected - scanned)}")
          found = [
              (vulnerability["Severity"], vulnerability["VulnerabilityID"], vulnerability["PkgName"],
               vulnerability["InstalledVersion"], result["Target"])
              for result in results
              for vulnerability in result.get("Vulnerabilities") or []
          ]
          print("Gradle dependency advisories:", dict(collections.Counter(row[0] for row in found)))
          for row in sorted(set(found)):
              print("  " + " ".join(row))
          if any(row[0] in ("HIGH", "CRITICAL") for row in found):
              raise SystemExit("HIGH or CRITICAL Gradle dependency advisory")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: gradle-vulnerabilities
          path: ${{ runner.temp }}/trivy-out/gradle-vulnerabilities.json
          retention-days: 7
